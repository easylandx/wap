      var dx=tx-p.x, dz=tz-p.z, d=Math.hypot(dx,dz);
      var want = d>0.6 ? Math.atan2(-dx,-dz) : tyaw, diff=wrapA(want-yaw);
      yaw+=Math.max(-2.4*dt,Math.min(2.4*dt,diff));
      if (d>0.05){ var k=Math.abs(diff)<0.7?1:0.15, step=Math.min(d,3.2*k*dt); p.x+=dx/d*step; p.z+=dz/d*step; }
      if (d<0.1 && Math.abs(wrapA(tyaw-yaw))<0.06){ T.phase='dwell'; T.t=0; T.wait=0; }
      return;
    }
    if (T.phase==='dwell'){
      var it=T.st.it, ready=it.emb||it.state==='done';
      if (!ready && T.wait<10){ T.wait+=dt; return; }          // give a slow image up to 10 s to arrive
      if (!T.said){ T.said=true; say(spoken(it)); }
      T.t+=dt; if (T.t>3.6 && !(rd.on&&rd.busy&&T.t<20)){ T.seen.push(it); T.phase='pick'; }
    }
  }

  // menu
  var tb=document.createElement('button'); tb.id='tour'; tb.className='room'; tb.textContent='▶ Walk tour (T)'; tb.onclick=toggleTour; roomsEl.appendChild(tb);
  var rsel=document.createElement('select'); rsel.id='roomsel'; rsel.title='Choose a room';
  ROOMS.forEach(function(R,i){ var o=document.createElement('option'); o.value=i; o.textContent=roomNo(i)+' · '+R.name; rsel.appendChild(o); });
  rsel.onchange=function(){ stopTour(); enterRoom(+rsel.value); rsel.blur(); };
  roomsEl.insertBefore(rsel, tb);


  // ---------- Artist search ----------
  var srch=document.getElementById('srch'), sq=document.getElementById('sq'), sl=document.getElementById('sl'), openArtist='';
  function artistIndex(){
    var map={}, out=[];
    ROOMS.forEach(function(R){ R.list.forEach(function(it){
      if (it.emb || it.failed || !it.artist) return;
      var a=map[it.artist]; if (!a){ a=map[it.artist]={name:it.artist, key:norm(it.artist), sort:norm(surname(it.artist)+' '+it.artist), pieces:[]}; out.push(a); }
      a.pieces.push(it);
    }); });
    return out.sort(function(x,y){ return x.sort<y.sort?-1:x.sort>y.sort?1:0; });
  }
  function artistMatches(a,q){
    if (!q) return true; var words=a.key.split(' ');
    return q.split(' ').every(function(t){ return words.some(function(w){ return w.indexOf(t)===0; }); });
  }
  function renderSearch(){
    var q=norm(sq.value), list=artistIndex().filter(function(a){ return artistMatches(a,q); });
    sl.innerHTML='';
    if (!list.length){ var n=document.createElement('div'); n.className='none'; n.textContent='No artist found'; sl.appendChild(n); return; }
    list.forEach(function(a){
      var row=document.createElement('div'); row.className='ar';
      var nm=document.createElement('div'); nm.textContent=a.name; var ct=document.createElement('span'); ct.textContent=a.pieces.length+(a.pieces.length===1?' work':' works');
      row.appendChild(nm); row.appendChild(ct); sl.appendChild(row);
      var open = openArtist===a.name || list.length===1;
      row.onclick=function(){ openArtist = (openArtist===a.name && list.length>1) ? '' : a.name; renderSearch(); };
      if (open) a.pieces.forEach(function(it){
        var b=document.createElement('button'); b.className='pc'; b.textContent=it.title;
        var sm=document.createElement('small'); sm.textContent=it.room.name; b.appendChild(sm);
        b.onclick=function(){ gotoPiece(it); }; sl.appendChild(b);
      });
    });
  }
  function openSearch(){ stopTour(); srch.style.display='block'; sq.value=''; openArtist=''; renderSearch(); setTimeout(function(){ try{ sq.focus(); }catch(e){} },50); }
  function closeSearch(){ srch.style.display='none'; try{ sq.blur(); }catch(e){} lastAct=Date.now(); }
  function gotoPiece(it){
    var ri=ROOMS.indexOf(it.room); closeSearch(); stopTour();
    if (ri>=0 && ri!==roomIdx) enterRoom(ri);
    goArt(it);
  }
  var sb=document.createElement('button'); sb.className='room'; sb.textContent='🔍 Artists'; sb.onclick=openSearch; roomsEl.insertBefore(sb, tb);
  sq.addEventListener('input', function(){ openArtist=''; renderSearch(); });
  document.getElementById('sx').onclick=closeSearch;

  // ---------- Controls ----------
  var keys={}, yaw=0, pitch=0, nav=null, numBuf='', numT=null;
  var intro=document.getElementById('intro');
  document.getElementById('enter').onclick=function(){ unlockSpeech(); intro.style.display='none'; };
  ['touchend','pointerup','click','keydown'].forEach(function(n){ addEventListener(n, unlockSpeech, {passive:true, capture:true}); });
  addEventListener('keydown', function(e){ if (e.target && e.target.tagName==='INPUT'){ if (e.code==='Escape') closeSearch(); return; } keys[e.code]=true; if (e.code==='KeyE') openLink(); if (e.code==='KeyT') toggleTour(); if (e.code==='KeyR') toggleRead();
    if (tour){ if (e.code==='Space'){ e.preventDefault(); tourPause(); } if (e.code==='KeyN') tourNext(); if (e.code==='KeyP') tourPrev(); if (e.code==='Equal'||e.code==='NumpadAdd') tourSpeed(1); if (e.code==='Minus'||e.code==='NumpadSubtract') tourSpeed(-1); }
    var m=/^(?:Digit|Numpad)([0-9])$/.exec(e.code); if (m){ clearTimeout(numT); numBuf+=m[1]; if (numBuf.length>2) numBuf=m[1];
      var go=function(){ var ri=roomAt(+numBuf); numBuf=''; if (ROOMS[ri]){ stopTour(); enterRoom(ri); } };
      // a single digit that could still become a two-digit room number waits briefly for a second digit
      if (+numBuf*10>ROOMS.length || numBuf.length===2) go(); else numT=setTimeout(go,650); } });
  addEventListener('keyup', function(e){ keys[e.code]=false; });
  // ---------- Idle: start the walk tour after 8 s without input once inside the gallery ----------
  var lastAct=Date.now();
  ['keydown','mousedown','mousemove','wheel','touchstart','pointerdown'].forEach(function(n){ addEventListener(n, function(){ lastAct=Date.now(); }, {passive:true, capture:true}); });
  document.getElementById('enter').addEventListener('click', function(){ lastAct=Date.now(); });
  setInterval(function(){
    if (tour || intro.style.display!=='none' || srch.style.display==='block'){ lastAct=Date.now(); return; }
    if (Date.now()-lastAct>=8000){ lastAct=Date.now(); startTour(); }
  }, 500);
  function hold(id,k){ var b=document.getElementById(id); ['touchstart','mousedown'].forEach(function(ev){ b.addEventListener(ev,function(e){ e.preventDefault(); keys[k]=true; }); });
    ['touchend','mouseup','mouseleave'].forEach(function(ev){ b.addEventListener(ev,function(){ keys[k]=false; }); }); }
  hold('fw','KeyW'); hold('bk','KeyS');
  var ray=new THREE.Raycaster();
  function openLink(){
    ray.setFromCamera({x:0,y:0},camera);
    var h=ray.intersectObjects(clickable)[0];
    var it = h && h.distance<9 ? h.object.userData.item : (cur&&cur.it);
    if (it && it.link) window.open(it.link,'_blank','noopener');
  }
  // ---------- Click / tap navigation ----------
  // click or tap the floor or a wall: walk that way · a painting: go and stand in front of it · its white title plate: open its link · drag: look around
  var cvs=renderer.domElement, ptr=null;
  function aim(e){
    var r=cvs.getBoundingClientRect();
    ray.setFromCamera({x:((e.clientX-r.left)/r.width)*2-1, y:-((e.clientY-r.top)/r.height)*2+1}, camera);
    return roomGroup ? ray.intersectObjects(roomGroup.children,true)[0] : null;
  }
  function goArt(it){
    var st=stations.filter(function(q){ return q.it===it; })[0]; if (!st) return false;
    var side=st.pos.x<0?-1:1, vd=tourDist();
    nav={x:side*(5.9-vd), z:st.pos.z, yaw:side<0?Math.PI/2:-Math.PI/2, pitch:Math.atan(0.65/vd)};
    return true;
  }
  function goDir(h){
    var p=camera.position, dx, dz;
    if (h){ dx=h.point.x-p.x; dz=h.point.z-p.z; } else { dx=-Math.sin(yaw); dz=-Math.cos(yaw); }
    var d=Math.hypot(dx,dz);
    if (d<0.2){ dx=-Math.sin(yaw); dz=-Math.cos(yaw); d=1; }
    var dist=Math.min(d,9);
    nav={x:Math.max(-5,Math.min(5,p.x+dx/d*dist)), z:Math.max(-half+1.2,Math.min(half-1.2,p.z+dz/d*dist)), yaw:Math.atan2(-dx,-dz), pitch:0};
  }
  function tap(e){
    var was=!!tour; if (was) stopTour();
    var h=aim(e), it=h&&h.object.userData.item;
    if (it){
      if (h.object.userData.label && it.link && !was){ window.open(it.link,'_blank','noopener'); return; }
      if (goArt(it)) return;
    }
    goDir(h);
  }
  cvs.addEventListener('pointerdown', function(e){ ptr={x:e.clientX,y:e.clientY,lx:e.clientX,ly:e.clientY,drag:false}; try{ cvs.setPointerCapture(e.pointerId); }catch(_){} });
  cvs.addEventListener('pointermove', function(e){
    if (!ptr){ if (e.pointerType==='mouse'){ var h=aim(e), l=h&&h.object.userData.label&&h.object.userData.item&&h.object.userData.item.link; cvs.style.cursor=l?'pointer':'default'; } return; }
    if (!ptr.drag && Math.hypot(e.clientX-ptr.x,e.clientY-ptr.y)>8){ ptr.drag=true; if (tour) stopTour(); }
    if (ptr.drag){ yaw-=(e.clientX-ptr.lx)*.005; pitch=Math.max(-1.2,Math.min(1.2,pitch-(e.clientY-ptr.ly)*.004)); nav=null; }
    ptr.lx=e.clientX; ptr.ly=e.clientY;
  });
  cvs.addEventListener('pointerup', function(e){ var q=ptr; ptr=null; if (q && !q.drag) tap(e); });
  cvs.addEventListener('pointercancel', function(){ ptr=null; });
  addEventListener('resize', function(){ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

  // ---------- Loop ----------
  var clock=new THREE.Clock();
  function tick(){
    var dt=Math.min(clock.getDelta(),.05), sp=(keys.ShiftLeft?6:3.4)*dt;
    var f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0), s=(keys.KeyD?1:0)-(keys.KeyA?1:0);
    if (tour && (f||s||keys.ArrowLeft||keys.ArrowRight)) stopTour();
    var p=camera.position;
    if (tour){ if (!tour.paused) tourStep(dt*SPEEDS[tour.si],p); }
    else {
      if (nav && (f||s||keys.ArrowLeft||keys.ArrowRight)) nav=null;
      if (nav){
        var nx=nav.x-p.x, nz=nav.z-p.z, nd=Math.hypot(nx,nz), ny=wrapA(nav.yaw-yaw);
        yaw+=Math.max(-3*dt,Math.min(3*dt,ny)); pitch+=(nav.pitch-pitch)*Math.min(1,4*dt);
        if (nd>0.05){ var nk=Math.abs(ny)<0.9?1:0.2, ns=Math.min(nd,4.5*nk*dt); p.x+=nx/nd*ns; p.z+=nz/nd*ns; }
        if (nd<=0.06 && Math.abs(ny)<0.03) nav=null;
      } else {
        if (keys.ArrowLeft) yaw+=1.6*dt; if (keys.ArrowRight) yaw-=1.6*dt;
        p.x+=(-Math.sin(yaw)*f+Math.cos(yaw)*s)*sp; p.z+=(-Math.cos(yaw)*f-Math.sin(yaw)*s)*sp;
      }
    }
    p.x=Math.max(-5,Math.min(5,p.x)); p.z=Math.max(-half+1.2,Math.min(half-1.2,p.z));
    camera.rotation.set(pitch,yaw,0);
    var best=null, bd=5.5, fx=-Math.sin(yaw), fz=-Math.cos(yaw);
    stations.forEach(function(st){ var dx=st.pos.x-p.x, dz=st.pos.z-p.z, d=Math.hypot(dx,dz); if (d<bd && (dx*fx+dz*fz)/d>.45){ bd=d; best=st; } });
    if (best!==cur){ cur=best;
      if (cur){ var it=cur.it; cap.style.display='block';
        cap.innerHTML='<b></b><a target="_blank" rel="noopener"></a><small>Press E or click the title plate to open</small>';
        cap.querySelector('b').textContent=it.t; var a=cap.querySelector('a'); a.href=it.link||'#'; a.textContent=it.link||'searching open archives…'; }
      else cap.style.display='none'; }
    else if (cur){ var a2=cap.querySelector('a'); if (a2 && cur.it.link && a2.getAttribute('href')!==cur.it.link){ a2.href=cur.it.link; a2.textContent=cur.it.link; } }
    renderer.render(scene,camera); requestAnimationFrame(tick);
  }
  enterRoom(Math.floor(Math.random()*ROOMS.length)); tick();
})();
</script>
</body>
</html>
