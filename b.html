<style>
:root{--ink:#161b33;--deep:#0f1226;--gilt:#c9a24a;--vellum:#efe6d2;--mute:#9aa0bf;--dur:.2s;--fg:#efe6d2;--accent:#c9a24a;--line:#3a4170;--fs:clamp(1.2rem,1rem + .6vw,1.5rem);

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none}

#text,#meas{width:100%;height:100%;overflow:hidden;background:var(--vellum);color:#2a2418;font-family:var(--serif);font-size:calc(var(--fs)*var(--k,1));line-height:1.65;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab;
padding-top:max(64px,calc(env(safe-area-inset-top) + 56px));padding-bottom:max(112px,calc(env(safe-area-inset-bottom) + 104px));
padding-left:max(22px,calc((100% - 46rem)/2),calc(env(safe-area-inset-left) + 18px));padding-right:max(22px,calc((100% - 46rem)/2),calc(env(safe-area-inset-right) + 18px))}

#text .hd,#meas .hd{display:block;font-weight:700;color:#8a6a1c;margin-bottom:.35em}
#text span.hl{background:#c9a24a66;border-radius:3px}
[hidden]{display:none!important}
.fab{position:fixed;z-index:5;transition:opacity .25s}
body.hide .fab{opacity:0;pointer-events:none}
.fab,.dock button{color:#efe6d2;background:rgba(15,18,38,.82);border:1px solid var(--gilt);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.dock{background:none!important;border:0!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;left:50%;transform:translateX(-50%);bottom:var(--sb);display:flex;gap:10px;align-items:center}

padding-top:max(14px,calc(env(safe-area-inset-top) + 10px));padding-bottom:16px;padding-left:max(18px,calc(env(safe-area-inset-left) + 12px));padding-right:max(18px,calc(env(safe-area-inset-right) + 12px))}

<script>
(()=>{
const $=s=>document.querySelector(s);
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const T={
en:{read:'Read aloud',stop:'Pause',prev:'Previous page',next:'Next page',text:'Text',scan:'Scan',load:'Finding Bibles on archive.org…',err:'Could not reach archive.org. Check your connection and try again.',retry:'Try again',speed:'Speed',page:'Page',ed:'Edition',blank:'This page has no readable text.',noimg:'This page image did not load.',notext:'The text of this book is not available.',none:'No open editions found here. Try another category.',kind:'Category',full:'Complete Bibles',easy:'Easy to read',theme:'Switch theme',rough:'The scanned text of this edition looks rough. Try another edition.',custom:'Other edition…',ask:'archive.org link or identifier',bad:'Could not open that item.'},
es:{read:'Leer en voz alta',stop:'Pausa',prev:'Página anterior',next:'Página siguiente',text:'Texto',scan:'Escaneo',load:'Buscando Biblias en archive.org…',err:'No se pudo conectar con archive.org. Comprueba tu conexión e inténtalo de nuevo.',retry:'Reintentar',speed:'Velocidad',page:'Página',ed:'Edición',blank:'Esta página no tiene texto legible.',noimg:'No se cargó la imagen de esta página.',notext:'El texto de este libro no está disponible.',none:'No hay ediciones abiertas en esta categoría. Prueba con otra.',kind:'Categoría',full:'Biblias completas',easy:'Fácil de leer',theme:'Cambiar tema',rough:'El texto escaneado de esta edición tiene muchos errores. Prueba con otra edición.',custom:'Otra edición…',ask:'Enlace o identificador de archive.org',bad:'No se pudo abrir ese elemento.'}
};
const CLR={en:{b:'Clear cache and start over',ok:'Done ✓',err:'Could not clear the cache'},es:{b:'Borrar caché y empezar de nuevo',ok:'Listo ✓',err:'No se pudo borrar la caché'}};
/* Source selection: the most downloaded complete, open (not borrow-only) Bibles on archive.org.
   English favours King James / Authorized editions; Spanish favours Reina-Valera. */
const Q={
 en:{full:'title:(bible)',
  easy:'title:(bible OR testament OR gospels OR psalms) AND title:("basic english" OR plain OR modern OR "twentieth century" OR simple OR easy OR today OR "world english" OR everyday OR paraphrase)'},
 es:{full:'title:(biblia OR bible)',
  easy:'title:(biblia OR testamento OR evangelios OR salmos) AND title:(sencill* OR popular OR moderna OR actual OR hoy OR claro OR facil OR fácil)'}
};
const LANGQ={en:'language:(eng OR English)',es:'language:(spa OR Spanish)'};
const BASE=/commentar|dictionar|concordanc|study|lexicon|harmony|sermon|handbook|atlas|encyclop|hymn|comentario|diccionario|concordancia/i;
const PART=/stor(y|ies)|children|infantil|guide|history|apocryph|selections|verses|psalter|notes|nuevo testamento|new testament|gospel/i;
const TERM=/bible|biblia|testament|gospel|evangel|psalm|salmo/i;
const FULL={en:/king james|authori[sz]ed|holy bible/i,es:/reina|valera|santa biblia|sagrada biblia|biblia/i};
const EASY=/basic english|plain|modern|twentieth|simple|easy|today|world english|everyday|paraphrase|sencill|popular|moderna|actual|hoy|claro|f[aá]cil/i;
const K=['full','easy'];
/* Edition opened the first time (after that the last one used is reopened, on the page where the reader left off) */
const KJVS=[{id:'kjv-bible',title:'The Holy Bible, King James Version (2024 scan)',year:2024},{id:'the-holy-bible-kjv',title:'The Holy Bible, King James Version (1769 text)',year:1769}];
const PREF={es:{full:{id:'tx-rv'},easy:{id:'tx-bes'}},en:{full:{id:'tx-bsb'},easy:{id:'tx-bbe'}}};
const syn=window.speechSynthesis;
const img=$('#img'),sheet=$('#sheet'),stage=$('#stage'),txt=$('#text'),pg=$('#pg');
let lang=ls.get('bible-lang')||((navigator.language||'en').slice(0,2)==='es'?'es':'en');
let theme=ls.get('bible-theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'),cur=-1,resume=null,kind=['easy'].includes(ls.get('bible-kind'))?ls.get('bible-kind'):'full';
let eds=[],ed=null,page=0,textMode=false,reading=false,token=0,wake=null;

function setTheme(){document.documentElement.dataset.theme=theme;$('#theme').textContent=theme==='light'?'☾':'☀';$('#theme').setAttribute('aria-label',T[lang].theme)}
function kindUI(){const e=$('#kind');if(e.dataset.l!==lang){e.dataset.l=lang;e.setAttribute('aria-label',T[lang].kind);e.innerHTML=K.map(k=>`<option value="${k}" title="${T[lang].tip?T[lang].tip['k_'+k]:''}">${T[lang][k]}</option>`).join('')}e.value=kind}
function msg(s,retry){$('#msg').textContent=s||'';$('#retry').hidden=!retry;$('#toast').hidden=!s}
function ui(){
  const t=T[lang];
  document.documentElement.lang=lang;setTheme();kindUI();
  document.querySelectorAll('.lang button[data-l]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));
  $('#ed').setAttribute('aria-label',t.ed);
  $('#prev').setAttribute('aria-label',t.prev);$('#next').setAttribute('aria-label',t.next);
  $('#spl').textContent=t.speed;$('#pl').textContent=t.page;$('#retry').textContent=t.retry;
  $('#play').textContent=reading?'❚❚':'▶';$('#play').setAttribute('aria-label',reading?t.stop:t.read);ui2();
  $('#view').textContent=textMode?t.scan:t.text;
  $('#play').hidden=!syn;
}
const score=d=>{const t=d.title||'',n=d.n||0,y=d.year||0;let s=0;
  if(BASE.test(t)||!TERM.test(t))return -9;
  if(kind==='full'){
    if(FULL[lang].test(t))s+=4;
    if(/reina|valera|king james|authori[sz]ed/i.test(t))s+=3;
    if(PART.test(t))s-=8;
    if(n>=900&&n<=3000)s+=4;else if(n<400)s-=5;
    if(y&&y<=1923)s+=1;
  }else{
    if(EASY.test(t))s+=5;
    if(n>=30)s+=1;
  }
  return s};

async function loadEditions(){
  stopRead();ed=null;eds=[];$('#ed').innerHTML='';
  msg(T[lang].load);
  const q=Q[lang][kind]+' AND mediatype:texts AND '+LANGQ[lang]+' AND NOT access-restricted-item:true';
  const url='https://archive.org/advancedsearch.php?q='+encodeURIComponent(q)+
    '&fl%5B%5D=identifier&fl%5B%5D=title&fl%5B%5D=year&fl%5B%5D=imagecount&sort%5B%5D=downloads+desc&rows=100&output=json';
  try{
    const r=await fetch(url);if(!r.ok)throw 0;
    const seen=new Set();
    const rawAll=(await r.json()).response.docs
      .filter(d=>+d.imagecount>=(kind==='full'?100:20)&&d.title)
      .map((d,i)=>{const o={id:d.identifier,title:[].concat(d.title)[0],year:parseInt([].concat(d.year||[])[0])||0,n:+d.imagecount};o.s=score(o)-i*.02;return o});
    let docs=rawAll
      .filter(o=>o.s>=3)
      .filter(o=>{const k=o.title.toLowerCase().replace(/[^a-z0-9ñáéíóú]+/g,' ').slice(0,40)+o.year;if(seen.has(k))return false;seen.add(k);return true})
      .sort((a,b)=>b.s-a.s).slice(0,15);
    const best=docs[0];
    /* The pinned default edition must always be offered, even when its score or download rank leaves it out of the top 15 */
    {const p0=PREF[lang]&&PREF[lang][kind];
     if(p0&&p0.t){const h=rawAll.find(d=>d.year===p0.y&&p0.re.test(d.title)&&p0.t.test(d.title)&&d.n>=p0.n[0]&&d.n<=p0.n[1]);if(h&&!docs.some(x=>x.id===h.id))docs.push(h)}}
    try{const mt=JSON.parse(ls.get('bible-meta-'+lang+kind)||'null');if(mt&&mt.id&&mt.n&&!/^tx-/.test(mt.id)&&!docs.some(d=>d.id===mt.id))docs.push({id:mt.id,title:mt.title,year:mt.year||0,n:mt.n,s:0})}catch(e){}
    /* Extra King James scans always offered in English (complete Bibles on archive.org) */
    await Promise.all((lang==='en'&&kind==='full'?KJVS:[]).filter(a=>!docs.some(d=>d.id===a.id)).map(async a=>{
      let n=0;
      try{const m=(await(await fetch('https://archive.org/metadata/'+a.id)).json()).metadata||{};n=+m.imagecount||+m.pages||0}catch(e){}
      if(!n){try{const pj=await(await fetch(`https://archive.org/download/${a.id}/${a.id}_page_numbers.json`)).json();n=(pj.pages||[]).length}catch(e){}}
      if(n)docs.push({id:a.id,title:a.title,year:a.year,n,s:0})}));
    docs.sort((a,b)=>(b.year||-1)-(a.year||-1)||b.s-a.s);
    { const vs=vlist();docs=vs.concat(docs.filter(d=>!vs.some(v=>v.id===d.id))) }
    if(!docs.length){msg(T[lang].none,true);return}
    eds=docs;
    $('#ed').innerHTML=docs.map(edOpt).join('')+`<option value="x">${T[lang].custom}</option>`;
    const saved=ls.get('bible-user-'+lang+kind)==='1'?ls.get('bible-ed-'+lang+kind):null;let k=docs.findIndex(d=>d.id===saved);
    if(k<0){const pf=PREF[lang]&&PREF[lang][kind];k=pf&&pf.id?docs.findIndex(d=>d.id===pf.id):-1;if(k<0&&pf)k=docs.findIndex(d=>!d.v&&d.year===pf.y&&pf.re.test(d.title)&&(!pf.t||pf.t.test(d.title))&&d.n>=pf.n[0]&&d.n<=pf.n[1]);
      if(k<0&&pf)k=docs.findIndex(d=>!d.v&&d.year===pf.y&&pf.re.test(d.title)&&d.n>=pf.n[0]&&d.n<=pf.n[1]);
      /* The pinned edition is not part of this category's results (e.g. "Fácil de leer"): look it up in the complete-Bibles search and add it */
      if(k<0&&pf&&pf.t){try{
        const u2='https://archive.org/advancedsearch.php?q='+encodeURIComponent(Q[lang].full+' AND year:'+pf.y+' AND mediatype:texts AND '+LANGQ[lang]+' AND NOT access-restricted-item:true')+'&fl%5B%5D=identifier&fl%5B%5D=title&fl%5B%5D=year&fl%5B%5D=imagecount&sort%5B%5D=downloads+desc&rows=100&output=json';
        const hit=(await(await fetch(u2)).json()).response.docs.map(d=>({id:d.identifier,title:[].concat(d.title||'')[0],year:parseInt([].concat(d.year||[])[0])||0,n:+d.imagecount,s:0}))
          .find(d=>d.year===pf.y&&pf.re.test(d.title)&&pf.t.test(d.title)&&d.n>=pf.n[0]&&d.n<=pf.n[1]);
        if(hit){docs.push(hit);eds=docs;$('#ed').innerHTML=docs.map(edOpt).join('')+`<option value="x">${T[lang].custom}</option>`;k=docs.indexOf(hit)}}catch(e){}}}
    if(k<0)k=docs.indexOf(best);
    if(k<0)k=0;
    $('#ed').value=k;open(docs[k]);msg('');
  }catch(e){

document.querySelectorAll('.lang button[data-l]').forEach(b=>b.onclick=()=>{if(b.dataset.l===lang)return;lang=b.dataset.l;ls.set('bible-lang',lang);ui();loadEditions()});
document.addEventListener('keydown',e=>{
  if(/INPUT|SELECT/.test(document.activeElement.tagName))return;
  if(e.key==='ArrowRight')go(1);
  else if(e.key==='ArrowLeft')go(-1);
  else if(e.key===' '&&document.activeElement.tagName!=='BUTTON'){e.preventDefault();toggle()}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&reading&&!wake)navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>wake=w).catch(()=>{})});

window.addEventListener('resize',()=>{if(textMode&&ed){clearTimeout(rzT);rzT=setTimeout(()=>renderText(),160)}});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(textMode&&ed)renderText()});
const BUILD='2.9';
/* The button also forgets the saved reading position, edition and category (bible-pos-*, -ed-*, -user-*, -meta-*, -kind) and the saved chapter texts (bible-ch-*)
   so the app reopens on the default edition, on its cover. Language and theme are kept.
   Clears ONLY this app's cache: caches named "bible*" or holding this app's own files,
   and the service worker registered for this app's folder. Other apps, cookies,
   passwords and localStorage are never touched. */
async function clearAppCache(){
  /* Caches and service workers only exist on http(s) pages. From a local file there is nothing to clear. */
  if(!/^https?:$/.test(location.protocol))return;
  const base=new URL('./',location.href).href,own=[new URL('manifest.json',base).href,new URL('sw.js',base).href];
  try{
    if(window.caches){
      for(const k of await caches.keys()){
        let mine=/^bible/i.test(k);
        if(!mine){try{const c=await caches.open(k);for(const u of own){if(await c.match(u)){mine=true;break}}}catch(e){}}
        if(mine)await caches.delete(k);
      }
    }
  }catch(e){}
  try{
    if(navigator.serviceWorker){
      for(const r of await navigator.serviceWorker.getRegistrations()){if(r.scope===base)await r.unregister()}
    }
  }catch(e){}
}
$('#clr').onclick=async()=>{
  const b=$('#clr');if(b.dataset.busy)return;b.dataset.busy='1';
  try{await clearAppCache();try{Object.keys(localStorage).filter(k=>/^bible-(pos-|ed-|user-|meta-|ch-|kind$)/.test(k)).forEach(k=>localStorage.removeItem(k))}catch(e){}b.textContent=CLR[lang].ok;setTimeout(()=>location.reload(),700)}
  catch(e){b.textContent=CLR[lang].err;setTimeout(()=>{delete b.dataset.busy;b.textContent=CLR[lang].b},2000)}
};
(async()=>{
  if(ls.get('bible-build')!==BUILD){ls.set('bible-build',BUILD);try{await clearAppCache()}catch(e){}}
  if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
$('#bv').textContent='v'+BUILD;
ui();loadEditions();
})();
</script>
</body>
</html>
