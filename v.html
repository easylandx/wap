<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f6ecd9">
<title>ViewPro</title>
<style>
:root{
  --cream:#f8efdc; --ivory:#fdf8ec; --gold:#e8c987; --ink:#6b5638;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --h:calc(100dvh - var(--st) - var(--sb) - 52px);
  --w:min(calc(100vw - 36px), calc(var(--h) * .575));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--cream);overflow-x:hidden}
body{margin:0;min-height:calc(100dvh + 90px);overflow-x:hidden;
  background:radial-gradient(120% 70% at 50% 0%,var(--ivory),var(--cream) 60%,#f0e0bd);
  font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;color:var(--ink);
  padding:calc(var(--st) + 36px) 18px 0;user-select:none;-webkit-user-select:none}
.title{position:absolute;top:calc(var(--st) + 10px);left:18px;font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--ink);opacity:.8}

/* ---------- viewer (real reference photo) ---------- */
.viewer{position:relative;width:var(--w);aspect-ratio:.575;margin:0 auto}
.viewer .bg{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent),linear-gradient(180deg,transparent,#000 3%,#000 97%,transparent);
  -webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent),linear-gradient(180deg,transparent,#000 3%,#000 97%,transparent);mask-composite:intersect}
.lens{position:absolute;left:11.7%;top:7.2%;width:77.3%;height:38.6%;overflow:hidden;cursor:pointer;
  clip-path:polygon(2.2% 0,97.8% 1%,100% 99.5%,0 100%);isolation:isolate;touch-action:manipulation}
.lens img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  transform:scale(1.04);filter:saturate(1.12) contrast(1.05) sepia(.1) brightness(1.04);will-change:transform}
.lens .fx{position:absolute;inset:0;pointer-events:none;z-index:3;
  background:
   radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(20,14,6,.4) 100%),
   linear-gradient(115deg,rgba(255,255,255,.38) 0%,rgba(255,255,255,0) 30%),
   linear-gradient(300deg,rgba(255,255,255,.2) 0%,rgba(255,255,255,0) 24%),
   linear-gradient(90deg,transparent 49.7%,rgba(0,0,0,.14) 50%,transparent 50.3%);
  box-shadow:inset 0 0 40px rgba(255,255,255,.3)}
.lens .fresnel{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:.5;
  background:repeating-radial-gradient(circle at 50% 50%,rgba(255,255,255,.035) 0 6px,rgba(0,0,0,.025) 6px 12px)}
.win{position:absolute;left:32.4%;top:63.7%;width:37.2%;height:5.3%;overflow:hidden;background:#150f0a}
.win img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(1.1) sepia(.12) brightness(.85)}
.win.bump{animation:bump .26s ease-out}
@keyframes bump{0%{opacity:.2;filter:brightness(2)}100%{opacity:1;filter:none}}

/* ---------- floating controls ---------- */
.ctl{position:fixed;right:calc(max(18px, (100vw - var(--w))/2) + 10px);bottom:calc(var(--sb) + 40px);
  display:flex;flex-direction:column;gap:14px;z-index:20}
.ctl button{width:54px;height:54px;border-radius:50%;border:1px solid rgba(255,255,255,.14);
  background:rgba(20,20,22,.62);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  box-shadow:0 6px 16px rgba(0,0,0,.4);display:grid;place-items:center;padding:0;cursor:pointer;color:#fff;transition:transform .12s}
.ctl button:active{transform:scale(.92)}
.ctl svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ctl svg.wa{fill:#fff;stroke:none}
.ctl button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input[type=file]{display:none}
@media(prefers-reduced-motion:reduce){.win.bump{animation:none}}
</style>
</head>

  <div class="win" id="slide"><img id="mini" alt="" hidden></div>
</main>

<div class="ctl">
  <button id="up" aria-label="Upload photos"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg></button>
  <button id="wa" aria-label="Share on WhatsApp"><svg class="wa" viewBox="0 0 24 24"><path d="M12.04 2a9.9 9.9 0 0 0-8.4 15.1L2 22l5-1.6A9.9 9.9 0 1 0 12.04 2zm0 1.8a8.1 8.1 0 1 1-4.3 15l-.3-.2-2.9.9.9-2.8-.2-.3A8.1 8.1 0 0 1 12.04 3.8zM8.6 7.4c-.2 0-.5.1-.7.4-.3.3-1 1-1 2.4s1 2.8 1.2 3c.1.2 2 3.1 4.9 4.300 2.400 1 2.900.8 3.400.7.500-.1 1.700-.7 1.900-1.400.2-.7.2-1.200.2-1.400-.1-.1-.3-.2-.6-.3l-1.800-.9c-.3-.1-.5-.1-.6.100l-.8 1c-.2.200-.3.200-.6.100-.3-.2-1.100-.4-2.100-1.300-.8-.7-1.300-1.500-1.400-1.800-.2-.3 0-.4.100-.6l.4-.5.300-.4c.1-.2 0-.3 0-.5l-.8-1.900c-.2-.5-.4-.4-.6-.4z"/></svg></button>
  <button id="rs" aria-label="Restart"><svg viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1M3.5 4v4.5H8"/></svg></button>
</div>
<input type="file" id="file" accept="image/*,.heic,.heif" multiple>

<script>
(()=>{
const $=id=>document.getElementById(id);
const lens=$('lens'), slide=$('slide'), mini=$('mini'), file=$('file');
let urls=[], i=0, busy=false;

function mk(src){const im=new Image();im.className='ph';im.alt='';im.draggable=false;im.src=src;return im}
function setMini(src){mini.src=src;mini.hidden=false;slide.classList.remove('bump');void slide.offsetWidth;slide.classList.add('bump')}

function show(n,animate){
  if(!urls.length)return;
  const old=lens.querySelector('img.ph'), im=mk(urls[n]);
  lens.insertBefore(im,lens.firstChild);
  setMini(urls[n]);
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(old&&animate&&!reduce){
    busy=true;
    im.animate([{transform:'translateX(100%) scale(1.04)',filter:'brightness(1.5)'},{transform:'translateX(0) scale(1.04)',filter:'brightness(1.04)'}],{duration:240,easing:'cubic-bezier(.3,.7,.2,1)'});
    old.animate([{transform:'translateX(0) scale(1.04)',opacity:1},{transform:'translateX(-100%) scale(1.04)',opacity:.6}],{duration:240,easing:'cubic-bezier(.3,.7,.2,1)',fill:'forwards'})
      .onfinish=()=>{old.remove();busy=false};
  }else if(old)old.remove();
}

lens.addEventListener('click',()=>{
  if(!urls.length||busy)return;
  i=(i+1)%urls.length;show(i,true);
});

$('up').onclick=()=>file.click();
file.onchange=()=>{
  const fs=[...file.files];if(!fs.length)return;
  const old=urls;urls=fs.map(f=>URL.createObjectURL(f));i=0;
  lens.querySelectorAll('img.ph').forEach(e=>e.remove());
  show(0,false);
  setTimeout(()=>old.forEach(u=>URL.revokeObjectURL(u)),600);
  file.value='';
};
$('rs').onclick=()=>{
  if(!urls.length){mini.hidden=true;return}
  i=0;show(0,true);
};

/* ---------- WhatsApp share ---------- */
function load(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src})}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
async function render(src){
  const im=await load(src),S=1200,c=document.createElement('canvas');c.width=c.height=S;
  const g=c.getContext('2d');
  const bg=g.createLinearGradient(0,0,0,S);bg.addColorStop(0,'#f8f2e2');bg.addColorStop(1,'#e6dbc2');
  g.fillStyle=bg;rr(g,0,0,S,S,26);g.fill();
  g.fillStyle='#b3261e';g.textAlign='center';
  g.font='bold 92px Georgia,serif';g.fillText('Kodachrome',S/2,190);
  g.font='500 38px Georgia,serif';g.fillStyle='#7a2a24';g.fillText('SLIDE',S/2,245);
  const x=150,y=330,w=900,h=600;
  g.fillStyle='#150f0a';g.fillRect(x-6,y-6,w+12,h+12);
  g.save();g.beginPath();g.rect(x,y,w,h);g.clip();
  const k=Math.max(w/im.width,h/im.height),dw=im.width*k,dh=im.height*k;
  g.drawImage(im,x+(w-dw)/2,y+(h-dh)/2,dw,dh);
  g.globalCompositeOperation='soft-light';g.fillStyle='rgba(255,170,80,.28)';g.fillRect(x,y,w,h);
  g.globalCompositeOperation='source-over';
  const v=g.createRadialGradient(x+w/2,y+h/2,h*.35,x+w/2,y+h/2,w*.62);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(20,10,0,.35)');
  g.fillStyle=v;g.fillRect(x,y,w,h);g.restore();
  g.fillStyle='#ffb000';g.fillRect(150,1000,110,110);
  g.fillStyle='#e8231b';g.font='900 90px Arial,sans-serif';g.fillText('K',205,1085);
  g.textAlign='right';g.fillStyle='#9a5a44';g.font='600 34px Arial,sans-serif';g.fillText('PROCESSED BY',1050,1075);
  g.fillStyle='#b3261e';g.font='60px Georgia,serif';g.fillText('+',1110,650);
  return c;
}
const MSG='Created with ViewPro easylandx.github.io/viewpro';
const toBlob=(c,t,q)=>new Promise(r=>c.toBlob(r,t,q));
$('wa').onclick=async()=>{
  if(!urls.length){file.click();return}
  const probe=new File(['x'],'s.jpg',{type:'image/jpeg'});
  const mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const canFiles=mobile&&!!(navigator.canShare&&navigator.canShare({files:[probe]}));
  const src=urls[i];
  if(!canFiles){
    /* Desktop: copy the Kodachrome slide to the clipboard FIRST (while the tab is focused and the click is still fresh), then open WhatsApp Web */
    try{
      if(navigator.clipboard&&window.ClipboardItem){
        await navigator.clipboard.write([new ClipboardItem({'image/png':render(src).then(c=>toBlob(c,'image/png'))})]);
      }
    }catch(e){}
    window.open('https://web.whatsapp.com/send?text='+encodeURIComponent(MSG),'_blank');
    return;
  }
  try{
    const blob=await toBlob(await render(src),'image/jpeg',.92);
    const f=new File([blob],'slide.jpg',{type:'image/jpeg'});
    await navigator.share({files:[f],text:MSG});
  }catch(e){if(e&&e.name!=='AbortError')window.open('https://wa.me/?text='+encodeURIComponent(MSG),'_blank')}
};
addEventListener('pagehide',()=>urls.forEach(u=>URL.revokeObjectURL(u)));
})();
</script>
