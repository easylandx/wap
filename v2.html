<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ViewPro</title>
<meta name="theme-color" content="#dbdbdb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ViewPro">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="viewpro.webmanifest">
<link rel="apple-touch-icon" href="viewpro-512.png">
<link rel="icon" href="viewpro-192.png">
<style>
:root{--bg1:#dbdbdb;--bg2:#d6d6d6;--bg3:#e3e3e3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;padding:0;background:linear-gradient(to bottom,var(--bg1) 0,var(--bg2) 41%,var(--bg3) 42%,var(--bg3) 100%) fixed;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
/* extra page height on touch devices so Safari's address bar can slide away */
@media (pointer:coarse){body{min-height:calc(100vh + 220px)}}
@media (pointer:fine){html{scrollbar-width:none}html::-webkit-scrollbar{display:none}}
#stage{position:fixed;inset:0;overflow:hidden}
#world{position:absolute;left:0;top:0;width:949px;height:1024px;transform-origin:0 0;will-change:transform}
#bg{position:absolute;inset:0;width:949px;height:1024px;display:block;pointer-events:none}
#stage.contain #bg{-webkit-mask-image:linear-gradient(to right,transparent 0,#000 7%,#000 93%,transparent 100%);mask-image:linear-gradient(to right,transparent 0,#000 7%,#000 93%,transparent 100%)}

/* the real glass lens of the photograph */
#lens{position:absolute;left:263px;top:82px;width:445px;height:387px;border-radius:14px;overflow:hidden;cursor:pointer;
  background:radial-gradient(ellipse at 50% 45%,rgba(255,255,255,.0),rgba(255,255,255,0) 70%);isolation:isolate}
#lens .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.05);
  transition:opacity .55s ease,transform .8s cubic-bezier(.2,.7,.2,1);filter:brightness(1.14) saturate(1.12) contrast(1.02)}
#lens .ph.on{opacity:1;transform:scale(1)}
#lens .glow{position:absolute;inset:0;pointer-events:none;border-radius:14px;opacity:0;transition:opacity .5s;
  background:
   radial-gradient(ellipse at 50% 50%,rgba(210,235,255,.22) 0,rgba(210,235,255,0) 65%),
   linear-gradient(135deg,rgba(255,255,255,.30) 0,rgba(255,255,255,0) 32%,rgba(255,255,255,0) 68%,rgba(255,255,255,.16) 100%);
  box-shadow:inset 0 0 38px 6px rgba(20,30,40,.38),inset 0 0 90px rgba(190,220,255,.28);mix-blend-mode:screen}
#lens .shade{position:absolute;inset:0;pointer-events:none;border-radius:14px;opacity:0;transition:opacity .5s;
  box-shadow:inset 0 0 30px 4px rgba(0,0,0,.35)}
#lens.has .glow,#lens.has .shade{opacity:1}
#hint{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;
  border:2px solid rgba(60,60,60,.35);display:flex;align-items:center;justify-content:center;pointer-events:none;
  animation:pulse 2.4s ease-in-out infinite;transition:opacity .3s}
#hint svg{width:34px;height:34px;stroke:rgba(60,60,60,.55)}
#lens.has #hint{opacity:0;animation:none}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.12);opacity:.45}}

/* the top slide sitting in the physical tray */
#tray{position:absolute;left:380px;top:646px;width:216px;height:55px;overflow:hidden;border-radius:2px;opacity:0;transition:opacity .5s;pointer-events:none;background:#111}
#tray.has{opacity:1}
#tray img{width:100%;height:100%;object-fit:cover;display:block;filter:brightness(.88) saturate(1.05)}
#tray:after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 8px 2px rgba(0,0,0,.55);background:linear-gradient(120deg,rgba(255,255,255,.18),rgba(255,255,255,0) 40%)}

/* UI */
#title{position:fixed;z-index:5;left:max(18px,env(safe-area-inset-left));top:calc(env(safe-area-inset-top) + 18px);
  font:600 15px/1 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;letter-spacing:.4px;color:#2a2a2a;opacity:.82;pointer-events:none}
.fab{position:fixed;z-index:6;width:60px;height:60px;border-radius:50%;border:1px solid rgba(255,255,255,.28);
  background:rgba(0,0,0,.48);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;color:#fff;
  box-shadow:0 6px 18px rgba(0,0,0,.25);transition:transform .15s,background .2s}
.fab:active{transform:scale(.92);background:rgba(0,0,0,.65)}
.fab svg{width:28px;height:28px}
#up{top:calc(env(safe-area-inset-top) + 12px);right:max(18px,env(safe-area-inset-right))}
#wa{bottom:calc(env(safe-area-inset-bottom) + 26px);right:max(18px,env(safe-area-inset-right))}
#rs{bottom:calc(env(safe-area-inset-bottom) + 26px);left:max(18px,env(safe-area-inset-left))}
#wa.off,#rs.off{opacity:.4}
#toast{position:fixed;z-index:9;left:50%;top:calc(env(safe-area-inset-top) + 84px);transform:translate(-50%,-10px);max-width:calc(100% - 48px);
  background:rgba(0,0,0,.72);color:#fff;font:500 14px/1.35 -apple-system,BlinkMacSystemFont,Arial,sans-serif;padding:11px 16px;border-radius:14px;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#file{position:fixed;left:-9999px;opacity:0;width:1px;height:1px}
</style>
</head>

<script>
(function(){
  var MSG = "Created with ViewPro easylandx.github.io/viewpro";
  var stage=document.getElementById('stage'), world=document.getElementById('world');
  var lens=document.getElementById('lens'), tray=document.getElementById('tray'), trayimg=document.getElementById('trayimg');
  var layers=[document.getElementById('pa'),document.getElementById('pb')], cur=0;
  var fileIn=document.getElementById('file'), up=document.getElementById('up'), wa=document.getElementById('wa'), rs=document.getElementById('rs');
  var toastEl=document.getElementById('toast'), toastT;
  var photos=[], idx=-1;

  /* ---------- layout: real photo fills the screen ---------- */
  function layout(){
    var W=stage.clientWidth, H=stage.clientHeight, IW=949, IH=1024, s, ox, oy;
    var portrait = W/H < 0.8;
    if(portrait){
      s=Math.max(W/IW,H/IH);
      ox=W/2-485*s; ox=Math.min(0,Math.max(W-IW*s,ox));
      oy=Math.min(0,Math.max(H-IH*s,(H-IH*s)/2));
      stage.classList.remove('contain');
    }else{
      s=Math.min(W/IW,H/IH); ox=(W-IW*s)/2; oy=(H-IH*s)/2;
      stage.classList.add('contain');
    }
    world.style.transform='translate('+ox+'px,'+oy+'px) scale('+s+')';
  }
  window.addEventListener('resize',layout);
  window.addEventListener('orientationchange',function(){setTimeout(layout,200)});
  layout();

  /* ---------- toast ---------- */
  function toast(t){toastEl.textContent=t;toastEl.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){toastEl.classList.remove('show')},5500)}

  /* ---------- photos ---------- */
  function show(i){
    if(!photos.length)return;
    idx=(i+photos.length)%photos.length;
    var next=layers[1-cur], old=layers[cur];
    next.onload=function(){next.classList.add('on');old.classList.remove('on');cur=1-cur;next.onload=null};
    next.src=photos[idx].url;
    trayimg.src=photos[idx].url;
    lens.classList.add('has');tray.classList.add('has');
    wa.classList.remove('off');rs.classList.remove('off');
    setTimeout(function(){getSlide(idx)},500);
  }
  function addFiles(list){
    var first=photos.length, n=0;
    for(var i=0;i<list.length;i++){
      var f=list[i]; if(!f.type||f.type.indexOf('image/')!==0)continue;
      photos.push({file:f,url:URL.createObjectURL(f),slide:null}); n++;
    }
    if(n) show(first);
  }
  function openPicker(){fileIn.value='';fileIn.click()}
  up.addEventListener('click',openPicker);
  fileIn.addEventListener('change',function(){addFiles(fileIn.files)});
  lens.addEventListener('click',function(){ if(!photos.length)openPicker(); else show(idx+1) });
  rs.addEventListener('click',function(){
    if(!photos.length)return;
    photos.forEach(function(p){URL.revokeObjectURL(p.url)});
    photos=[];idx=-1;
    layers.forEach(function(l){l.classList.remove('on');l.removeAttribute('src')});
    trayimg.removeAttribute('src');
    lens.classList.remove('has');tray.classList.remove('has');
    wa.classList.add('off');rs.classList.add('off');
  });

  /* ---------- Kodachrome slide mock-up (canvas) ---------- */
  function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
  function loadBitmap(file,url){
    if(window.createImageBitmap){return createImageBitmap(file).catch(function(){return loadImg(url)})}
    return loadImg(url);
  }
  function loadImg(url){return new Promise(function(res,rej){var im=new Image();im.onload=function(){res(im)};im.onerror=rej;im.src=url})}
  function buildSlide(p){
    return loadBitmap(p.file,p.url).then(function(img){
      var S=1200, cv=document.createElement('canvas'); cv.width=S;cv.height=S;
      var c=cv.getContext('2d');
      /* paper mount */
      var g=c.createLinearGradient(0,0,S,S); g.addColorStop(0,'#f7f5ef'); g.addColorStop(1,'#ebe7dc');
      c.save();c.shadowColor='rgba(0,0,0,.25)';c.shadowBlur=22;c.shadowOffsetY=8;
      rr(c,28,24,S-56,S-56,34);c.fillStyle=g;c.fill();c.restore();
      rr(c,28,24,S-56,S-56,34);c.lineWidth=2;c.strokeStyle='rgba(0,0,0,.10)';c.stroke();
      /* title */
      c.textAlign='center';c.fillStyle='#c4202b';
      c.font='800 88px "Helvetica Neue",Helvetica,Arial,sans-serif';c.fillText('Kodachrome',S/2,172);
      c.font='600 34px "Helvetica Neue",Helvetica,Arial,sans-serif';
      if('letterSpacing' in c)c.letterSpacing='10px';
      c.fillText('SLIDE',S/2+5,224);
      if('letterSpacing' in c)c.letterSpacing='0px';
      /* aperture window 3:2 */
      var wx=190,wy=282,ww=820,wh=547;
      c.fillStyle='#0d0d0d';c.fillRect(wx-8,wy-8,ww+16,wh+16);
      c.save();c.beginPath();c.rect(wx,wy,ww,wh);c.clip();
      var sc=Math.max(ww/img.width,wh/img.height), dw=img.width*sc, dh=img.height*sc;
      c.drawImage(img,wx+(ww-dw)/2,wy+(wh-dh)/2,dw,dh);
      var vg=c.createRadialGradient(S/2,wy+wh/2,wh*.35,S/2,wy+wh/2,ww*.62);
      vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.22)');
      c.fillStyle=vg;c.fillRect(wx,wy,ww,wh);c.restore();
      c.lineWidth=3;c.strokeStyle='rgba(0,0,0,.35)';c.strokeRect(wx-8,wy-8,ww+16,wh+16);
      /* red + mark */
      c.strokeStyle='#c4202b';c.lineWidth=7;c.lineCap='round';
      c.beginPath();c.moveTo(1085,540);c.lineTo(1085,596);c.moveTo(1057,568);c.lineTo(1113,568);c.stroke();
      /* yellow Kodak square */
      c.fillStyle='#f7b500';rr(c,100,930,150,150,8);c.fill();
      c.fillStyle='#d91f26';c.textAlign='center';
      c.font='italic 900 70px "Helvetica Neue",Helvetica,Arial,sans-serif';c.fillText('K',175,1008);
      c.font='800 24px "Helvetica Neue",Helvetica,Arial,sans-serif';c.fillText('Kodak',175,1053);
      /* processed by */
      c.textAlign='right';c.fillStyle='#c4202b';
      c.font='600 30px "Helvetica Neue",Helvetica,Arial,sans-serif';
      if('letterSpacing' in c)c.letterSpacing='4px';
      c.fillText('PROCESSED BY',1100,1062);
      return new Promise(function(res){cv.toBlob(res,'image/png')});
    });
  }
  function getSlide(i){var p=photos[i];if(!p)return null;if(!p.slide)p.slide=buildSlide(p);return p.slide}

  /* ---------- WhatsApp ---------- */
  function isMobile(){
    return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  }
  function download(blob){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='viewpro-slide.png';document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},500)}
  wa.addEventListener('click',function(){
    if(!photos.length)return;
    var pr=getSlide(idx), text=encodeURIComponent(MSG);
    if(!isMobile()){
      /* desktop: open WhatsApp Web straight away, slide image is placed on the clipboard */
      window.open('https://web.whatsapp.com/send?text='+text,'_blank');
      var done=false;
      try{
        navigator.clipboard.write([new ClipboardItem({'image/png':pr})]).then(function(){toast('Slide copied: press Ctrl+V / ⌘V in WhatsApp')}).catch(function(){pr.then(download)});
        done=true;
      }catch(e){}
      if(!done)pr.then(download);
      return;
    }
    pr.then(function(blob){
      var file=new File([blob],'viewpro-slide.png',{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        navigator.share({files:[file],text:MSG}).catch(function(e){
          if(e&&e.name==='AbortError')return;
          location.href='https://wa.me/?text='+text;
        });
      }else{
        download(blob);
        location.href='https://wa.me/?text='+text;
      }
    });
  });

  if('serviceWorker' in navigator && /^https?:/.test(location.protocol)){
    window.addEventListener('load',function(){navigator.serviceWorker.register('viewpro-sw.js').catch(function(){})});
  }
})();
</script>
