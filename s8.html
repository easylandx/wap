<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- FULL-SCREEN iPHONE SETUP: viewport-fit=cover lets the page draw under the notch, maximum-scale stops pinch-zoom,
     the apple-mobile-web-app tags make it full-screen when added to the Home Screen, and the body is taller than the
     screen (100dvh + 1px) so Safari can scroll and collapse its address bar. Safe-area insets keep content clear of the notch. -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#22140c">
<title>Super 8 ’74</title>
<style>
:root{color-scheme:dark;--ink:#f6e7c8;--or:#e8742a;--ye:#f4b72f;--rd:#d63b24;--line:#5e3b2a;--m:18px;box-sizing:border-box}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none}
body{color:var(--ink);font:700 15px/1.3 "Avenir Next","Helvetica Neue",Arial,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

/* ---------- STAGE: full screen; the four views sit side by side and slide with the finger ---------- */
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;background:#000}
.view{position:absolute;inset:0;transform:translateX(calc((var(--i) - var(--cur,0))*100% + var(--dx,0px)));transition:transform .5s cubic-bezier(.2,.8,.2,1);pointer-events:none}
#stage.dragging .view{transition:none}
.view.on{pointer-events:auto}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.72) saturate(1.1)}
/* the sharp photo is as large as the screen allows without cropping the controls; the blurred copy fills the rest */
.fit{position:absolute;left:50%;top:50%;width:min(100vw,calc(100dvh*4/3));aspect-ratio:4/3;transform:translate(-50%,-50%)}
.fit>*{position:absolute}
.fit>img{inset:0;width:100%;height:100%;object-fit:cover;-webkit-user-drag:none}
canvas{display:block;width:100%;height:100%}
.round{border-radius:50%;overflow:hidden}
.hit{background:none;border:0;padding:0;border-radius:50%;touch-action:none;color:#f6e7c855;font:900 clamp(8px,2.2vw,15px)/1 sans-serif}
.hit.go{box-shadow:0 0 0 3px #ff4a2acc,0 0 22px 6px #ff4a2a88}
#vf{background:#000;border-radius:5px;overflow:hidden;box-shadow:inset 0 0 8px #000,0 0 0 2px #000}
#vf canvas{filter:blur(.4px)}
.lcd{display:flex;align-items:center;justify-content:space-between;padding:0 4%;border-radius:6px;background:#1b0f08;color:#ffb347;font:900 clamp(10px,3vw,22px)/1 "Courier New",monospace;text-shadow:0 0 6px #ff9a2e;box-shadow:inset 0 0 8px #000,0 0 0 2px #444}
.led{border-radius:50%;background:#4a0c06;box-shadow:inset 0 0 4px #000,0 0 0 2px #2a2a2a}
.recording .led{background:#ff2a1a;box-shadow:0 0 10px 3px #ff2a1a,0 0 0 2px #2a2a2a;animation:bl .6s steps(2) infinite}
@keyframes bl{50%{opacity:.55}}
#lensc{box-shadow:inset 0 0 18px 6px #000d,inset 0 0 0 3px #1118;opacity:.92}
#gate{background:#000;box-shadow:0 0 0 3px #111;opacity:0;transition:opacity .4s}
.lamp #gate{opacity:1}
#beam{background:radial-gradient(closest-side,#fff3c8cc,#ffd88a55 45%,#0000);opacity:0;transition:opacity .5s;mix-blend-mode:screen;pointer-events:none}
.lamp #beam{opacity:1}
#screen{opacity:0;transition:opacity .5s;filter:blur(.5px) saturate(1.05);box-shadow:0 0 40px 14px #ffe3a066}
.lamp #screen{opacity:1}
.shade{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,#0000 24%,#1006 64%,#0a0400e6);opacity:0;transition:opacity 1.2s;pointer-events:none}
.lamp .shade{opacity:1}

/* ---------- floating title + banner (always visible, over the photos) ---------- */
#top{position:fixed;left:0;right:0;top:0;z-index:5;pointer-events:none;display:flex;align-items:center;justify-content:space-between;gap:12px;
 padding:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-right,0px) + var(--m)) 30px calc(env(safe-area-inset-left,0px) + var(--m));background:linear-gradient(#000c,#0000)}
h1{margin:0;font:900 26px/1 "Arial Black","Avenir Next",sans-serif;letter-spacing:-.5px;text-shadow:0 2px 8px #000}
h1 i{font-style:normal;color:var(--ye)}
.bars{width:74px;height:22px;background:linear-gradient(var(--ye) 0 33%,var(--or) 33% 66%,var(--rd) 66%);border-radius:3px;box-shadow:0 2px 8px #0009}

/* ---------- floating icon buttons ---------- */
.ib{width:50px;height:50px;padding:0;border:0;border-radius:50%;display:grid;place-items:center;background:#2a170fd9;color:var(--ink);box-shadow:0 0 0 2px var(--ye),0 6px 14px #0008;
 -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);touch-action:manipulation}
.ib svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib:active{transform:scale(.92)}
.ib:focus-visible{outline:3px solid #fff;outline-offset:3px}
.ib.s{width:40px;height:40px}.ib.s svg{width:21px;height:21px}
.ib:disabled{opacity:.5}
.fab{transition:opacity .35s,transform .35s}
.ui-hidden .fab{opacity:0;transform:scale(.7);pointer-events:none}
.ui-hidden #rec.go{opacity:1;transform:none;pointer-events:auto}
.col{position:fixed;z-index:5;display:flex;gap:12px;pointer-events:none}
.col>*{pointer-events:auto}
.ui-hidden .col>.fab{pointer-events:none}
#colR{right:calc(env(safe-area-inset-right,0px) + var(--m));top:calc(env(safe-area-inset-top,0px) + 84px);bottom:calc(env(safe-area-inset-bottom,0px) + 110px);flex-direction:column;flex-wrap:wrap-reverse;align-content:flex-start}
#colL{left:calc(env(safe-area-inset-left,0px) + var(--m));top:calc(env(safe-area-inset-top,0px) + 84px);flex-direction:column}
.bot{left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 50px);transform:translateX(-50%);align-items:center;gap:18px}
#rec{width:78px;height:78px;background:var(--rd);box-shadow:0 0 0 4px var(--ye),0 8px 18px #000a;touch-action:none}
#rec svg{width:30px;height:30px;fill:#fff;stroke:none}
#rec.go{background:#ff4a2a;box-shadow:0 0 0 4px #fff,0 0 28px #ff4a2a}
.cam-only,.pj-only{display:none!important}
body[data-mode=back] .cam-only,body[data-mode=front] .cam-only,body[data-mode=proj] .pj-only,body[data-mode=living] .pj-only{display:flex!important}
#dots{position:fixed;z-index:5;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);display:flex;gap:14px}
.dot{position:relative;width:10px;height:10px;padding:0;border:0;border-radius:5px;background:#f6e7c88c;transition:.3s;box-shadow:0 1px 4px #000}
.dot::after{content:"";position:absolute;inset:-12px -4px}
.dot.on{width:28px;background:var(--ye)}

/* ---------- clip sheet, look-through, toast ---------- */
#sheet{position:fixed;inset:0;z-index:8;background:#000b;display:none;align-items:flex-end}
#sheet.open{display:flex}
#sheetIn{width:100%;max-height:70dvh;overflow:auto;background:#2a170f;border-radius:20px 20px 0 0;padding:20px var(--m) calc(env(safe-area-inset-bottom,0px) + 28px)}
#clips{display:flex;flex-direction:column;gap:8px}
.clip{background:#3a2419;border-radius:12px;padding:10px 12px;box-shadow:0 0 0 2px var(--line);display:flex;align-items:center;gap:8px;justify-content:space-between}
.clip small{display:block;font-weight:600;opacity:.75}
.clip div{display:flex;gap:8px}
.dev{color:var(--ye)}
.hint{font-weight:600;opacity:.8;margin:6px 0}
#big{position:fixed;inset:0;z-index:9;background:#000e;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 26px) 20px calc(env(safe-area-inset-bottom,0px) + 26px)}
#big canvas{width:min(100%,640px);height:auto;aspect-ratio:4/3;border-radius:10px;box-shadow:0 0 0 4px #000,0 0 0 7px var(--line)}
#msg{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);transform:translate(-50%,30px);max-width:calc(100% - 40px);background:var(--ye);color:#2b1204;padding:10px 16px;border-radius:12px;opacity:0;transition:.3s;z-index:10;pointer-events:none;text-align:center}
#msg.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.view,#msg,.fab{transition:none}.recording .led{animation:none}}
</style>
</head>

 <button class="ib fab" id="up" aria-label="Upload video" title="Upload video"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg></button><input type="file" id="upf" accept="video/*" hidden>
 <button class="ib fab" id="dev" aria-label="Develop reel" title="Develop reel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg></button>
 <button class="ib fab" id="dlAll" aria-label="Save reel" title="Save reel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v12M7 11l5 5 5-5M4 20h16"/></svg></button>
 <button class="ib fab" id="waAll" aria-label="Send on WhatsApp" title="WhatsApp" style="color:#5ee08a"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1.3-4.2A8 8 0 1 1 8.3 18.8z"/><path d="M9 9c0 3 3 6 6 6l1.5-1.5-2-1-1 .8c-1-.4-2-1.4-2.4-2.4l.8-1-1-2z"/></svg></button>
 <button class="ib fab" id="reload" aria-label="Load new film" title="Load new film"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.5-5.8M20 4v5h-5"/></svg></button>
</div>
<div class="col bot cam-only"><button class="ib fab" id="rec" aria-label="Hold to record" title="Hold to record"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="currentColor"/></svg></button></div>
<div class="col bot pj-only">
 <button class="ib fab" id="lamp" aria-label="Lamp" title="Lamp"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg></button>
 <button class="ib fab" id="play" aria-label="Play reel" title="Play reel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z" fill="currentColor"/></svg></button>
 <button class="ib fab" id="stop" aria-label="Stop" title="Stop"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1" fill="currentColor"/></svg></button>
</div>
<div id="dots"><button class="dot on" data-m="back" aria-label="Back view"></button><button class="dot" data-m="front" aria-label="Front view"></button><button class="dot" data-m="proj" aria-label="Projector"></button><button class="dot" data-m="living" aria-label="Living room"></button></div>

<div id="sheet"><div id="sheetIn"><div id="clips"></div></div></div>
<div id="big"><canvas id="bigc" width="400" height="300"></canvas><div class="hint">Tap to close</div></div>
<div id="msg" role="status"></div>

<script>
(()=>{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const MAXFILM=180,MINC=2,MAXC=8,W=400,H=300;           // 3 minutes of film, clips of 2–8 s, working size 400×300
const DIM={back:[1448,1086,0],front:[1448,1086,0],proj:[1402,1051.5,35.2],living:[1448,1086,0]}; // [photo width, visible height, top crop]
const LOOKS={
 kodachrome:{n:'Kodachrome',sat:1.4,con:1.18,br:0,r:1.08,g:1,b:.86,grain:24,leak:.5},
 ektachrome:{n:'Ektachrome',sat:1.2,con:1.08,br:6,r:.94,g:1,b:1.12,grain:20,leak:.35},
 indoor:{n:'Indoor',sat:1.1,con:1.05,br:14,r:1.16,g:1,b:.78,grain:28,leak:.4},
 grain:{n:'High grain',sat:.9,con:1.25,br:0,r:1.05,g:1.02,b:.92,grain:55,leak:.6}};

/* ---- place every overlay over its photo (see comment above the stage) ---- */
$$('[data-box]').forEach(el=>{const[v,x,y,w,h]=el.dataset.box.split(','),[IW,IH,o]=DIM[v];
 Object.assign(el.style,{left:x/IW*100+'%',top:(y-o)/IH*100+'%',width:w/IW*100+'%',height:h/IH*100+'%'})});

/* ---- toast ---- */
let tt;const msg=$('#msg');const toast=(t,ms=2800)=>{msg.textContent=t;msg.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>msg.classList.remove('show'),ms)};

/* ---- mechanical sound, synthesised with WebAudio (no audio files) ---- */
let AC,NB;
function ac(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
 if(AC.state!=='running')AC.resume();return AC}
function click(v=.3,f=2500){const a=ac(),s=a.createBufferSource(),b=a.createBiquadFilter(),g=a.createGain();s.buffer=NB;b.type='bandpass';b.frequency.value=f;
 g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.07);s.connect(b);b.connect(g);g.connect(a.destination);s.start();s.stop(a.currentTime+.09)}
function hum(f,rate,v,nv){const a=ac(),m=a.createGain();m.connect(a.destination);
 const o=a.createOscillator();o.type='sawtooth';o.frequency.value=f;const lp=a.createBiquadFilter();lp.frequency.value=f*5;
 const g=a.createGain();g.gain.value=v;o.connect(lp);lp.connect(g);g.connect(m);
 const l=a.createOscillator();l.type='square';l.frequency.value=rate;const lg=a.createGain();lg.gain.value=v*.6;l.connect(lg);lg.connect(g.gain);
 const n=a.createBufferSource();n.buffer=NB;n.loop=true;const bp=a.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1800;
 const ng=a.createGain();ng.gain.value=nv;const lg2=a.createGain();lg2.gain.value=nv*.9;l.connect(lg2);lg2.connect(ng.gain);n.connect(bp);bp.connect(ng);ng.connect(m);
 o.start();l.start();n.start();
 return()=>{m.gain.setTargetAtTime(0,a.currentTime,.05);setTimeout(()=>[o,l,n].forEach(x=>{try{x.stop()}catch(e){}}),300)}}

/* ---- the Super 8 look: colour grade + grain + vignette + weave + leaks + scratches + dust ---- */
const vig=new Float32Array(W*H);for(let y=0;y<H;y++)for(let x=0;x<W;x++){const dx=(x-W/2)/(W/2),dy=(y-H/2)/(H/2);vig[y*W+x]=Math.max(.25,1-.45*(dx*dx+dy*dy))}
const NZ=new Int8Array(65536);for(let i=0;i<65536;i++)NZ[i]=(Math.random()+Math.random()+Math.random()-1.5)*60;
function grade(ctx,src,L,t){
 const sw=src.videoWidth||W,sh=src.videoHeight||H;let cw=sw,ch=sw*3/4;if(ch>sh){ch=sh;cw=sh*4/3}
 const wx=Math.sin(t/430)*2.2+(Math.random()-.5)*1.2,wy=Math.cos(t/370)*1.6+(Math.random()-.5)*1.2;   // gate weave
 ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
 ctx.drawImage(src,(sw-cw)/2,(sh-ch)/2,cw,ch,-8+wx,-8+wy,W+16,H+16);
 const im=ctx.getImageData(0,0,W,H),d=im.data,n=W*H,off=Math.random()*65536|0,fl=1+(Math.random()-.5)*.1,gs=L.grain/40;
 for(let i=0,p=0;i<n;i++,p+=4){let r=d[p],g=d[p+1],b=d[p+2];const l=.299*r+.587*g+.114*b;
  r=l+(r-l)*L.sat;g=l+(g-l)*L.sat;b=l+(b-l)*L.sat;const k=vig[i]*fl,z=NZ[(i*7+off)&65535]*gs;
  d[p]=((r-128)*L.con+128+L.br)*L.r*k+z;d[p+1]=((g-128)*L.con+128+L.br)*L.g*k+z;d[p+2]=((b-128)*L.con+128+L.br)*L.b*k+z}
 ctx.putImageData(im,0,0);
 const a=L.leak*(.5+.5*Math.sin(t/1700))*(Math.random()<.04?1.8:.5);ctx.globalCompositeOperation='screen';       // light leak
 const gr=ctx.createRadialGradient(0,H*.3,0,0,H*.3,W*.55);gr.addColorStop(0,`rgba(255,110,30,${a*.6})`);gr.addColorStop(1,'rgba(255,60,0,0)');
 ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over';
 if(Math.random()<.18){ctx.fillStyle=`rgba(255,240,210,${.25+Math.random()*.4})`;ctx.fillRect(Math.random()*W|0,0,1,H)}   // scratch
 for(let k=0;k<3;k++)if(Math.random()<.35){ctx.fillStyle=Math.random()<.5?'rgba(0,0,0,.6)':'rgba(255,255,255,.55)';const s=1+Math.random()*2;ctx.fillRect(Math.random()*W,Math.random()*H,s,s)} // dust
}

/* ---- storage: clips live in memory and in IndexedDB so the reel survives a reload ---- */
let clips=[];const I={play:"<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M7 4l13 8-13 8z\" fill=\"currentColor\"/></svg>",save:"<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 4v12M7 11l5 5 5-5M4 20h16\"/></svg>",wa:"<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 20l1.3-4.2A8 8 0 1 1 8.3 18.8z\"/><path d=\"M9 9c0 3 3 6 6 6l1.5-1.5-2-1-1 .8c-1-.4-2-1.4-2.4-2.4l.8-1-1-2z\"/></svg>",del:"<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13\"/></svg>"};
const db=new Promise((res,rej)=>{try{const r=indexedDB.open('super8-74',1);r.onupgradeneeded=()=>r.result.createObjectStore('clips',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
const tx=async(m,f)=>{const d=await db;return new Promise((res,rej)=>{const t=d.transaction('clips',m),r=f(t.objectStore('clips'));t.oncomplete=()=>res(r.result);t.onerror=()=>rej(t.error)})};
const save=c=>tx('readwrite',s=>s.put(c)).catch(()=>{});
const usedSec=()=>clips.reduce((a,c)=>a+(c.imp?0:c.dur),0); // uploaded videos don’t use up film
const MIME=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m))||'';
const ext=()=>MIME.includes('mp4')?'mp4':'webm';const ex=b=>/mp4|quicktime/.test(b.type)?'mp4':'webm';
const fmt=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function showLeft(extra=0){const left=MAXFILM-usedSec()-extra;$('#lcd').textContent='Film '+fmt(left);$('#bat').textContent=left<=0?'▯▯▯▯':'▮▮▮▮'}
function render(){showLeft();
 $('#clips').innerHTML=clips.map((c,i)=>`<div class="clip"><span><b>Clip ${i+1}</b> · ${c.dur.toFixed(1)} s<small class="${c.dev?'dev':''}">${c.dev?'Developed':'Undeveloped'} · ${LOOKS[c.look].n}</small></span>
  <div><button class="ib s" aria-label="Play" data-a="play" data-i="${i}">${I.play}</button><button class="ib s" aria-label="Save" data-a="save" data-i="${i}">${I.save}</button><button class="ib s" aria-label="WhatsApp" style="color:#5ee08a" data-a="wa" data-i="${i}">${I.wa}</button><button class="ib s" aria-label="Delete" data-a="del" data-i="${i}">${I.del}</button></div></div>`).join('')
  ||'<p class="hint">Fresh cartridge loaded. Hold the dial or the red button to roll film.</p>'}
tx('readonly',s=>s.getAll()).then(a=>{clips=a.sort((x,y)=>x.id-y.id);render()}).catch(render);

/* ---- camera ---- */
let stream,facing='environment',mode='back';
const vid=Object.assign(document.createElement('video'),{muted:true,playsInline:true});vid.setAttribute('playsinline','');
vid.style.cssText='position:fixed;width:1px;height:1px;opacity:0;pointer-events:none';document.body.appendChild(vid);
async function cam(){try{stream&&stream.getTracks().forEach(t=>t.stop());
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:640},height:{ideal:480}},audio:false})}
 catch(e){stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false})}
 vid.srcObject=stream;await vid.play()}catch(e){toast('Camera unavailable. Open this page over https in Safari and allow camera access.',5000)}}
$('#flip').onclick=()=>{facing=facing==='environment'?'user':'environment';click();cam()};
cam();

const live=$('#live'),lctx=live.getContext('2d',{willReadFrequently:true}),lens=$('#lensc').getContext('2d'),
 big=$('#bigc').getContext('2d'),sc=$('#sc').getContext('2d'),gate=$('#gatec').getContext('2d');
const lookKeys=Object.keys(LOOKS),lookSel={value:'kodachrome'};let bigOpen=false;
$('#stock').onclick=()=>{lookSel.value=lookKeys[(lookKeys.indexOf(lookSel.value)+1)%lookKeys.length];toast('Film stock: '+LOOKS[lookSel.value].n)};
$('#vf').onclick=$('#look').onclick=()=>{bigOpen=true;$('#big').style.display='flex'};
$('#big').onclick=()=>{bigOpen=false;$('#big').style.display='none'};

/* ---- recording: hold to record, 2–8 s per clip, raw footage stays undeveloped ---- */
let rec=false,mr,chunks,t0,tick,stopMotor,before=0;
function start(){if(rec||!stream)return;ac();before=usedSec();
 if(MAXFILM-before<.5){toast('The film has run out. Load a new cartridge.');return}
 try{mr=new MediaRecorder(stream,MIME?{mimeType:MIME,videoBitsPerSecond:2e6}:{})}catch(e){toast('Recording isn’t supported in this browser.');return}
 chunks=[];mr.ondataavailable=e=>e.data&&e.data.size&&chunks.push(e.data);mr.onstop=finish;mr.start(250);
 rec=true;t0=performance.now();hideUI();click(.35,1800);stopMotor=hum(70,18,.09,.05);
 document.body.classList.add('recording');$$('#dial,#grip,#rec').forEach(e=>e.classList.add('go'));
 tick=setInterval(()=>{const el=(performance.now()-t0)/1000;showLeft(el);if(el>=MAXC||before+el>=MAXFILM)stop()},100)}
function stop(){if(!rec)return;rec=false;clearInterval(tick);try{mr.stop()}catch(e){}stopMotor&&stopMotor();click(.3,1200);
 document.body.classList.remove('recording');$$('#dial,#grip,#rec').forEach(e=>e.classList.remove('go'))}
function release(){if(!rec)return;const el=(performance.now()-t0)/1000;el<MINC?setTimeout(stop,(MINC-el)*1000):stop()}
function finish(){const dur=Math.min(MAXC,(performance.now()-t0)/1000);
 const c={id:Date.now(),dur,look:lookSel.value,raw:new Blob(chunks,{type:mr.mimeType||MIME||'video/mp4'}),dev:null};
 clips.push(c);save(c);render();toast('Clip '+clips.length+' is on the reel (undeveloped).')}
['#dial','#grip','#rec'].forEach(s=>{const e=$(s);
 e.addEventListener('pointerdown',ev=>{ev.preventDefault();try{e.setPointerCapture(ev.pointerId)}catch(x){}start()});
 ['pointerup','pointercancel'].forEach(n=>e.addEventListener(n,release));e.addEventListener('contextmenu',ev=>ev.preventDefault())});

/* ---- develop / export: replay footage into a canvas and record that canvas (runs at film speed) ---- */
async function pipe(blobs,draw){
 const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d',{willReadFrequently:true});
 const m=new MediaRecorder(c.captureStream(18),MIME?{mimeType:MIME,videoBitsPerSecond:2e6}:{}),ch=[];
 m.ondataavailable=e=>e.data&&e.data.size&&ch.push(e.data);const done=new Promise(r=>m.onstop=r);
 const v=Object.assign(document.createElement('video'),{muted:true,playsInline:true});v.setAttribute('playsinline','');m.start(250);
 for(const b of blobs){const u=URL.createObjectURL(b);v.src=u;
  await new Promise(res=>{let fin=false,last=0;const end=()=>{fin=true;res()};v.onended=end;v.onerror=end;setTimeout(end,300000);
   v.play().then(()=>{const f=t=>{if(fin)return;if(t-last>52){draw(x,v,t);last=t}requestAnimationFrame(f)};requestAnimationFrame(f)}).catch(end)});
  URL.revokeObjectURL(u)}
 m.stop();await done;return new Blob(ch,{type:m.mimeType||MIME||'video/mp4'})}
let busy=false;
async function develop(){const todo=clips.filter(c=>!c.dev);if(!todo.length){toast('Nothing left to develop.');return}if(busy)return;busy=true;$('#dev').disabled=true;let n=0;
 for(const c of todo){toast(`Developing ${++n} of ${todo.length}. This runs at film speed.`,60000);const L=LOOKS[c.look];
  try{c.dev=await pipe([c.raw],(x,v,t)=>grade(x,v,L,t));save(c);render()}catch(e){toast('Developing failed for one clip.')}}
 busy=false;$('#dev').disabled=false;toast('Reel developed. Try the projector.')}
$('#dev').onclick=develop;
async function reelBlob(){const d=clips.filter(c=>c.dev);if(!d.length){toast('Develop the reel first.');return null}
 if(d.length===1)return d[0].dev;toast('Splicing the reel…',60000);return pipe(d.map(c=>c.dev),(x,v)=>x.drawImage(v,0,0,W,H))}

/* ---- downloads + WhatsApp ----
 Save: a normal download link. WhatsApp: opens WhatsApp Web directly with a ready message. No share sheet and no prompts.
 (A web link can only carry text, so the video itself is attached by hand from the saved file.) */
function dl(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(a.href)},4000)}
function WA(){window.open('https://web.whatsapp.com/send?text='+encodeURIComponent('Filmed on my Super 8 ’74 🎞️'),'_blank')}
const share=WA;
$('#dlAll').onclick=async()=>{const b=await reelBlob();b&&dl(b,'super8-74-reel.'+ext())};
$('#waAll').onclick=WA;
$('#clips').onclick=e=>{const b=e.target.closest('button');if(!b)return;const i=+b.dataset.i,c=clips[i],a=b.dataset.a,blob=c.dev||c.raw,name=`super8-74-clip${i+1}${c.dev?'':'-raw'}.${ex(blob)}`;
 if(a==='save')dl(blob,name);else if(a==='wa')share(blob,name);
 else if(a==='del'){clips.splice(i,1);tx('readwrite',s=>s.delete(c.id)).catch(()=>{});render()}
 else if(a==='play'){if(!c.dev){toast('Develop the reel first.');return}closeSheet();setMode('proj');play([i])}};
$('#reload').onclick=()=>{if(confirm('Load a fresh cartridge? The current reel is erased. Save anything you want first.')){clips=[];tx('readwrite',s=>s.clear()).catch(()=>{});render();toast('Fresh cartridge loaded.')}};

/* ---- upload a video from the device: it joins the reel as an undeveloped clip, then Develop gives it the Super 8 look ---- */
$('#up').onclick=()=>$('#upf').click();
$('#upf').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 const u=URL.createObjectURL(f),v=document.createElement('video');v.preload='metadata';v.muted=true;
 const dur=await new Promise(res=>{v.onloadedmetadata=()=>res(isFinite(v.duration)?v.duration:0);v.onerror=()=>res(-1);v.src=u});URL.revokeObjectURL(u);
 if(dur<0){toast('That video can’t be read in this browser.');return}
 const c={id:Date.now(),dur:dur||MAXC,look:lookSel.value,raw:f,dev:null,imp:true};clips.push(c);save(c);render();
 toast('Video added, undeveloped. Pick a film stock, then tap Develop reel.',4000)};

/* ---- projector + living room playback ---- */
const pv=Object.assign(document.createElement('video'),{muted:true,playsInline:true});pv.setAttribute('playsinline','');
let playing=false,lampMan=false,stopHum,cur;
const lampUpdate=()=>document.body.classList.toggle('lamp',playing||lampMan);
async function play(q){q=q||clips.map((c,i)=>c.dev?i:-1).filter(i=>i>=0);if(!q.length){toast('Nothing developed yet. Tap “Develop reel”.');return}
 stop2();ac();playing=true;lampUpdate();click(.4,900);stopHum=hum(48,18,.06,.07);
 for(const i of q){if(!playing)break;const u=URL.createObjectURL(clips[i].dev);
  await new Promise(res=>{cur=res;pv.src=u;pv.onended=res;pv.onerror=res;pv.play().catch(res)});URL.revokeObjectURL(u)}
 if(playing)stop2()}
function stop2(){playing=false;pv.pause();stopHum&&stopHum();stopHum=0;cur&&cur();cur=0;lampUpdate()}
$('#play').onclick=()=>play();$('#stop').onclick=stop2;
$('#lamp').onclick=$('#knob').onclick=()=>{lampMan=!lampMan;click(.4,700);lampUpdate()};

/* ---- MODE SWITCHING: the views sit side by side; --cur picks which one is on screen and CSS slides them.
 Order: Back view ↔ Front view ↔ Projector ↔ Living room. Swipe with a finger or drag with the mouse, or tap a dot. ---- */
const ORDER=['back','front','proj','living'],stage=$('#stage');
function setMode(m){mode=m;stage.style.setProperty('--cur',ORDER.indexOf(m));$$('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+m));
 $$('.dot').forEach(b=>b.classList.toggle('on',b.dataset.m===m));document.body.dataset.mode=m;if(m==='back'||m==='front')stop2();click(.2,1500)}
$$('.dot').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
function hideUI(){document.body.classList.add('ui-hidden')}function showUI(){document.body.classList.remove('ui-hidden')}
$$('.fab').forEach(b=>b.addEventListener('click',()=>{if(b.id!=='rec')hideUI()}));   // pressing any button hides them all
function closeSheet(){$('#sheet').classList.remove('open')}
$('#clipsBtn').addEventListener('click',()=>$('#sheet').classList.add('open'));
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
let sx=0,sy=0,sid=null,moved=false;
stage.addEventListener('pointerdown',e=>{if(e.target.closest('.hit,#vf'))return;sid=e.pointerId;sx=e.clientX;sy=e.clientY;moved=false});
stage.addEventListener('pointermove',e=>{if(e.pointerId!==sid)return;const dx=e.clientX-sx,dy=e.clientY-sy;
 if(!moved&&Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)){moved=true;stage.classList.add('dragging');try{stage.setPointerCapture(sid)}catch(x){}}
 if(moved){const k=ORDER.indexOf(mode);stage.style.setProperty('--dx',((k===0&&dx>0)||(k===3&&dx<0)?dx/4:dx)+'px')}});
function endDrag(e){if(e.pointerId!==sid)return;sid=null;const dx=e.clientX-sx;stage.classList.remove('dragging');stage.style.setProperty('--dx','0px');
 if(moved){const n=ORDER.indexOf(mode)+(dx<0?1:-1);if(Math.abs(dx)>60&&n>=0&&n<ORDER.length)setMode(ORDER[n])}
 else if(e.type==='pointerup')showUI()}                                                  // a plain tap brings the buttons back
stage.addEventListener('pointerup',endDrag);stage.addEventListener('pointercancel',endDrag);

/* ---- one render loop: camera views draw the live graded feed, projector views draw the developed film ---- */
let last=0;
function loop(t){requestAnimationFrame(loop);if(t-last<50)return;last=t;
 if(mode==='back'||mode==='front'){if(!stream||vid.readyState<2)return;grade(lctx,vid,LOOKS[lookSel.value],t);
  if(mode==='front')lens.drawImage(live,50,0,300,300,0,0,160,160);if(bigOpen)big.drawImage(live,0,0)}
 else if(document.body.classList.contains('lamp')){
  if(playing&&pv.readyState>1){const wx=Math.sin(t/300)*1.5+(Math.random()-.5),wy=Math.cos(t/260)*1.2+(Math.random()-.5);
   sc.fillStyle='#000';sc.fillRect(0,0,W,H);sc.drawImage(pv,-6+wx,-5+wy,W+12,H+10);sc.fillStyle=`rgba(0,0,0,${Math.random()*.12})`;sc.fillRect(0,0,W,H)}
  else{sc.fillStyle=`rgb(${245+Math.random()*10|0},${232+Math.random()*10|0},${200})`;sc.fillRect(0,0,W,H)}
  gate.drawImage($('#sc'),50,0,300,300,0,0,160,160)}}
requestAnimationFrame(loop);
})();
</script>
