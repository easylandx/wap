<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ffb000"><title>PCPro</title>
<style>
:root{--a:#ffb000;--d:#120b00;--bg:#ffb000;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);overscroll-behavior-y:none}
body{padding:0 56px 0 12px;min-height:125vh;font-family:"Courier New",monospace;color:var(--a);-webkit-user-select:none;user-select:none}
#top{position:fixed;left:0;right:0;top:0;box-sizing:border-box;z-index:20;display:flex;align-items:center;gap:10px;height:44px;padding:env(safe-area-inset-top,0px) 16px 0;background:#ffb000;color:#120b00;text-shadow:none}
#top b{color:#120b00;font-size:20px;letter-spacing:2px}#top a{display:flex;align-items:center}
#stage{position:relative;width:calc(100vw - 68px);max-width:760px;margin:calc(56px + env(safe-area-inset-top,0px)) auto 0;aspect-ratio:1102/1427;container-type:inline-size;filter:drop-shadow(0 10px 18px rgba(0,0,0,.25))}
.ph{position:absolute;inset:0;width:100%;height:100%;transition:opacity .7s ease;-webkit-user-drag:none}
#closed{z-index:2}.open #closed{opacity:0;pointer-events:none}
#scr,#kb{position:absolute;opacity:0;pointer-events:none;transition:opacity .7s;z-index:3}
.open #scr,.open #kb{opacity:1;pointer-events:auto}
#scr{left:21.2%;top:4.9%;width:58%;height:64.6%;background:var(--d);border-radius:3%/4%;overflow:hidden;display:flex;flex-direction:column;font-size:2.4cqw;box-shadow:inset 0 0 40px #000}
#scr::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.55))}
#bar{display:flex;align-items:center;gap:1.2cqw;padding:.8cqw 1.6cqw;border-bottom:1px solid var(--a);text-shadow:0 0 5px var(--a)}
#url{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--a);font:inherit;caret-color:var(--a);padding:0;-webkit-appearance:none;border-radius:0}
#st{padding:.3cqw 1.6cqw;font-size:.85em;opacity:.8;border-top:1px solid #5a3d00;text-shadow:0 0 5px var(--a)}
#fw{flex:1;position:relative;overflow:hidden;background:#000}#fr{position:absolute;left:0;top:0;width:600px;height:100%;transform-origin:0 0;border:0;background:#fff;touch-action:pan-y;filter:grayscale(1) sepia(1) saturate(6) hue-rotate(-12deg) brightness(.9) contrast(1.1)}
#kb{inset:0;pointer-events:none!important}.k{pointer-events:auto;position:absolute;border-radius:6px;touch-action:manipulation}.k.on{background:rgba(255,176,0,.38);box-shadow:0 0 8px var(--a)}
#dock{position:fixed;right:max(10px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;align-items:center;gap:6px}
#dock button{width:34px;height:34px;flex:none;border-radius:50%;border:1px solid var(--a);background:rgba(18,11,0,.9);color:var(--a);font-size:18px;line-height:1;padding:0;text-shadow:0 0 6px var(--a);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#dock button:active,#dock button.act{background:rgba(255,176,0,.35)}
#bm.off{opacity:.45;text-decoration:line-through}
#dock button{-webkit-touch-callout:none;touch-action:manipulation}
#tip{position:fixed;z-index:30;max-width:60vw;padding:7px 10px;border:1px solid var(--a);border-radius:8px;background:rgba(18,11,0,.95);color:var(--a);font-size:13px;text-shadow:0 0 6px var(--a);text-align:center;pointer-events:none;opacity:0;transition:opacity .15s}#tip.show{opacity:1}
#box{position:absolute;inset:0;z-index:4;cursor:pointer;transition:opacity .7s ease}#box img{width:100%;height:100%;display:block;-webkit-user-drag:none}.unbox #box{opacity:0;pointer-events:none}
#msg{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);padding:2.2cqw 4.5cqw;border:1px solid #ffb000;border-radius:999px;background:rgba(18,11,0,.88);color:#ffb000;font-size:4.2cqw;letter-spacing:.3em;white-space:nowrap;text-shadow:0 0 8px #ffb000}
@media (hover:hover) and (pointer:fine){body{min-height:100vh;display:flex;flex-direction:column;justify-content:center}#stage{width:min(calc(100vw - 80px),760px,calc((100vh - 90px)*1102/1427));margin:0 auto}}
#menu{position:fixed;right:58px;top:50%;transform:translateY(-50%);width:min(calc(100vw - 80px),300px);max-height:55vh;overflow:auto;-webkit-overflow-scrolling:touch;z-index:25;border:1px solid var(--a);border-radius:10px;background:rgba(18,11,0,.96);display:none;font-size:15px}#menu.show{display:block}#menu .hd{color:#120b00;background:var(--a);text-shadow:none;font-weight:bold;letter-spacing:.15em;padding:6px 14px;position:sticky;top:0}#menu div{padding:10px 14px;border-bottom:1px solid #3a2800;color:var(--a);text-shadow:0 0 6px var(--a)}#menu div:active{background:rgba(255,176,0,.3)}
.hide #menu{display:none!important}
.hide #top,.hide #dock button:not(#bfs){display:none}.hide #dock{top:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:none}
@media (hover:none),(pointer:coarse){#stage{--w:min(calc(100vw - 68px),calc((100vh - 110px)*1102/1427));--w:min(calc(100vw - 68px),calc((100svh - 110px)*1102/1427));width:var(--w);margin:max(calc(56px + env(safe-area-inset-top,0px)),calc((100vh - var(--w)*1427/1102)/2)) auto 0;margin-top:max(calc(56px + env(safe-area-inset-top,0px)),calc((100svh - var(--w)*1427/1102)/2))}}
#openimg{opacity:0}.open #openimg{opacity:1}
#closed{opacity:0;pointer-events:none}.unbox:not(.open) #closed{opacity:1;pointer-events:auto}
</style></head><body>

<script>
const $=id=>document.getElementById(id),W=1102,H=1427,HOME="https://easylandx.github.io/app/";
const st=$("stage"),inp=$("url"),fr=$("fr"),stt=$("st");
const VW=600;function fit(){const f=$("fw"),w=f.clientWidth,h=f.clientHeight;if(!w)return;const s=w/VW;fr.style.transform=`scale(${s})`;fr.style.height=(h/s)+"px"}
new ResizeObserver(fit).observe($("fw"));addEventListener("resize",fit);
let isOpen=false,nat=false,muted=false,shift=false,caps=false,hist=[],hi=-1,ac=null;
function audio(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume()}catch(e){}return ac}
function click(big){if(muted)return;const c=audio();if(!c)return;const t=c.currentTime,n=c.sampleRate*.04,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);
for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,big?3:5);
const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type="bandpass";f.frequency.value=big?1400:2400;f.Q.value=.9;const g=c.createGain();g.gain.value=big?1.1:.8;s.connect(f).connect(g).connect(c.destination);s.start(t);
const o=c.createOscillator(),og=c.createGain();o.frequency.setValueAtTime(big?110:170,t);o.frequency.exponentialRampToValueAtTime(50,t+.07);og.gain.setValueAtTime(big?.55:.3,t);og.gain.exponentialRampToValueAtTime(.001,t+.09);o.connect(og).connect(c.destination);o.start(t);o.stop(t+.1);
if(big){const b2=c.createOscillator(),bg=c.createGain();b2.type="sine";b2.frequency.value=1850;bg.gain.setValueAtTime(.18,t+.05);bg.gain.exponentialRampToValueAtTime(.001,t+.9);b2.connect(bg).connect(c.destination);b2.start(t+.05);b2.stop(t+.95)}}
function setOpen(v){isOpen=v;st.classList.add("unbox");st.classList.toggle("open",v);click(true);if(v&&hi<0)go(HOME);if(!v)inp.blur()}
$("closed").addEventListener("click",()=>{audio();setOpen(true)});
$("bp").onclick=()=>{audio();setOpen(!isOpen)};
function norm(q){q=q.trim();if(!q)return"";if(/^https?:\/\//i.test(q))return q;if(/^[\w-]+(\.[\w-]+)+(:\d+)?(\/\S*)?$/.test(q)||/^localhost/.test(q))return"https://"+q;return"https://en.m.wikipedia.org/w/index.php?search="+encodeURIComponent(q)}
function load(u){inp.value=u.replace(/^https?:\/\//,"");stt.textContent="LOADING...";fr.src=u}
function go(q,push=true){const u=norm(q);if(!u)return;if(push){hist=hist.slice(0,hi+1);hist.push(u);hi=hist.length-1}load(u)}
fr.addEventListener("load",()=>{if(fr.src&&fr.src!=="about:blank")stt.textContent="READY_ (BLANK? SITE REFUSES FRAMING)"});
$("bb").onclick=()=>{if(hi>0){hi--;load(hist[hi])}};$("bf").onclick=()=>{if(hi<hist.length-1){hi++;load(hist[hi])}};
$("br").onclick=()=>{if(hi>=0)load(hist[hi])};$("bh").onclick=()=>go(HOME);
$("bn").onclick=function(){nat=!nat;this.classList.toggle("act",nat);inp.inputMode=nat?"url":"none";if(nat)inp.focus();else inp.blur()};
$("bm").onclick=function(){muted=!muted;this.classList.toggle("off",muted)};
$("bfs").onclick=()=>{const h=document.body.classList.toggle("hide");try{h?document.documentElement.requestFullscreen?.():document.fullscreenElement&&document.exitFullscreen()}catch(e){}scrollTo(0,h?document.body.scrollHeight:0)};

function typeCh(ch){const s=inp.selectionStart??inp.value.length,e=inp.selectionEnd??s;inp.setRangeText(ch,s,e,"end")}
function press(k){
if(k==="shift"){shift=!shift;click();return}if(k==="caps"){caps=!caps;click();return}
if(k==="enter"){click(true);go(inp.value);return}
click();
if(k==="back"){const s=inp.selectionStart??inp.value.length,e=inp.selectionEnd??s;if(s!==e)inp.setRangeText("",s,e,"end");else if(s>0)inp.setRangeText("",s-1,s,"end");return}
if(k==="space"){typeCh(" ");return}if(k.length!==1)return;
