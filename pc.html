<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#120b00"><title>PCPro</title>
<style>
:root{--a:#ffb000;--d:#120b00;--bg:#d8d7db;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);overscroll-behavior-y:none}
body{min-height:125vh;font-family:"Courier New",monospace;color:var(--a);-webkit-user-select:none;user-select:none}
#top{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;gap:10px;height:44px;padding:env(safe-area-inset-top,0px) 16px 0;background:rgba(18,11,0,.93);color:var(--a);text-shadow:0 0 6px var(--a)}
#top b{font-size:20px;letter-spacing:2px}#top a{display:flex;align-items:center}
#stage{position:relative;width:calc(100vw - 8px);max-width:760px;margin:calc(56px + env(safe-area-inset-top,0px)) auto 0;aspect-ratio:1102/1427;container-type:inline-size;filter:drop-shadow(0 10px 18px rgba(0,0,0,.25))}
.ph{position:absolute;inset:0;width:100%;height:100%;transition:opacity .7s ease;-webkit-user-drag:none}
#closed{z-index:2}.open #closed{opacity:0;pointer-events:none}
#scr,#kb{position:absolute;opacity:0;pointer-events:none;transition:opacity .7s;z-index:3}
.open #scr,.open #kb{opacity:1;pointer-events:auto}
#scr{left:15.9%;top:20.3%;width:59.4%;height:34.7%;background:var(--d);border-radius:3%/4%;overflow:hidden;display:flex;flex-direction:column;font-size:2.4cqw;box-shadow:inset 0 0 40px #000}
#scr::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.55))}
#bar{display:flex;align-items:center;gap:1.2cqw;padding:.8cqw 1.6cqw;border-bottom:1px solid var(--a);text-shadow:0 0 5px var(--a)}
#url{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--a);font:inherit;caret-color:var(--a);padding:0;-webkit-appearance:none;border-radius:0}
#st{padding:.3cqw 1.6cqw;font-size:.85em;opacity:.8;border-top:1px solid #5a3d00;text-shadow:0 0 5px var(--a)}
#fw{flex:1;position:relative;overflow:hidden;background:#000}#fr{position:absolute;left:0;top:0;width:600px;height:100%;transform-origin:0 0;border:0;background:#fff;touch-action:pan-y;filter:grayscale(1) invert(1) sepia(1) saturate(6) hue-rotate(-12deg) brightness(.95) contrast(1.15)}
#kb{inset:0;pointer-events:none!important}.k{pointer-events:auto;position:absolute;border-radius:6px;touch-action:manipulation}.k.on{background:rgba(255,176,0,.38);box-shadow:0 0 8px var(--a)}
#dock{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;justify-content:center;gap:6px;padding:0 6px}
#dock button{width:38px;height:38px;flex:none;border-radius:50%;border:1px solid var(--a);background:rgba(18,11,0,.62);color:var(--a);font-size:18px;line-height:1;padding:0;text-shadow:0 0 6px var(--a);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#dock button:active,#dock button.act{background:rgba(255,176,0,.35)}
#bm.off{opacity:.45;text-decoration:line-through}
#dock button{-webkit-touch-callout:none;touch-action:manipulation}
#tip{position:fixed;z-index:30;max-width:70vw;padding:7px 10px;border:1px solid var(--a);border-radius:8px;background:rgba(18,11,0,.95);color:var(--a);font-size:13px;text-shadow:0 0 6px var(--a);text-align:center;pointer-events:none;opacity:0;transition:opacity .15s}#tip.show{opacity:1}
#box{position:absolute;inset:0;z-index:4;cursor:pointer;transition:opacity .7s ease}#box img{width:100%;height:100%;display:block;-webkit-user-drag:none}.unbox #box{opacity:0;pointer-events:none}
#msg{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);padding:2.2cqw 4.5cqw;border:1px solid #ffb000;border-radius:999px;background:rgba(18,11,0,.88);color:#ffb000;font-size:4.2cqw;letter-spacing:.3em;white-space:nowrap;text-shadow:0 0 8px #ffb000;animation:bl 1.4s steps(2,jump-none) infinite}@keyframes bl{50%{opacity:.35}}
.hide #top,.hide #dock button:not(#bfs){display:none}.hide #dock{justify-content:flex-end}
</style></head><body>

<button id="bp" aria-label="power" title="Power: open or close the laptop">⏻</button><button id="bn" aria-label="keyboard" title="Keyboard: switch between the on-photo keys and the phone keyboard">⌨</button><button id="bb" aria-label="back" title="Back: go to the previous page">◀</button><button id="bf" aria-label="forward" title="Forward: go to the next page">▶</button><button id="br" aria-label="reload" title="Reload: refresh the current page">↻</button><button id="bh" aria-label="home" title="Home: go to easylandx.github.io/app">⌂</button><button id="bfs" aria-label="fullscreen" title="Fullscreen: hide or show the bars and buttons">⛶</button><button id="bm" aria-label="sound" title="Sound: mute or unmute key clicks">♪</button>
</div>
<script>
const $=id=>document.getElementById(id),W=1102,H=1427,HOME="https://easylandx.github.io/app/";
const st=$("stage"),inp=$("url"),fr=$("fr"),stt=$("st");
const VW=600;function fit(){const f=$("fw"),w=f.clientWidth,h=f.clientHeight;if(!w)return;const s=w/VW;fr.style.transform=`scale(${s})`;fr.style.height=(h/s)+"px"}
new ResizeObserver(fit).observe($("fw"));addEventListener("resize",fit);
let isOpen=false,nat=false,muted=false,shift=false,caps=false,hist=[],hi=-1,ac=null;
function audio(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume()}catch(e){}return ac}
function click(big){if(muted)return;const c=audio();if(!c)return;const t=c.currentTime,n=c.sampleRate*.04,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);
for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,big?3:5);
const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type="bandpass";f.frequency.value=big?1400:2400;f.Q.value=.9;const g=c.createGain();g.gain.value=big?1.1:.8;s.connect(f).connect(g).connect(c.destination);s.start(t);
const o=c.createOscillator(),og=c.createGain();o.frequency.setValueAtTime(big?110:170,t);o.frequency.exponentialRampToValueAtTime(50,t+.07);og.gain.setValueAtTime(big?.55:.3,t);og.gain.exponentialRampToValueAtTime(.001,t+.09);o.connect(og).connect(c.destination);o.start(t);o.stop(t+.1);
if(big){const b2=c.createOscillator(),bg=c.createGain();b2.type="sine";b2.frequency.value=1850;bg.gain.setValueAtTime(.18,t+.05);bg.gain.exponentialRampToValueAtTime(.001,t+.9);b2.connect(bg).connect(c.destination);b2.start(t+.05);b2.stop(t+.95)}}
function setOpen(v){isOpen=v;st.classList.add("unbox");st.classList.toggle("open",v);click(true);if(v&&hi<0)go(HOME);if(!v)inp.blur()}
$("closed").addEventListener("click",()=>{audio();setOpen(true)});
$("bp").onclick=()=>{audio();setOpen(!isOpen)};
function norm(q){q=q.trim();if(!q)return"";if(/^https?:\/\//i.test(q))return q;if(/^[\w-]+(\.[\w-]+)+(:\d+)?(\/\S*)?$/.test(q)||/^localhost/.test(q))return"https://"+q;return"https://en.m.wikipedia.org/w/index.php?search="+encodeURIComponent(q)}
function load(u){inp.value=u.replace(/^https?:\/\//,"");stt.textContent="LOADING...";fr.src=u}
function go(q,push=true){const u=norm(q);if(!u)return;if(push){hist=hist.slice(0,hi+1);hist.push(u);hi=hist.length-1}load(u)}
fr.addEventListener("load",()=>{if(fr.src&&fr.src!=="about:blank")stt.textContent="READY_ (BLANK? SITE REFUSES FRAMING)"});
$("bb").onclick=()=>{if(hi>0){hi--;load(hist[hi])}};$("bf").onclick=()=>{if(hi<hist.length-1){hi++;load(hist[hi])}};
$("br").onclick=()=>{if(hi>=0)load(hist[hi])};$("bh").onclick=()=>go(HOME);
$("bn").onclick=function(){nat=!nat;this.classList.toggle("act",nat);inp.inputMode=nat?"url":"none";if(nat)inp.focus();else inp.blur()};
$("bm").onclick=function(){muted=!muted;this.classList.toggle("off",muted)};
$("bfs").onclick=()=>{const h=document.body.classList.toggle("hide");try{h?document.documentElement.requestFullscreen?.():document.fullscreenElement&&document.exitFullscreen()}catch(e){}scrollTo(0,h?document.body.scrollHeight:0)};
inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();click(true);go(inp.value);inp.blur()}});
inp.addEventListener("focus",()=>inp.select());
const SH={"1":"!","2":"@","3":"#","4":"$","5":"%","6":"^","7":"&","8":"*","9":"(","0":")","-":"_","=":"+","\\":"|","[":"{","]":"}",";":":","'":'"',",":"<",".":">","/":"?"};
function typeCh(ch){const s=inp.selectionStart??inp.value.length,e=inp.selectionEnd??s;inp.setRangeText(ch,s,e,"end")}
function press(k){
if(k==="shift"){shift=!shift;click();return}if(k==="caps"){caps=!caps;click();return}
if(k==="enter"){click(true);go(inp.value);return}
click();
if(k==="back"){const s=inp.selectionStart??inp.value.length,e=inp.selectionEnd??s;if(s!==e)inp.setRangeText("",s,e,"end");else if(s>0)inp.setRangeText("",s-1,s,"end");return}
if(k==="space"){typeCh(" ");return}if(k.length!==1)return;
let ch=k;if(/[a-z]/.test(k)){if(shift!==caps)ch=k.toUpperCase()}else if(shift&&SH[k])ch=SH[k];shift=false;typeCh(ch)}
const R=[[905,215,55.5,"1234567890-=\\"],[955,232,62.5,"qwertyuiop["],[1005,240,63,"asdfghjkl;'"],[1058,265,59,"zxcvbnm,./"]];
const K=[];R.forEach(([y,x0,p,s])=>[...s].forEach((c,i)=>K.push([c,x0+i*p,y,52,46])));
K.push(["back",955,905,86,46],["shift",165,1058,150,46],["shift",925,1058,170,46],["enter",925,1005,160,46],["caps",125,1122,72,46],["space",555,1122,560,46],["]",940,955,90,46]);
const kb=$("kb");K.forEach(([k,x,y,w,h])=>{const d=document.createElement("div");d.className="k";d.style.cssText=`left:${(x-w/2)/W*100}%;top:${(y-h/2)/H*100}%;width:${w/W*100}%;height:${h/H*100}%`;
d.addEventListener("pointerdown",e=>{e.preventDefault();audio();d.classList.add("on");press(k);setTimeout(()=>d.classList.remove("on"),110)});kb.appendChild(d)});
(function(){const tip=document.getElementById('tip');let tm=null,hideT=null,sx=0,sy=0,lp=false;
function show(b){const r=b.getBoundingClientRect();tip.textContent=b.title;tip.classList.add('show');const w=tip.offsetWidth,h=tip.offsetHeight;tip.style.left=Math.max(6,Math.min(innerWidth-w-6,r.left+r.width/2-w/2))+'px';tip.style.top=(r.top-h-10)+'px';clearTimeout(hideT);hideT=setTimeout(()=>tip.classList.remove('show'),1800)}
const dock=document.getElementById('dock');
dock.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b)return;lp=false;sx=e.clientX;sy=e.clientY;clearTimeout(tm);tm=setTimeout(()=>{lp=true;show(b)},450)});
const cancel=()=>clearTimeout(tm);
dock.addEventListener('pointerup',cancel);dock.addEventListener('pointercancel',cancel);
dock.addEventListener('pointermove',e=>{if(Math.abs(e.clientX-sx)>10||Math.abs(e.clientY-sy)>10)cancel()});
dock.addEventListener('click',e=>{if(lp){e.stopPropagation();e.preventDefault();lp=false}},true);
dock.addEventListener('contextmenu',e=>e.preventDefault());
})();
$("box").addEventListener("click",()=>{audio();click(true);st.classList.add("unbox")});
</script></body></html>
