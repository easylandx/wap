<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>DigiPro</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg1:#cfe6f7;--bg2:#f2d3ee;--ink:#2b3140;--body1:#f4f6f9;--body2:#aeb5c2;--edge:#7b8394;--lcd:#0b1210;--btn:#dfe3ea;--accent:#e8402f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#232a4a;--bg2:#3c2748;--ink:#e8ebf3}}
:root[data-theme="dark"]{--bg1:#232a4a;--bg2:#3c2748;--ink:#e8ebf3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:auto;touch-action:manipulation;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
body{background:var(--bg1);color:var(--ink);font-family:Orbitron,Arial,sans-serif;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;color:inherit}
#stage{position:absolute;height:108%;aspect-ratio:1448/1086;top:-4%;left:50%;transform:translateX(-50%);perspective:1400px}
#flip{position:absolute;inset:0;transform-style:preserve-3d}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face img{position:absolute;inset:0;width:100%;height:100%;display:block;filter:drop-shadow(0 14px 16px rgba(40,40,80,.35));user-select:none;-webkit-user-drag:none}
#frontFace{transform:rotateY(180deg)}
#backFace{cursor:pointer}
#lcd{position:absolute;left:10.7%;top:29.47%;width:53.17%;height:51.38%;background:var(--lcd);overflow:hidden;font-family:VT323,monospace;color:#fff;container-type:inline-size}
#view{width:100%;height:100%;display:block;object-fit:cover}
#lcd::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.09) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 30% 10%,rgba(255,255,255,.1),transparent 50%)}
.hud{position:absolute;left:0;right:0;display:flex;justify-content:space-between;padding:1.5cqw 3cqw;font-size:clamp(9px,6.4cqw,24px);line-height:1;text-shadow:1px 1px 0 #000;z-index:2;pointer-events:none}
#hudTop{top:0;background:linear-gradient(rgba(0,0,0,.55),transparent)}
#hudBot{bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.bat{display:inline-block;width:6cqw;height:2.6cqw;border:1px solid #fff;margin-left:6px;position:relative;vertical-align:middle}
.bat::before{content:"";position:absolute;inset:1px;background:#7dff7d}
#flashfx{position:absolute;inset:0;background:#fff;opacity:0;z-index:5;pointer-events:none}
#msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:2cqw;font-size:11cqw;background:rgba(0,0,0,.55);z-index:4;text-align:center;padding:3cqw;line-height:1}
#msg small{font-size:6.5cqw;opacity:.85}
.hg{display:inline-block;animation:spin 1s steps(4) infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.zone{position:absolute;background:transparent;border:0;border-radius:18%;padding:0;z-index:3}
.zone:active{background:rgba(40,50,80,.28)}
#bar{display:flex;align-items:center;gap:9px}
#bar .sm{padding:12px 13px}
.sm{font-size:11px;font-weight:600;padding:12px 16px;border-radius:999px;border:1px solid var(--edge);background:linear-gradient(var(--btn),#bcc2cd);color:#2b3140;box-shadow:0 3px 0 #7b8394}
.sm:active{transform:translateY(3px);box-shadow:none}
#shutter{width:68px;height:68px;border-radius:50%;border:3px solid #6f2018;background:radial-gradient(circle at 35% 30%,#ff8a74,var(--accent) 55%,#a02416);box-shadow:0 5px 0 #6f2018,0 8px 14px rgba(0,0,0,.3);font-size:0}
#shutter:active{transform:translateY(4px);box-shadow:0 1px 0 #6f2018}
#hint{font-size:10px;font-weight:600;opacity:.7;margin:0}
.scr{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center}
#gal{background:linear-gradient(160deg,var(--bg1),var(--bg2));justify-content:flex-start;padding:max(14px,env(safe-area-inset-top)) 16px 16px}
#galin{width:min(100%,520px);height:100%;display:flex;flex-direction:column;background:linear-gradient(170deg,var(--body1),var(--body2));border:2px solid var(--edge);border-radius:22px;padding:12px;color:#2b3140}
#galtop{display:flex;gap:6px;align-items:center;margin-bottom:10px;font-size:11px;font-weight:800}
#galtop span{flex:1}
#galtop .sm{padding:9px 12px;font-size:10px}
#grid{flex:1;overflow:auto;background:var(--lcd);border-radius:10px;padding:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;align-content:start;box-shadow:inset 0 0 14px #000}
#grid img{width:100%;aspect-ratio:4/3;object-fit:cover;border:2px solid #333;cursor:pointer;display:block}
#grid p{grid-column:1/-1;color:#fff;font-family:VT323,monospace;font-size:22px;text-align:center;margin-top:30px}
#viewer{background:rgba(10,12,20,.92);gap:12px;padding:16px}
#viewer img{max-width:100%;max-height:68%;border:3px solid #fff}
#viewer .bar{display:flex;gap:8px}

#spacer{height:calc(100vh + 160px)}
#app{position:fixed;left:0;top:0;width:100vw;height:100vh;transform-origin:0 0;overflow:hidden;background:linear-gradient(160deg,var(--bg1),var(--bg2));z-index:1}
#brand{position:absolute;left:12px;top:10px;z-index:10;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.72);padding:5px 7px 5px 12px;border-radius:999px;box-shadow:0 2px 8px rgba(40,40,80,.25)}
#brand .nm{font-weight:800;font-size:17px;letter-spacing:.3px;color:#2b3140}
#logo{display:block;width:30px;height:30px}#logo img{width:100%;height:100%;display:block;border-radius:8px}
#dock{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:22px;z-index:10}
.fab{width:50px;height:50px;border-radius:50%;border:0;padding:0;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.28),0 8px 14px rgba(0,0,0,.28)}
.fab:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.fab svg{width:26px;height:26px}
#bUp{background:linear-gradient(#ffe45c,#ffc400);color:#3a2a00}
#bWa{background:linear-gradient(#3fe07a,#18b24b);color:#fff}
#shutter{width:66px;height:66px}
#bSend{position:absolute;right:16px;bottom:14px;z-index:11;display:none;align-items:center;gap:6px;border:0;border-radius:999px;background:#18b24b;color:#fff;font-weight:800;font-size:13px;padding:12px 18px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
</style></head><body>

/* ---- audio ---- */
let ac=null;
function tone(f,d,type='square',v=.05,t0=0,slide=0){ if(!ac)return; const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+t0;
 o.type=type;o.frequency.setValueAtTime(f,t); if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02);}
function noiseBurst(d,v=.15,t0=0){ if(!ac)return; const n=ac.sampleRate*d,b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);
 for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n); const s=ac.createBufferSource(),g=ac.createGain(); s.buffer=b;g.gain.value=v;s.connect(g).connect(ac.destination);s.start(ac.currentTime+t0);}
const click=()=>tone(1800,.04,'square',.04);
const shutterSnd=()=>{noiseBurst(.05,.2);tone(900,.05,'square',.05,.06);noiseBurst(.07,.15,.14);};
const powerOn=()=>[660,880,1320].forEach((f,i)=>tone(f,.12,'square',.05,i*.1));
const whine=()=>tone(300,.35,'sawtooth',.03,0,4000);

/* ---- camera ---- */
async function startCam(){
 if(stream) stream.getTracks().forEach(t=>t.stop());
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:960}},audio:false});
  video.srcObject=stream; await video.play(); showMsg('');
 }catch(e){ stream=null; showMsg('NO CAMERA','Allow camera access, then tap the camera to retry.'); }
}
function showMsg(a,b){const m=$('#msg'); if(!a){m.style.display='none';return;} m.style.display='flex'; m.innerHTML=a+(b?'<small>'+b+'</small>':'');}

/* ---- the filter pipeline ---- */
let bufs={};
function render(ctx,W,H,flash){
 const el=uploadImg||video, vw=el.videoWidth||el.naturalWidth, vh=el.videoHeight||el.naturalHeight; if(!vw)return;
 let sw=vw,sh=vw*3/4; if(sh>vh){sh=vh;sw=vh*4/3;} sw/=zoom; sh/=zoom;
 lctx.save(); if(facing==='user'&&!uploadImg){lctx.translate(320,0);lctx.scale(-1,1);}
 lctx.drawImage(el,(vw-sw)/2,(vh-sh)/2,sw,sh,0,0,320,240); lctx.restore();     // step 1
 ctx.imageSmoothingEnabled=true; ctx.drawImage(low,0,0,W,H);                         // step 2
 const m=MODES[mode], img=ctx.getImageData(0,0,W,H), src=img.data, k=W+'x'+H;
 const out=bufs[k]||(bufs[k]=new Uint8ClampedArray(src.length)), o=out;
 const g=m.g.slice(), sat=m.s*(flash?1.1:1), con=m.c*(flash?1.25:1), br=m.b+(flash?42:0), no=m.no;
 if(flash){g[0]*=1.05;g[2]*=.95;}
 let sum=0;
 for(let y=0,i=0;y<H;y++){ for(let x=0;x<W;x++,i+=4){
   const il=x>0?i-4:i, ir=x<W-1?i+4:i;                                               // step 3
   let r=src[il],gg=src[i+1],b=src[ir+2];
   const l=.3*r+.59*gg+.11*b; sum+=l;
   r=l+(r-l)*sat; gg=l+(gg-l)*sat; b=l+(b-l)*sat;
   const n=(Math.random()-.5)*no;
   o[i]  =(r*g[0]-128)*con+128+br+n;
   o[i+1]=(gg*g[1]-128)*con+128+br+n;
   o[i+2]=(b*g[2]-128)*con+128+br+n;
   o[i+3]=255;
 }}
 avgLuma=sum/(W*H); img.data.set(out); ctx.putImageData(img,0,0);
 // step 4: bloom from highlights only
 tctx.drawImage(ctx.canvas,0,0,40,30); const t=tctx.getImageData(0,0,40,30),d=t.data;
 for(let i=0;i<d.length;i+=4){const l=(d[i]+d[i+1]+d[i+2])/3,f=Math.max(0,(l-150)/105)*1.6; d[i]*=f;d[i+1]*=f;d[i+2]*=f;}
 tctx.putImageData(t,0,0);
 ctx.save(); ctx.globalCompositeOperation='screen'; ctx.globalAlpha=Math.min(1,m.bl*(flash?1.6:1)); ctx.drawImage(tiny,0,0,W,H); ctx.restore();
 // step 5: vignette + flash glare
 const vg=ctx.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,W*.68); vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,'+(flash?.55:.38)+')');
 ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
 if(flash){const fg=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,W*.5); fg.addColorStop(0,'rgba(255,255,255,.4)'); fg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.fillStyle=fg; ctx.fillRect(0,0,W,H); ctx.restore();}
 stamp(ctx,W,H);
}
function stamp(ctx,W,H){
 const d=new Date(),p=n=>String(n).padStart(2,'0');
 const s=`${p(d.getDate())}.${p(d.getMonth()+1)}.${p(d.getFullYear()%100)} ${p(d.getHours())}:${p(d.getMinutes())}`;
 ctx.font=`${Math.round(H*.085)}px VT323, monospace`; ctx.textAlign='right'; ctx.textBaseline='alphabetic';
 ctx.fillStyle='#ffa530'; ctx.shadowColor='rgba(255,120,0,.8)'; ctx.shadowBlur=H*.012; ctx.fillText(s,W-W*.04,H-H*.05); ctx.shadowBlur=0;
}

/* ---- loop (~15 fps like a cheap LCD) ---- */
let last=0;
function loop(t){ requestAnimationFrame(loop); if(frozen||!stream||t-last<66)return; last=t; render(vctx,320,240,false); }

/* ---- camera controls: invisible hit zones laid over the photo of the real camera ---- */
const IW=1448,IH=1086,wait0=ms=>new Promise(r=>setTimeout(r,ms));
function hud(){hud0();if(playing){$('#hMode').textContent='PLAY ▶';$('#hFlash').textContent='◀ ▶';$('#hLeft').textContent=(pIdx+1)+'/'+photos.length;$('#hZoom').textContent=pz>1?'ZOOM '+pz.toFixed(1)+'x':'DSC'+String(pIdx+1).padStart(5,'0');}}
function hud0(){
 $('#hudTop').style.display=$('#hudBot').style.display=showHud?'flex':'none';
 $('#hMode').textContent=MODES[mode].n+(facing==='user'?' SELF':'');
 $('#hFlash').textContent='⚡'+(flashMode===2?'✕':FLASH[flashMode][0]);
 $('#hLeft').textContent='▣ '+(MAX-photos.length);
 $('#hZoom').textContent=zoom>1?'ZOOM '+zoom.toFixed(1)+'x':'SIZE 640×480';
}
function setMode(i){ if(playing){ if(photos.length){pIdx+=i>mode?1:-1;drawPlay();} return;} mode=(i+MODES.length)%MODES.length;hud();}
function cycleFlash(){flashMode=(flashMode+1)%3;hud();noteMsg('FLASH '+FLASH[flashMode]);}
function setZoom(d){zoom=Math.min(4,Math.max(1,zoom+d));hud();}
function noteMsg(a,b){showMsg(a,b);setTimeout(()=>{if(!busy&&stream)showMsg('');},1300);}
function trashLast(){
 if(playing){
  if(delArm>Date.now()){photos.splice(pIdx,1);persist();delArm=0;if(!photos.length){exitPlay();noteMsg('DELETED');return;}drawPlay();noteMsg('DELETED');}
  else{delArm=Date.now()+2500;noteMsg('DELETE THIS?','Press again');}
  return;
 }
 if(!photos.length){noteMsg('NO IMAGES');return;}
 if(delArm>Date.now()){photos.pop();persist();delArm=0;noteMsg('DELETED');hud();}
 else{delArm=Date.now()+2500;noteMsg('DELETE LAST?','Press again');}
}
/* playback: the play button shows the saved photos on the LCD; ◀ ▶ browse them, OK opens one, shutter goes back to shooting */
let playing=false,pIdx=0;
function playToggle(){ if(busy||flipping)return; if(playing){exitPlay();return;} if(!photos.length){noteMsg('NO IMAGES');return;} playing=true;frozen=true;showMsg('');pIdx=photos.length-1;drawPlay(); }
function exitPlay(){playing=false;frozen=false;pImg=null;view.width=320;view.height=240;view.style.touchAction='';showMsg('');hud();}
/* playback zoom + drag: the photo is drawn at 640x480 so zooming in keeps real detail */
let pImg=null,pz=1,px=0,py=0,drag=null;
function paint(){ if(!pImg)return; const W=view.width,H=view.height; vctx.fillStyle='#000';vctx.fillRect(0,0,W,H); vctx.save(); vctx.translate(W/2+px,H/2+py); vctx.scale(pz,pz); vctx.drawImage(pImg,-W/2,-H/2,W,H); vctx.restore(); }
function clampPan(){const mx=view.width/2*(pz-1),my=view.height/2*(pz-1);px=Math.max(-mx,Math.min(mx,px));py=Math.max(-my,Math.min(my,py));}
function playZoom(d){pz=Math.min(4,Math.max(1,pz+d));clampPan();paint();hud();}
function drawPlay(){
 pIdx=(pIdx+photos.length)%photos.length; pz=1;px=py=0;
 if(view.width!==640){view.width=640;view.height=480;} view.style.touchAction='none';
 const im=new Image(); im.onload=()=>{if(playing){pImg=im;paint();}}; im.src=photos[pIdx].src; hud();
}
view.addEventListener('pointerdown',e=>{if(!playing||pz<=1)return;drag={x:e.clientX,y:e.clientY};try{view.setPointerCapture(e.pointerId);}catch(_){}});
view.addEventListener('pointermove',e=>{
 if(!drag)return; let dx=e.clientX-drag.x,dy=e.clientY-drag.y; drag={x:e.clientX,y:e.clientY};
 if(innerHeight>innerWidth)[dx,dy]=[dy,-dx];            // the app is turned 90° in portrait, so turn the finger movement too
 const k=view.width/view.clientWidth; px+=dx*k;py+=dy*k;clampPan();paint();});
['pointerup','pointercancel'].forEach(t=>view.addEventListener(t,()=>{drag=null;}));
view.addEventListener('wheel',e=>{if(!playing)return;e.preventDefault();playZoom(e.deltaY<0?.5:-.5);},{passive:false});
function okBtn(){ if(playing){cur=photos[pIdx];$('#vimg').src=cur.src;$('#viewer').style.display='flex';} else shoot(); }
const ZONES=[['Shutter',1095,78,220,60,shoot],['Mode dial',780,80,240,50,()=>setMode(mode+1)],['Menu: next mode',1112,400,90,90,()=>setMode(mode+1)],
 ['Display / index',1175,488,80,40,()=>{if(playing){openGal();return;}showHud=!showHud;hud();}],['Previous mode',1090,655,70,80,()=>setMode(mode-1)],['Next mode',1280,655,70,80,()=>setMode(mode+1)],
 ['OK',1185,655,90,90,okBtn],['Flash',1185,745,100,60,cycleFlash],['Play',1112,848,80,80,playToggle],['Delete last',1275,848,80,80,trashLast],
 ['Zoom in',1340,272,100,80,()=>{if(playing)playZoom(.5);else setZoom(.5);}],['Zoom out',1340,352,100,80,()=>{if(playing)playZoom(-.5);else setZoom(-.5);}]];
ZONES.forEach(([n,cx,cy,w,h,fn])=>{
 const z=document.createElement('button'); z.className='zone'; z.setAttribute('aria-label',n);
 z.style.cssText=`left:${(cx-w/2)/IW*100}%;top:${(cy-h/2)/IH*100}%;width:${w/IW*100}%;height:${h/IH*100}%`;
 z.onclick=e=>{e.stopPropagation(); if(fn!==shoot)click(); fn();};
 $('#backFace').appendChild(z);
});
/* tap the camera body: flip it over, then switch between the rear and front (selfie) camera */
async function flipCam(){
 if(flipping||busy||playing)return; flipping=true; click();
 const fl=(MODES[mode].force&&flashMode!==2)||flashMode===1;
 $('#imgFlash').style.display=fl?'block':'none'; $('#imgFront').style.display=fl?'none':'block';
 facing=facing==='user'?'environment':'user'; frozen=true;
 const f=$('#flip'); f.style.transition='transform .55s ease-in-out'; f.style.transform='rotateY(180deg)';
 await Promise.all([startCam(),wait0(1100)]);
 f.style.transform='rotateY(360deg)'; await wait0(600);
 f.style.transition='none'; f.style.transform='rotateY(0deg)';
 frozen=false; flipping=false; hud();
}
/* upload a photo from the device: it goes through the same filter pipeline, date stamp and photo roll */
$('#bUp').onclick=()=>{click();$('#file').click();};
function addUpload(f){return new Promise(done=>{
 if(photos.length>=MAX){noteMsg('MEMORY FULL','Delete shots first.');done();return;}
 const url=URL.createObjectURL(f), im=new Image();
 im.onerror=()=>{done();URL.revokeObjectURL(url);noteMsg('CAN’T OPEN','Try a JPG or PNG.');};
 im.onload=async()=>{
  if(playing)exitPlay(); busy=true; frozen=true; uploadImg=im; render(cctx,640,480,false); uploadImg=null; URL.revokeObjectURL(url);
  vctx.drawImage(cap,0,0,320,240); shutterSnd(); showMsg('<span class="hg">⌛</span>','SAVING...'); await wait0(900);
  const src=cap.toDataURL('image/jpeg',.6); photos.push({id:Date.now(),src});
  if(!persist()){photos.pop();showMsg('SAVE ERROR','Storage is full.');await wait0(1500);}
  else{showMsg('');await wait0(1300);}
  frozen=false; busy=false; hud(); done();
 };
 im.src=url;
});}
$('#file').onchange=async e=>{
 const fs=[...e.target.files]; e.target.value=''; if(busy)return;
 for(const f of fs){ await addUpload(f); if(photos.length>=MAX)break; }
};
$('#backFace').addEventListener('click',flipCam);
$('#bFlip').onclick=flipCam;

/* ---- storage ---- */
function load(){try{photos=JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){photos=[];}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(photos));return true;}catch(e){return false;}}

/* ---- shutter ---- */
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function shoot(){
 if(playing){exitPlay();return;}
 if(busy||!stream)return;
 if(photos.length>=MAX){showMsg('MEMORY FULL','Delete shots in MEMORY STICK.');setTimeout(()=>showMsg(''),1800);return;}
 busy=true;
 const fl=MODES[mode].force&&flashMode!==2||flashMode===1||(flashMode===0&&avgLuma<85);
 if(fl){whine();await wait(250);}
 render(cctx,640,480,fl);
 shutterSnd();
 if(fl){const f=$('#flashfx');f.style.transition='none';f.style.opacity=1;requestAnimationFrame(()=>{f.style.transition='opacity .45s ease-out';f.style.opacity=0;});}
 frozen=true; vctx.drawImage(cap,0,0,320,240);
 showMsg('<span class="hg">⌛</span>','SAVING...');
 await wait(900);
 const src=cap.toDataURL('image/jpeg',.6);
 photos.push({id:Date.now(),src});
 if(!persist()){photos.pop();showMsg('SAVE ERROR','Storage is full.');await wait(1500);}
 else{showMsg('');await wait(1300);}
 frozen=false;busy=false;hud();
}
$('#shutter').onclick=shoot;
addEventListener('keydown',e=>{if(e.code==='Space'&&$('#gal').style.display!=='flex'){e.preventDefault();shoot();}});

/* ---- gallery ---- */
let cur=null;
function openGal(){click();$('#gal').style.display='flex';drawGrid();}
function drawGrid(){
 const g=$('#grid');g.innerHTML='';$('#galcount').textContent='MEMORY STICK  '+photos.length+'/'+MAX;
 if(!photos.length){g.innerHTML='<p>NO IMAGES</p>';return;}
 photos.forEach(p=>{const i=new Image();i.src=p.src;i.alt='Photo';i.onclick=()=>{cur=p;$('#vimg').src=p.src;$('#viewer').style.display='flex';click();};g.appendChild(i);});
}
$('#bGal').onclick=openGal;
$('#bBack').onclick=()=>{$('#gal').style.display='none';click();hud();};
$('#vBack').onclick=()=>{$('#viewer').style.display='none';click();if(playing&&photos.length)drawPlay();};
$('#vDel').onclick=()=>{photos=photos.filter(p=>p!==cur);persist();$('#viewer').style.display='none';drawGrid();hud();if(playing){if(photos.length)drawPlay();else exitPlay();}};
const blobOf=src=>fetch(src).then(r=>r.blob());
async function save(filename,data){
 let dl=null; try{dl=await claude.use('downloads');}catch(e){}
 if(dl){try{await dl.save({filename,data});}catch(e){}}
 else{const a=document.createElement('a');a.href=URL.createObjectURL(data);a.download=filename;a.click();}
}
const dscName=p=>'DSC'+String(photos.indexOf(p)+1).padStart(5,'0')+'.jpg';
$('#vSave').onclick=async()=>save(dscName(cur),await blobOf(cur.src));
/* tiny "stored" ZIP writer so the whole roll downloads as one file */
function crc32(u){let c,t=crc32.t||(crc32.t=Array.from({length:256},(_,n)=>{c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;return c>>>0;}));let r=-1;for(let i=0;i<u.length;i++)r=t[(r^u[i])&255]^(r>>>8);return(r^-1)>>>0;}
async function zipAll(){
 const parts=[],cd=[];let off=0;
 for(const p of photos){
  const u=new Uint8Array(await (await blobOf(p.src)).arrayBuffer()),nm=new TextEncoder().encode(dscName(p)),c=crc32(u);
  const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint32(14,c,true);h.setUint32(18,u.length,true);h.setUint32(22,u.length,true);h.setUint16(26,nm.length,true);
  parts.push(h.buffer,nm,u);
  const e=new DataView(new ArrayBuffer(46));e.setUint32(0,0x02014b50,true);e.setUint16(4,20,true);e.setUint16(6,20,true);e.setUint32(16,c,true);e.setUint32(20,u.length,true);e.setUint32(24,u.length,true);e.setUint16(28,nm.length,true);e.setUint32(42,off,true);
  cd.push(e.buffer,nm);off+=30+nm.length+u.length;
 }
 const cs=cd.reduce((a,b)=>a+(b.byteLength),0),end=new DataView(new ArrayBuffer(22));
 end.setUint32(0,0x06054b50,true);end.setUint16(8,photos.length,true);end.setUint16(10,photos.length,true);end.setUint32(12,cs,true);end.setUint32(16,off,true);
 return new Blob([...parts,...cd,end.buffer],{type:'application/zip'});
}
$('#bAll').onclick=async()=>{if(!photos.length)return;save('y2k-digicam-roll.zip',await zipAll());};

/* ---- start: no splash, the camera is on straight away ---- */
addEventListener('pointerdown',()=>{if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();powerOn();}},{once:true});
load();hud();showMsg('<span class="hg">⌛</span>','STARTING...');
(async()=>{try{await document.fonts.load('20px VT323');}catch(e){} await startCam(); requestAnimationFrame(loop);})();

/* ---- full-screen landscape app shell ---- */
function fit(){const W=innerWidth,H=innerHeight,a=$('#app');
 if(H>W){a.style.width=H+'px';a.style.height=W+'px';a.style.transform='translateX('+W+'px) rotate(90deg)';}   // portrait: turn the whole camera sideways
 else{a.style.width=W+'px';a.style.height=H+'px';a.style.transform='none';}}
function hideBar(){setTimeout(()=>scrollTo(0,1),150);}   // a scrollable page lets iOS Safari tuck its address bar away
['resize','orientationchange'].forEach(t=>addEventListener(t,()=>{fit();hideBar();}));
if(window.visualViewport)visualViewport.addEventListener('resize',fit);
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));
try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{});}catch(e){}
fit();hideBar();
/* ---- WhatsApp: pick a photo from the camera roll, copy it to the clipboard (nothing is saved), open WhatsApp with the message so the photo can be pasted ---- */
const SHARE_TEXT='Taken with DigiPro https://easylandx.github.io/digipro', IS_DESKTOP=!(/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)),
 WA_URL=(IS_DESKTOP?'https://web.whatsapp.com/send?text=':'https://wa.me/?text=')+encodeURIComponent(SHARE_TEXT);   // desktop goes straight to WhatsApp Web
const WA_APP='whatsapp://send?text='+encodeURIComponent(SHARE_TEXT);   // phones open the WhatsApp app itself
let waBlob=null;
const pngOf=src=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=i.naturalWidth;c.height=i.naturalHeight;c.getContext('2d').drawImage(i,0,0);c.toBlob(x=>x?ok(x):no(),'image/png');};i.onerror=no;i.src=src;});
const copyPhoto=()=>navigator.clipboard.write([new ClipboardItem({'image/png':waBlob})]);
function setBtn(t){const b=$('#bSend');b.textContent=t;b.style.display='flex';}
/* no file picker: the photo on the camera screen (the one being played back, or else the latest shot) is copied */
$('#bWa').onclick=async()=>{
 const p=playing?photos[pIdx]:photos[photos.length-1];
 if(!p){noteMsg('NO IMAGES');return;}
 click(); waBlob=pngOf(p.src);        // a promise: the clipboard accepts it while the tap is still fresh
 let ok=true; try{await copyPhoto();}catch(err){ok=false;}
 if(ok){noteMsg('PHOTO COPIED'); if(IS_DESKTOP){if(!window.open(WA_URL,'_blank'))setBtn('OPEN WHATSAPP');} else location.href=WA_APP;}
 else setBtn('COPY & OPEN WHATSAPP');
};
$('#bSend').onclick=()=>{$('#bSend').style.display='none'; if(waBlob)copyPhoto().catch(()=>noteMsg('COPY FAILED')); if(IS_DESKTOP)window.open(WA_URL,'_blank'); else location.href=WA_APP;};
</script></body></html>
