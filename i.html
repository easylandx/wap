<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
<title>IBM Selectric</title>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--u:1px;--mono:"Courier Prime","Courier New",Courier,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#fefefe;overflow:hidden;font-family:system-ui,sans-serif}
#app{position:fixed;left:0;right:0;top:0;overflow:hidden;background:#fefefe}
#stage{position:absolute;left:50%;bottom:env(safe-area-inset-bottom,0px);transform:translateX(-50%);width:calc(var(--u)*1536);height:calc(var(--u)*1024)}
#clip{position:absolute;inset:0;z-index:3;pointer-events:none;clip-path:inset(-6000px 0 calc(var(--u)*772) 0)}
#clip:not(.in) #sheet{visibility:hidden}
#paper{position:absolute;left:calc(var(--u)*396);width:calc(var(--u)*741);bottom:calc(var(--u)*772);height:0;transition:height .17s cubic-bezier(.3,.75,.3,1);background:rgb(245,243,248);box-shadow:0 0 calc(var(--u)*10) rgba(0,0,0,.10)}
#sheet{position:absolute;left:calc(var(--u)*436);top:calc(var(--u)*204);font-family:var(--mono);white-space:pre;color:#17171c}
#sheet.mv{transition:transform .17s cubic-bezier(.3,.75,.3,1)}
.ln span{text-shadow:0 0 .6px currentColor;opacity:.92}
#paper.in{transition:height 1.3s cubic-bezier(.3,.1,.2,1)}
.caret{position:absolute;width:1.5px;background:#17171c;opacity:.35;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
#tw{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:2;pointer-events:none;user-select:none}
#title{position:fixed;z-index:60;top:calc(env(safe-area-inset-top,0px) + 10px);left:14px;height:46px;display:flex;align-items:center;gap:8px;font:700 19px/1 system-ui,sans-serif;letter-spacing:.02em;color:#17171c;text-decoration:none;pointer-events:auto;cursor:pointer;user-select:none}
#title img{width:34px;height:34px;border-radius:8px;display:block;box-shadow:0 1px 4px rgba(0,0,0,.25)}
#title b{color:#c4161c;font-weight:800}
#keys{position:absolute;inset:0;z-index:4}
.k{position:absolute;cursor:pointer;border-radius:calc(var(--u)*9);touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform .06s,background .06s}
.k.dn{background:rgba(0,0,0,.4);transform:translateY(calc(var(--u)*3)) scale(.93)}
.k.nv.dn{background:none;transform:none}
.k.on{background:rgba(255,196,0,.3);box-shadow:inset 0 0 0 calc(var(--u)*3) rgba(255,190,0,.9)}

#aiModal{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(20,16,12,.5)}
#aiModal.on{display:flex}
#aiCard{width:100%;max-width:480px;max-height:92vh;max-height:92dvh;overflow:auto;background:#fbf9f3;border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.4);padding:18px;font-family:system-ui,sans-serif;color:#17171c}
#aiCard h2{margin:0 0 4px;font:700 21px/1.2 var(--mono)}
#aiCard .s{margin:0 0 12px;font-size:13px;color:#666}
#aiTypes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
#aiTypes button{font:600 13.5px/1.25 system-ui,sans-serif;padding:10px 9px;border-radius:10px;border:1px solid #d9d3c6;background:#fff;color:#17171c;cursor:pointer;text-align:left}
#aiTypes button.sel{background:#17171c;color:#fff;border-color:#17171c}
.aiF{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font-size:12px;color:#555}
.aiF input,.aiF textarea{font:16px system-ui,sans-serif;padding:10px;border:1px solid #d9d3c6;border-radius:10px;background:#fff;color:#17171c;width:100%;resize:none}
.aiRow{display:flex;gap:10px}.aiRow .aiF{flex:1;min-width:0}
.aiAct{display:flex;gap:10px;justify-content:flex-end;margin-top:4px}
.aiAct button{font:600 15px system-ui,sans-serif;padding:11px 18px;border-radius:999px;border:1px solid #d9d3c6;background:#fff;color:#17171c;cursor:pointer}
.aiAct #aiGo{background:#c4161c;border-color:#c4161c;color:#fff}
.aiAct #aiGo:disabled{opacity:.4;cursor:default}
#skip{position:fixed;z-index:85;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);display:none;background:#17171c;color:#fff;border:0;border-radius:999px;padding:11px 18px;font:600 14px system-ui,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.35);cursor:pointer}
#skip.on{display:block}
#fab2{position:fixed;z-index:60;top:calc(env(safe-area-inset-top,0px) + 66px);right:10px;display:flex;flex-direction:column;gap:10px}
#fab2 button{width:46px;height:46px;border-radius:50%;border:1px solid #ddd;background:rgba(255,255,255,.94);box-shadow:0 2px 8px rgba(0,0,0,.18);display:grid;place-items:center;padding:0;cursor:pointer}
#fab2 button:active{transform:scale(.94)}
#fab2 #bKb{display:none}
#fab2 #bKb.on{background:#17171c;border-color:#17171c}
#fab2 #bKb.on svg{stroke:#fff}
#fab2 #bAI.busy{background:#17171c}
#fab2 #bAI.busy svg{stroke:#fff}

#ta{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;font-size:16px;border:0;padding:0;resize:none}
#fab{position:fixed;z-index:60;top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;display:flex;gap:10px}
#fab button{width:46px;height:46px;border-radius:50%;border:1px solid #ddd;background:rgba(255,255,255,.94);box-shadow:0 2px 8px rgba(0,0,0,.18);display:grid;place-items:center;padding:0;cursor:pointer}
#fab button:active{transform:scale(.94)}
#fab #bWA{background:#25D366;border-color:#1fb956}
#fab #bWA svg{display:block}
#fab #bKb-OLD{display:none}
@media (hover:none) and (pointer:coarse){#fab2 #bKb{display:grid}}

@media (max-width:480px){#title{left:12px;gap:6px;font-size:15px}#title img{width:28px;height:28px;border-radius:7px}#fab{gap:6px;right:8px}#fab button{width:40px;height:40px}#fab button svg{width:22px;height:22px}#fab2{top:calc(env(safe-area-inset-top,0px) + 60px);gap:6px;right:8px}#fab2 button{width:40px;height:40px}#fab2 button svg{width:22px;height:22px}}
@media (max-width:360px){#title{left:10px;font-size:14px}#fab{gap:4px;right:6px}#fab button{width:36px;height:36px}#fab button svg{width:20px;height:20px}#fab2{top:calc(env(safe-area-inset-top,0px) + 56px);gap:4px;right:6px}#fab2 button{width:36px;height:36px}#fab2 button svg{width:20px;height:20px}}
#bInk i{width:20px;height:20px;border-radius:50%;background:var(--c,#17171c);box-shadow:0 0 0 3px #fff,0 0 0 4px #bbb}
#letter{position:fixed;inset:0;z-index:40;display:none;overflow:auto;background:#d8d4cb;padding:calc(env(safe-area-inset-top,0px) + 66px) 12px 28px;touch-action:pan-x pan-y pinch-zoom}
.page{margin:0 auto 18px;background:radial-gradient(circle at 30% 20%,#fffefb,#fbf9f3 70%,#f6f3ea);box-shadow:0 4px 18px rgba(0,0,0,.28);font-family:var(--mono);white-space:pre;color:#17171c;position:relative;flex:none}
.page .ln{position:absolute}
#intro{position:fixed;inset:0;padding:0 16px;z-index:80;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .5s;cursor:pointer}
#intro img{width:min(92vw,640px);border-radius:6px;box-shadow:0 14px 30px rgba(0,0,0,.25)}
#intro p{margin:0;font-size:15px;letter-spacing:.08em;color:#444;text-transform:uppercase}
#toast{position:fixed;z-index:90;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);background:#17171c;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
</style></head><body>

  <div id="sheet"></div></div>

<div id="toast"></div>
<script>
const IMG_W=1536,PXU=396,PWU=741,MU=40,COLS=36,Y0=262,LPP=22,RATIO=1.4142;
const fsU=(PWU-2*MU)/COLS/0.6,lhU=fsU*1.5,cwU=fsU*0.6;
const INKS=['#17171c','#c4161c','#1c3f9e'];
const $=id=>document.getElementById(id),root=document.documentElement;
const app=$('app'),sheet=$('sheet'),ta=$('ta'),letterEl=$('letter');
let text='',cols=[],inkIdx=0,letterMode=false,u=1,lines=[[0,0]];
let quiet=false,fed=false;const PEEK=105;

/* ================= AUDIO (synthesised Selectric) ================= */
let AC=null,master=null,noiseBuf=null,hum=null,humT=0;
function initAudio(){
 if(AC){if(AC.state==='suspended')AC.resume();return}
 try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
 master=AC.createGain();master.gain.value=.95;
 const cp=AC.createDynamicsCompressor();cp.threshold.value=-16;cp.ratio.value=3.5;cp.attack.value=.002;cp.release.value=.12;
 master.connect(cp);cp.connect(AC.destination);
 const n=AC.sampleRate*2,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
 for(let i=0;i<n;i++)d[i]=Math.random()*2-1;noiseBuf=b}
function nz(t,dur,o){o=o||{};if(!AC)return;
 const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;
 const fl=AC.createBiquadFilter();fl.type=o.type||'bandpass';fl.frequency.setValueAtTime(o.f||1000,t);
 if(o.f2)fl.frequency.exponentialRampToValueAtTime(o.f2,t+dur);fl.Q.value=o.q||1;
 const g=AC.createGain(),pk=o.g||.3,at=o.att||.002;
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(pk,t+at);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 s.connect(fl);fl.connect(g);g.connect(master);s.start(t,Math.random()*1.5);s.stop(t+dur+.05)}
function tn(t,dur,o){o=o||{};if(!AC)return;
 const os=AC.createOscillator();os.type=o.type||'sine';os.frequency.setValueAtTime(o.f||100,t);
 if(o.f2)os.frequency.exponentialRampToValueAtTime(o.f2,t+dur);
 const g=AC.createGain(),pk=o.g||.3,at=o.att||.002;
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(pk,t+at);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 os.connect(g);g.connect(master);os.start(t);os.stop(t+dur+.05)}
const rnd=()=>.92+Math.random()*.16;
function sKey(){if(!AC)return;const t=AC.currentTime,r=rnd(),v=.85+Math.random()*.3;
 nz(t,.012,{f:4300*r,q:.8,g:.10*v});                               /* key bottoms */
 tn(t+.004,.07,{f:175*r,f2:68,g:.34*v,type:'triangle'});          /* rotor tilt clunk */
 nz(t+.006,.055,{f:880*r,q:.9,g:.22*v});
 nz(t+.028,.03,{f:2700*r,q:.7,g:.58*v});                           /* ball strikes platen */
 nz(t+.03,.1,{f:1350*r,f2:650,q:1.1,g:.36*v});
 tn(t+.03,.09,{f:250*r,f2:105,g:.42*v});
 tn(t+.032,.13,{f:92*r,f2:48,g:.5*v});                             /* platen thud */
 tn(t+.03,.14,{f:3150*r,g:.035*v});
 }
function sSpace(){if(!AC)return;const t=AC.currentTime,r=rnd();
 nz(t,.012,{f:3600*r,g:.07});tn(t,.1,{f:135*r,f2:58,g:.52,type:'triangle'});nz(t+.004,.05,{f:620*r,g:.26});
 tn(t+.02,.12,{f:80,f2:48,g:.28});}
function sBack(){if(!AC)return;const t=AC.currentTime,r=rnd();
 nz(t,.012,{f:3800*r,g:.12});tn(t+.004,.06,{f:310*r,f2:120,g:.35,type:'triangle'});
 nz(t+.02,.012,{f:2600,g:.2});nz(t+.045,.012,{f:2400,g:.18});tn(t+.05,.08,{f:95,f2:55,g:.35});}
function sShift(){if(!AC)return;const t=AC.currentTime;
 nz(t,.02,{f:1900,g:.28});tn(t+.015,.11,{f:115,f2:58,g:.5,type:'triangle'});nz(t+.045,.045,{f:720,g:.3});nz(t+.07,.012,{f:3200,g:.14});}
function sLock(){if(!AC)return;const t=AC.currentTime;
 nz(t,.012,{f:3000,g:.25});tn(t+.01,.15,{f:72,f2:42,g:.65});nz(t+.012,.07,{f:400,g:.35});nz(t+.09,.015,{f:4200,g:.16})}
function sTab(){if(!AC)return;const t=AC.currentTime;
 nz(t,.2,{type:'highpass',f:1800,f2:5200,q:.7,g:.1,att:.04});
 for(let i=0;i<5;i++)nz(t+i*.035,.01,{f:3000+i*220,g:.16});
 nz(t+.2,.04,{f:1400,g:.38});tn(t+.2,.12,{f:110,f2:55,g:.6})}
function sBell(){if(!AC)return;const t=AC.currentTime;
 [[2093,.2,1.5],[5760,.1,1],[2640,.07,.9],[9100,.035,.5],[1560,.06,1.3]].forEach(([f,g,d])=>tn(t,d,{f:f,g:g,att:.001}));
 nz(t,.008,{f:6000,g:.2})}
function sReturn(){if(!AC)return;const t=AC.currentTime;
 nz(t,.02,{f:3000,g:.3});tn(t,.07,{f:210,f2:100,g:.4,type:'triangle'});                 /* return lever */
 nz(t+.03,.5,{f:380,f2:2100,q:1.3,g:.24,att:.12});                                    /* carriage whir */
 tn(t+.03,.5,{type:'sawtooth',f:110,f2:300,g:.07,att:.12});
 for(let i=0;i<9;i++)nz(t+.05+i*.05,.01,{f:2400+i*160,g:.12});                         /* ratchet */
 nz(t+.53,.05,{f:1500,g:.5});tn(t+.53,.18,{f:78,f2:40,g:.75});nz(t+.535,.09,{f:520,g:.4});  /* carriage stop */
 tn(t+.55,.2,{f:2400,g:.03});}
function sInk(){if(!AC)return;const t=AC.currentTime;
 nz(t,.01,{f:5000,g:.22});tn(t,.07,{f:430,f2:210,g:.3,type:'triangle'});
 nz(t+.06,.015,{f:3500,g:.28});tn(t+.06,.09,{f:190,f2:90,g:.45});nz(t+.065,.04,{f:900,g:.2})}
function sFeed(){if(!AC)return;const t=AC.currentTime;
 nz(t,1.2,{type:'highpass',f:2500,f2:6500,q:.6,g:.06,att:.2});                          /* paper rustle */
 for(let i=0;i<17;i++){const k=t+i*.066;nz(k,.012,{f:2000+i*45,g:.2});tn(k,.045,{f:150,f2:90,g:.1,type:'triangle'})}
 tn(t,1.15,{type:'sawtooth',f:90,f2:180,g:.05,att:.2});
 nz(t+1.2,.05,{f:1100,g:.35});tn(t+1.2,.12,{f:100,f2:50,g:.45});}
function sRustle(){if(!AC)return;const t=AC.currentTime;
 nz(t,.45,{type:'bandpass',f:1200,f2:4200,q:.5,g:.18,att:.05});
 for(let i=0;i<6;i++)nz(t+Math.random()*.4,.03,{f:800+Math.random()*3000,g:.12})}
function sPage(){if(!AC)return;const t=AC.currentTime;
 nz(t,.3,{type:'bandpass',f:1500,f2:5200,q:.5,g:.16,att:.04});nz(t+.28,.03,{f:900,g:.18})}
function sPop(){if(!AC)return;const t=AC.currentTime;
 tn(t,.1,{f:520,f2:880,g:.22});tn(t+.09,.14,{f:880,f2:1320,g:.18});nz(t,.01,{f:4000,g:.12})}

const ICON_DOC='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#17171c" stroke-width="1.8" stroke-linejoin="round"><path d="M6 2.500h8l4 4V21.500H6z"/><path d="M14 2.500v4h4M9 11h6M9 14.500h6M9 18h4" stroke-linecap="round"/></svg>';
const ICON_TW='<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#17171c" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="11" rx="2.500"/><path d="M7 14h.01M11 14h.01M15 14h.01M8 17h8"/></svg>';
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');

function wrap(t){const out=[];let o=0;const ps=t.split('\n');
 for(const p of ps){let s=p;
  while(s.length>COLS){const k=s.lastIndexOf(' ',COLS);
   if(k<=0){out.push([o,o+COLS]);s=s.slice(COLS);o+=COLS}
   else{out.push([o,o+k]);s=s.slice(k+1);o+=k+1}}
  out.push([o,o+s.length]);o+=s.length+1}
 return out}
function runs(s,e){let h='',cur=-1,buf='';
 for(let i=s;i<e;i++){const c=cols[i];if(c!==cur){if(buf)h+=`<span style="color:${INKS[cur]}">${esc(buf)}</span>`;buf='';cur=c}buf+=text[i]}
 if(buf)h+=`<span style="color:${INKS[cur]}">${esc(buf)}</span>`;return h}

function layout(){const vv=window.visualViewport,h=vv?vv.height:innerHeight;
 if(vv&&vv.scale>1.02)return;
 app.style.height=h+'px';app.style.top=(vv?vv.offsetTop:0)+'px';
 u=Math.min(innerWidth,820,h*1.25)/IMG_W;root.style.setProperty('--u',u+'px');
 sheet.style.fontSize=fsU*u+'px';sheet.style.lineHeight=lhU*u+'px';
 render();if(letterMode)buildLetter()}

function render(){lines=wrap(text);const n=lines.length-1;
 let h=lines.map(([s,e])=>`<div class="ln" style="height:${lhU*u}px">${runs(s,e)}</div>`).join('');
 const last=lines[n],cl=last[1]-last[0];
 h+=`<i class="caret" style="left:${cl*cwU*u}px;top:${n*lhU*u+lhU*u*.16}px;height:${lhU*u*.68}px"></i>`;
 sheet.innerHTML=h;sheet.style.transform=`translateY(${-n*lhU*u}px)`;paperH()}
function paperH(){if(!fed)return;$('paper').style.height=((PEEK+(lines.length-1)*lhU)*u)+'px'}

function buildLetter(){
 const pw=Math.min(innerWidth-24,(innerHeight-100)/RATIO,794),ph=pw*RATIO;
 const fs=pw*0.72/COLS/0.6,lh=fs*1.5,np=Math.max(1,Math.ceil(lines.length/LPP));let h='';
 for(let p=0;p<np;p++){
  h+=`<div class="page" style="width:${pw}px;height:${ph}px;font-size:${fs}px;line-height:${lh}px">`;
  lines.slice(p*LPP,p*LPP+LPP).forEach(([s,e],i)=>{h+=`<div class="ln" style="left:${pw*.14}px;top:${ph*.1+i*lh}px;height:${lh}px">${runs(s,e)}</div>`});
  h+='</div>'}
 letterEl.innerHTML=h}

function setMode(m){if(typeof finishAuto==='function')finishAuto();letterMode=m;letterEl.style.display=m?'block':'none';
 $('bInk').style.display=m?'none':'';$('fab2').style.display=m?'none':'';$('bView').innerHTML=m?ICON_TW:ICON_DOC;
 if(m){ta.blur();lines=wrap(text);buildLetter();letterEl.scrollTop=0}else{ta.focus();}}

ta.addEventListener('input',()=>{const t=ta.value.replace(/\r/g,'');const old=text.length;let p=0;const m=Math.min(t.length,text.length);
 while(p<m&&t[p]===text[p])p++;
 cols.length=p;for(let i=p;i<t.length;i++)cols.push(inkIdx);
 text=t;render();ta.setSelectionRange(t.length,t.length);
 if(quiet){}else if(t.length>old){const c=t[t.length-1];
  if(c==='\n')sReturn();else if(c===' ')sSpace();else sKey();
  const L=lines[lines.length-1];if(c!=='\n'&&L[1]-L[0]===COLS-5)setTimeout(sBell,80)}

 const x=c.getContext('2d');x.scale(S,S);x.fillStyle='#d8d4cb';x.fillRect(0,0,c.width,c.height);
 const fs=BW*0.72/COLS/0.6,lh=fs*1.5,cw=fs*0.6;
 for(let p=0;p<np;p++){const py=pad+p*(BH+pad);
  x.save();x.shadowColor='rgba(0,0,0,.3)';x.shadowBlur=18;x.shadowOffsetY=4;x.fillStyle='#fbf9f3';x.fillRect(pad,py,BW,BH);x.restore();
  const g=x.createRadialGradient(pad+BW*.3,py+BH*.2,0,pad+BW*.3,py+BH*.2,BH);g.addColorStop(0,'#fffefb');g.addColorStop(1,'#f6f3ea');x.fillStyle=g;x.fillRect(pad,py,BW,BH);
  x.font=`${fs}px "Courier Prime","Courier New",Courier,monospace`;x.textBaseline='alphabetic';x.globalAlpha=.93;
  ls.slice(p*LPP,p*LPP+LPP).forEach(([s,e],i)=>{const y=py+BH*.1+i*lh+lh*.68;
   for(let k=s;k<e;k++){if(text[k]===' ')continue;x.fillStyle=INKS[cols[k]];x.fillText(text[k],pad+BW*.14+(k-s)*cw,y)}});
  x.globalAlpha=1}

 love:()=>[`My dearest${to?' '+to:''},`,

 return writeLocal(id,to,from,about)}

function autoType(txt){
 const chars=(text.length?'\n\n':'')+txt;let i=0;
 $('skip').classList.add('on');
 const step=()=>{if(!typing)return;
  if(i>=chars.length){endAuto();return}
  const c=chars[i++];flashKey(c==='\n'?'Enter':c);typeText(c);
  const d=c==='\n'?330:c===' '?42:/[.,;:!?]/.test(c)?85:16+Math.random()*16;
  typing.t=setTimeout(step,d)};
 typing={t:0,rest:()=>chars.slice(i),stop:()=>{i=chars.length}};
 setTimeout(step,250)}
function endAuto(){typing=null;$('skip').classList.remove('on');toast('Letter written — tap the page icon to see it',3200)}
function finishAuto(){if(!typing)return;clearTimeout(typing.t);const r=typing.rest();typing=null;$('skip').classList.remove('on');
 if(r){quiet=true;ta.value=ta.value+r;ta.dispatchEvent(new Event('input'));quiet=false;sReturn()}}
