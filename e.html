<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#161b33">
<title>LibroPro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Karla:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1226;--fg:#efe6d2;--mute:#9aa0bf;--gilt:#c9a24a;--pg:#1b2040;--pf:#efe6d2;--bar:rgba(15,18,38,.88);
--serif:'Cormorant Garamond',Georgia,serif;--sans:'Karla',system-ui,sans-serif;
--st:max(20px,calc(env(safe-area-inset-top) + 14px));--sb:max(22px,calc(env(safe-area-inset-bottom) + 14px));
--sl:max(22px,calc(env(safe-area-inset-left) + 16px));--sr:max(22px,calc(env(safe-area-inset-right) + 16px))}
:root[data-theme=light]{--bg:#efe6d2;--fg:#161b33;--mute:#5b6180;--pg:#f7f0de;--pf:#2a2418}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{position:fixed;inset:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--sans);overflow:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
/* Estantería */
#shelf{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--st) + 22px) var(--sr) calc(var(--sb) + 28px) var(--sl)}
#shelf header{max-width:60rem;margin:0 auto 26px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
#shelf h1{margin:0;font:700 2.1rem/1 var(--serif);color:var(--gilt)}
#shelf header p{margin:4px 0 0;color:var(--mute);font-size:.9rem}
#grid{max-width:60rem;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:26px 18px}
.bk{background:none;border:0;padding:0;text-align:left}
.cv{aspect-ratio:2/3;border-radius:4px 8px 8px 4px;background:linear-gradient(135deg,#2a3166,#161b33);border:1px solid #c9a24a55;box-shadow:0 6px 16px #0006;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:10px;text-align:center;font:700 1rem/1.15 var(--serif);color:var(--gilt)}
.cv img{width:100%;height:100%;object-fit:cover;display:block;margin:-10px;max-width:none;width:calc(100% + 20px);height:calc(100% + 20px)}
.bk b{display:block;margin-top:9px;font:700 1.02rem/1.15 var(--serif)}
.bk i{display:block;font-style:normal;color:var(--mute);font-size:.82rem}
.pill{background:var(--bar);color:#efe6d2;border:1px solid var(--gilt);border-radius:22px;height:40px;min-width:40px;padding:0 12px;font:600 .85rem var(--sans)}
/* Lector */
#rd{position:fixed;inset:0;background:var(--pg)}
#stage{position:absolute;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
#sheet{position:absolute;inset:0;will-change:transform}
#img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:#0b0d1c;pointer-events:none;-webkit-user-drag:none}
#txt,#meas{position:absolute;inset:0;overflow:hidden;background:var(--pg);color:var(--pf);font:500 18px/1.6 var(--serif);
padding:max(64px,calc(env(safe-area-inset-top) + 52px)) max(30px,calc(env(safe-area-inset-right) + 26px)) max(48px,calc(env(safe-area-inset-bottom) + 38px)) max(30px,calc(env(safe-area-inset-left) + 26px));text-align:justify;hyphens:auto}
#meas{visibility:hidden;pointer-events:none;z-index:-1}
#txt p,#meas p{margin:0 0 .6em}
@media(min-width:760px){#txt,#meas{padding-left:max(60px,calc((100% - 44rem)/2));padding-right:max(60px,calc((100% - 44rem)/2))}}
#ind{flex:none;background:var(--bar);color:#efe6d2;border:1px solid #c9a24a88;border-radius:16px;height:32px;padding:0 11px;font:600 .78rem var(--sans);white-space:nowrap;letter-spacing:.02em}
#tb,#bb{position:absolute;z-index:6;left:var(--sl);right:var(--sr);display:flex;align-items:center;gap:8px;transition:opacity .25s}
#tb{top:var(--st)}#bb{bottom:var(--sb);justify-content:center;flex-wrap:wrap}
#tb>*{transition:opacity .25s}
#tt{flex:1;min-width:0;text-align:center;font:700 1rem var(--serif);color:var(--gilt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 4px #000a}
body:not(.c) #bb{opacity:0;pointer-events:none}
body:not(.c) #tb{pointer-events:none}body:not(.c) #tb>*:not(#ind){opacity:0;pointer-events:none}body:not(.c) #ind{pointer-events:auto}
@media(max-width:520px){#tt{display:none}#tb .lgs{margin-left:auto}}
#play{width:58px;height:58px;border-radius:50%;background:var(--gilt);color:#1b1608;border-color:var(--gilt);font-size:1.3rem;padding:0}
#wa{background:#25D366;border-color:#25D366;color:#fff;display:inline-flex;align-items:center;gap:6px}
#au[aria-pressed=true]{background:var(--gilt);color:#1b1608}
.lgs{display:flex;gap:8px;align-items:center}.lgs button{width:38px;height:27px;padding:0;border:2px solid transparent;border-radius:6px;background:none;overflow:hidden;opacity:.55;line-height:0}
.lgs button[aria-pressed=true]{opacity:1;border-color:var(--gilt)}.lgs svg{width:100%;height:100%;display:block}
#tb .lgs{background:var(--bar);padding:6px 8px;border-radius:22px;border:1px solid var(--gilt)}
.ar{position:absolute;top:50%;z-index:6;transform:translateY(-50%);width:42px;height:62px;border-radius:21px;padding:0;font-size:2rem;line-height:1;opacity:.5;transition:opacity .25s}
body.c .ar{opacity:1}#pv{left:max(8px,env(safe-area-inset-left))}#nx{right:max(8px,env(safe-area-inset-right))}
#menu,#cmenu{position:absolute;inset:0;z-index:9;background:#0f1226cc;display:flex;justify-content:flex-end}
#cmenu{justify-content:flex-start}
#menu .pn,#cmenu .pn{width:min(320px,88%);height:100%;background:var(--bg);color:var(--fg);overflow-y:auto;padding:calc(var(--st) + 8px) var(--sr) var(--sb) 20px;border-left:1px solid var(--gilt)}
#cmenu .pn{border-left:0;border-right:1px solid var(--gilt);padding:calc(var(--st) + 8px) 20px var(--sb) var(--sl)}
#cmenu .bt{margin:-4px 0 10px;color:var(--mute);font:400 .85rem var(--sans)}
#menu h2,#cmenu h2{margin:0 0 10px;font:700 1.5rem var(--serif);color:var(--gilt)}
.mi{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #c9a24a33;padding:12px 4px;font:700 1.05rem var(--serif)}
.mi i{display:block;font:400 .8rem var(--sans);color:var(--mute)}.mi[aria-current=true]{color:var(--gilt)}
#msg{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0f1226ee;color:#efe6d2;text-align:center;padding:40px}
</style>
</head>
<body>
<section id="shelf">
  <header><div><h1 id="appn"></h1><p id="sub"></p></div><div style="display:flex;gap:8px"><button class="pill" id="sth"></button><div class="lgs"></div></div></header>
  <div id="grid"></div>
</section>
<section id="rd" hidden>
  <div id="stage"><div id="sheet"><img id="img" alt=""><div id="txt" hidden></div></div></div>
  <div id="meas"></div>
  <div id="tb"><button id="ind"></button><button class="pill" id="back">‹</button><button class="pill" id="mb">☰</button><button class="pill" id="chb" hidden></button><div id="tt"></div><div class="lgs"></div></div>
  <div id="bb"><button class="pill" id="vw"></button><button class="pill" id="au">↻ Auto</button><button class="pill" id="play">▶</button><button class="pill" id="spd">1×</button><button class="pill" id="th"></button><button class="pill" id="wa"><svg viewBox="0 0 24 24" width="16" height="16" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.1-1.3A10 10 0 1 0 12 2zm5.2 13.7c-.2.6-1.2 1.2-1.7 1.2-.4 0-1 .2-3.3-.7-2.8-1.2-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6c-.1.1-.3.3-.1.6.6 1 1.3 1.7 2.3 2.2.3.2.5.1.7-.1l.8-1c.2-.2.4-.2.6-.1l1.9.9c.3.1.5.2.5.4 0 .2 0 .8-.2 1.3z"/></svg>WhatsApp</button></div>
  <button class="pill ar" id="pv" aria-label="‹">‹</button><button class="pill ar" id="nx" aria-label="›">›</button>
  <div id="menu" hidden><div class="pn"><h2 id="mh"></h2><div id="mlist"></div></div></div>
  <div id="cmenu" hidden><div class="pn"><h2 id="cmh"></h2><div class="bt" id="cbt"></div><div id="clist"></div></div></div>
  <div id="msg" hidden><div id="mt"></div><button class="pill" id="retry"></button></div>
</section>
<script>
(()=>{
/* ===== CONFIGURACIÓN: para otra app de la serie, cambia solo APP y BOOKS ===== */
const APP={name:'LibroPro',key:'lp',sub:{es:'Literatura española',en:'Spanish literature'},voice:'es-ES'};
const BOOKS=[
['quijote','Don Quijote de la Mancha','Cervantes','title:(quijote) AND creator:(cervantes)'],
['novelas','Novelas ejemplares','Cervantes','title:("novelas ejemplares")'],
['lazarillo','Lazarillo de Tormes','Anónimo','title:(lazarillo)'],
['celestina','La Celestina','Fernando de Rojas',null,'La Celestina','celestina'],
['rimas','Rimas','Bécquer','title:(rimas) AND creator:(becquer OR bécquer)'],
['leyendas','Leyendas','Bécquer',null,'Leyendas (Bécquer)','leyendas'],
['quevedo','Obras','Quevedo',null,'Obras de Quevedo','quevedo'],
['garcilaso','Obras','Garcilaso de la Vega','creator:(garcilaso)'],
['lope','Fuenteovejuna','Lope de Vega',null,'Fuenteovejuna','fuenteovejuna'],
['calderon','La vida es sueño','Calderón de la Barca','title:("vida es sueño")'],
['manrique','Coplas','Jorge Manrique','title:(coplas) AND creator:(manrique)'],
['machado','Campos de Castilla','Antonio Machado','title:("campos de castilla")'],
['dario','Prosas profanas','Rubén Darío',null,'Prosas profanas y otros poemas','prosas profanas'],
['galdos','Fortunata y Jacinta','Galdós',null,'Fortunata y Jacinta','fortunata'],
['regenta','La Regenta','Clarín',null,'La Regenta','regenta'],
['valera','Pepita Jiménez','Juan Valera','title:("pepita jimenez" OR "pepita jiménez")']];
const T={es:{retry:'Reintentar',err:'No se pudo cargar. Revisa tu conexión.',load:'Cargando…',page:'Página',text:'Texto',goto:'Ir a la página',read:'Leer',theme:['☀ Claro','☾ Oscuro'],share:'Leo en '+APP.name,books:'Libros',auto:'Pasar página automáticamente',spd:'Velocidad de lectura',ch:'Capítulos e índice',chb:'Cap.'},
 en:{retry:'Retry',err:'Could not load. Check your connection.',load:'Loading…',page:'Page',text:'Text',goto:'Go to page',read:'Read',theme:['☀ Light','☾ Dark'],share:'Reading in '+APP.name,books:'Books',auto:'Turn pages automatically',spd:'Reading speed',ch:'Chapters & index',chb:'Ch.'}};
/* ===== utilidades ===== */
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const ls={g:k=>{try{return localStorage.getItem(k)}catch(e){return null}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},d:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const K=APP.key+'-';
let lang=ls.g(K+'lang')||((navigator.language||'es').startsWith('en')?'en':'es'),theme=ls.g(K+'theme')||'dark';
let prefTxt=false,bk=null,n=0,page=0,sub=0,scr=[''],txtMode=false,rid=0,busy=0,z=1,tx=0,ty=0,rate=+ls.g(K+'rate')||1,reading=0,tok=0,pend=null,auto=0,autoT=0;
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const html=s=>s.split('¶').map(x=>x.trim()).filter(Boolean).map(x=>'<p>'+esc(x)+'</p>').join('');
const clean=t=>(t||'').replace(/\r/g,'').replace(/^[ \t]*\d{1,4}[ \t]*$/gm,'').replace(/-\n\s*(?=[a-záéíóúñ])/g,'').replace(/\n{2,}/g,' ¶ ').replace(/\n/g,' ').replace(/[ \t]+/g,' ').trim();
const cover=id=>'https://archive.org/services/img/'+id;
/* ===== interfaz ===== */
function ui(){
  document.documentElement.dataset.theme=theme;document.documentElement.lang=lang;
  $('#appn').textContent=APP.name;$('#sub').textContent=APP.sub[lang];document.title=APP.name;
  $('#sth').textContent=T[lang].theme[theme==='dark'?0:1];$('#th').textContent=theme==='dark'?'☀':'☾';
  document.querySelectorAll('.lgs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));
  $('#au').setAttribute('aria-pressed',!!auto);$('#au').title=T[lang].auto;$('#spd').title=T[lang].spd;$('#mh').textContent=T[lang].books;
  $('#vw').textContent=txtMode?T[lang].page:T[lang].text;$('#retry').textContent=T[lang].retry;$('#spd').textContent=rate+'×';
  $('#play').textContent=reading?'❚❚':'▶';$('#chb').textContent=T[lang].chb;$('#chb').title=T[lang].ch;
  $('meta[name=theme-color]').content=theme==='dark'?'#161b33':'#efe6d2';
}
function toggleTheme(){theme=theme==='dark'?'light':'dark';ls.s(K+'theme',theme);ui()}
function setLang(l){lang=l;ls.s(K+'lang',lang);ui();ind()}
const FL={es:'<svg viewBox="0 0 36 26" preserveAspectRatio="none"><rect width="36" height="26" fill="#c60b1e"/><rect y="6.5" width="36" height="13" fill="#ffc400"/></svg>',
en:'<svg viewBox="0 0 60 30" preserveAspectRatio="none"><rect width="60" height="30" fill="#012169"/><path d="M0 0l60 30m0-30L0 30" stroke="#fff" stroke-width="6"/><path d="M0 0l60 30m0-30L0 30" stroke="#c8102e" stroke-width="3"/><path d="M30 0v30M0 15h60" stroke="#fff" stroke-width="10"/><path d="M30 0v30M0 15h60" stroke="#c8102e" stroke-width="6"/></svg>'};
document.querySelectorAll('.lgs').forEach(d=>{d.innerHTML=['es','en'].map(l=>`<button data-l="${l}" aria-label="${l.toUpperCase()}">${FL[l]}</button>`).join('');d.querySelectorAll('button').forEach(b=>b.onclick=()=>setLang(b.dataset.l))});
$('#sth').onclick=$('#th').onclick=toggleTheme;
/* ===== estantería ===== */
const res={};
async function archiveFind(b){
  const base=b[3]+' AND mediatype:texts AND NOT access-restricted-item:true';
  for(const q of [base+' AND language:(spa OR spanish)',base]){
    const r=await fetch('https://archive.org/advancedsearch.php?q='+encodeURIComponent(q)+'&fl%5B%5D=identifier&fl%5B%5D=imagecount&sort%5B%5D=downloads+desc&rows=15&output=json');
    if(!r.ok)throw 0;
    const d=(await r.json()).response.docs.find(x=>+x.imagecount>=20);
    if(d)return{id:d.identifier,n:+d.imagecount};
  }
  return null;
}
/* Fuente alternativa: Wikisource en español (solo texto, páginas virtuales) */
const WS='https://es.wikisource.org/w/api.php?format=json&origin=*&';
const wj=async q=>{const r=await fetch(WS+q);if(!r.ok)throw 0;return r.json()};
async function wsFind(b){
  const re=new RegExp(b[5],'i');
  try{const p=Object.values((await wj('action=query&redirects=1&prop=info&titles='+encodeURIComponent(b[4]))).query.pages)[0];if(p&&!('missing' in p)&&p.title)return p.title}catch(e){}
  try{const h=(await wj('action=query&list=search&srnamespace=0&srlimit=8&srsearch='+encodeURIComponent(b[4]+' '+b[2]))).query.search.find(x=>re.test(x.title));if(h)return h.title}catch(e){}
  return null;
}
async function wsPages(root){
  let tt=[];
  try{tt=(await wj('action=parse&prop=links&page='+encodeURIComponent(root))).parse.links.filter(l=>l.ns===0&&'exists' in l&&l['*'].startsWith(root+'/')).map(l=>l['*'])}catch(e){}
  tt=[...new Set(tt.length?tt:[root])];const got={};
  for(let i=0;i<tt.length;i+=20){
    const j=await wj('action=query&prop=extracts&explaintext=1&exlimit=20&titles='+encodeURIComponent(tt.slice(i,i+20).join('|')));
    Object.values(j.query.pages).forEach(p=>{got[p.title]=p.extract||''})}
  const paras=[],marks=new Map();
  tt.forEach(t=>{if(tt.length>1){marks.set(paras.length,t.slice(root.length+1));paras.push(t.slice(root.length+1))}
    (got[t]||'').replace(/\r/g,'').replace(/^=+\s*(.*?)\s*=+\s*$/gm,'$1').split('\n').map(x=>x.trim()).filter(Boolean).forEach(x=>{
      if(x.length<=1800)paras.push(x);else x.split(/(?<=[.!?;:])\s+/).forEach(y=>paras.push(y))})});
  const pg=[];let cur=[],len=0;
  const ch=[];paras.forEach((x,i)=>{if(marks.has(i))ch.push({t:marks.get(i),p:pg.length});cur.push(x);len+=x.length;if(len>=1100){pg.push(cur.join(' ¶ '));cur=[];len=0}});
  if(cur.length)pg.push(cur.join(' ¶ '));
  if(pg.join('').length<2000)throw 0;
  return{pg,ch};
}
async function resolve(b){
  if(res[b[0]])return res[b[0]];
  const c=ls.g(K+'id2-'+b[0]);if(c){try{return res[b[0]]=JSON.parse(c)}catch(e){}}
  let o=null;
  if(b[3]){try{o=await archiveFind(b)}catch(e){}}
  if(!o&&b[4]){const t=await wsFind(b);if(t)o={ws:t}}
  if(!o)throw 0;
  ls.s(K+'id2-'+b[0],JSON.stringify(o));return res[b[0]]=o;
}
function shelf(){
  $('#grid').innerHTML=BOOKS.map((b,i)=>`<button class="bk" data-i="${i}"><div class="cv" id="cv${i}"><span>${esc(b[1])}</span></div><b>${esc(b[1])}</b><i>${esc(b[2])}</i></button>`).join('');
  $('#grid').querySelectorAll('.bk').forEach(e=>e.onclick=()=>openBook(+e.dataset.i));
  Promise.all(BOOKS.map(async(b,i)=>{try{const o=await resolve(b);if(!o.ws){const im=new Image();im.onload=()=>{if(im.naturalWidth>40)$('#cv'+i).replaceChildren(im)};im.src=cover(o.id)}}catch(e){const c=$('#cv'+i);if(c)c.closest('.bk').remove()}})).then(()=>{if(!$('#grid .bk'))$('#grid').innerHTML='<p>'+T[lang].err+'</p><button class="pill" id="rt">'+T[lang].retry+'</button>',$('#rt').onclick=shelf});
}
/* ===== apertura ===== */
async function openBook(i,p){
  stopRead();clearTimeout(autoT);closeMenu();closeCMenu();const b=BOOKS[i];msg(T[lang].load,0);$('#rd').hidden=false;$('#shelf').hidden=true;
  try{const o=await resolve(b);bk={i,key:b[0],id:o.id,ws:!!o.ws,title:b[1],tp:null};
    bk.ch=[];if(o.ws){const w=await wsPages(o.ws);bk.pg=w.pg;bk.ch=w.ch;n=bk.pg.length}else n=o.n;
    txtMode=!!o.ws||prefTxt;$('#vw').hidden=!!o.ws;$('#img').hidden=txtMode;txt.hidden=!txtMode;ui();
    page=Math.max(0,Math.min(n-1,p!==undefined?p:(+ls.g(K+'pos-'+b[0])||0)));sub=0;
    ls.s(K+'open',i);$('#tt').textContent=b[1];msg('');document.body.classList.remove('c');paint();chInit();
  }catch(e){msg(T[lang].err,1,()=>openBook(i,p))}
}
function closeBook(){stopRead();clearTimeout(autoT);closeMenu();closeCMenu();$('#chb').hidden=true;ls.d(K+'open');bk=null;$('#rd').hidden=true;$('#shelf').hidden=false;rid++}
function closeMenu(){$('#menu').hidden=true}
function closeCMenu(){$('#cmenu').hidden=true}
/* ===== capítulos e índice ===== */
const CRE=/^[ \t]*((?:cap[ií]tulo|libro|parte|acto|jornada|tratado|leyenda)\s+(?:[ivxlc]+|\d+|primer[oa]?|segund[oa]|tercer[oa]?|cuart[oa]|quint[oa]|sext[oa]|s[eé]ptim[oa]|octav[oa]|noven[oa]|d[eé]cim[oa]|[uú]nic[oa])\b[^\n]{0,50})$/gim;
async function scanCh(B){
  const P=await loadText(),L=P.length,out=[];
  P.forEach((t,k)=>{const hits=[];let m;CRE.lastIndex=0;while((m=CRE.exec(t)))hits.push(m[1].replace(/\s+/g,' ').trim());
    if(!hits.length||hits.length>=4)return;
    const p=Math.abs(L-n)<=1?k:Math.round(k*(n-1)/Math.max(1,L-1));
    hits.forEach(h=>{if(out.slice(-2).some(o=>o.t.toLowerCase()===h.toLowerCase()&&p-o.p<8))return;out.push({t:h.slice(0,70),p:Math.max(0,Math.min(n-1,p))})})});
  return out;
}
function chInit(){
  const B=bk;$('#chb').hidden=!B.ch||B.ch.length<2;if(B.ws)return;
  const c=ls.g(K+'ch1-'+B.key);
  if(c){try{B.ch=JSON.parse(c);$('#chb').hidden=B.ch.length<4;return}catch(e){}}
  scanCh(B).then(ch=>{const ok=ch.length>=4;ls.s(K+'ch1-'+B.key,JSON.stringify(ok?ch:[]));if(bk===B&&ok){B.ch=ch;$('#chb').hidden=false}}).catch(()=>{});
}
$('#chb').onclick=()=>{if(!bk||!bk.ch||!bk.ch.length)return;let cur=0;bk.ch.forEach((x,i)=>{if(x.p<=page)cur=i});
  $('#cmh').textContent=T[lang].ch;$('#cbt').textContent=bk.title;
  $('#clist').innerHTML=bk.ch.map((x,i)=>`<button class="mi" data-p="${x.p}"${i===cur?' aria-current="true"':''}>${esc(x.t)}<i>${T[lang].page} ${x.p+1}</i></button>`).join('');
  $('#clist').querySelectorAll('.mi').forEach(e=>e.onclick=()=>{closeCMenu();page=+e.dataset.p;sub=0;paint()});
  $('#cmenu').hidden=false;const a=$('#clist [aria-current]');if(a)a.scrollIntoView({block:'center'})};
$('#cmenu').onclick=e=>{if(e.target.id==='cmenu')closeCMenu()};
$('#mb').onclick=()=>{$('#mlist').innerHTML=BOOKS.map((b,i)=>!res[b[0]]?'':`<button class="mi" data-i="${i}"${bk&&bk.i===i?' aria-current="true"':''}>${esc(b[1])}<i>${esc(b[2])}</i></button>`).join('');
  $('#mlist').querySelectorAll('.mi').forEach(e=>e.onclick=()=>{const i=+e.dataset.i;closeMenu();if(!bk||i!==bk.i)openBook(i)});$('#menu').hidden=false};
$('#menu').onclick=e=>{if(e.target.id==='menu')closeMenu()};
function msg(t,retry,fn){const m=$('#msg');m.hidden=!t;$('#mt').textContent=t;$('#retry').hidden=!retry;$('#retry').onclick=fn||null}
/* ===== texto OCR ===== */
function loadText(){
  const B=bk;if(!B.tp)B.tp=fetch(`https://archive.org/download/${B.id}/${B.id}_djvu.txt`).then(r=>{if(!r.ok)throw 0;return r.text()}).then(t=>{
    let P=t.split('\f');if(P.length<n*.5){const N=t.length;P=[];let a=0;for(let i=1;i<=n;i++){let b=i<n?t.indexOf('\n',Math.round(i*N/n)):N;if(b<0)b=N;P.push(t.slice(a,b));a=b}}return P}).catch(e=>{B.tp=null;throw e});
  return B.tp;
}
const pageText=async p=>{if(bk.ws)return bk.pg[p]||'';const P=await loadText();const k=Math.abs(P.length-n)<=1?p:Math.round(p*(P.length-1)/Math.max(1,n-1));return clean(P[Math.max(0,Math.min(P.length-1,k))])};
/* ===== ajuste de texto a pantalla (sin scroll) ===== */
const MIN=14,MAX=26,m=$('#meas'),txt=$('#txt');let sc={};
const fits=(s,px)=>{m.innerHTML=html(s);m.style.fontSize=px+'px';return m.scrollHeight<=m.clientHeight+1};
function split(t){
  const w=t.split(/ +/).filter(Boolean);if(!w.length)return[''];
  const out=[];let i=0;
  while(i<w.length){let lo=1,hi=w.length-i,b=1;
    if(fits(w.slice(i).join(' '),MIN))b=hi;else while(lo<=hi){const mid=(lo+hi)>>1;if(fits(w.slice(i,i+mid).join(' '),MIN)){b=mid;lo=mid+1}else hi=mid-1}
    out.push(w.slice(i,i+b).join(' '));i+=b}
  return out;
}
function fitFont(s){let lo=MIN,hi=MAX,b=MIN;for(let k=0;k<7;k++){const x=(lo+hi)/2;if(fits(s,x)){b=x;lo=x}else hi=x}return b}
/* ===== pintar página ===== */
const src=(p,w)=>`https://archive.org/download/${bk.id}/page/n${p}${w?'_w1000':''}.jpg`;
async function paint(){
  const my=++rid,B=bk;ls.s(K+'pos-'+B.key,page);resetZoom();
  if(!txtMode){
    const im=$('#img');im.dataset.f=0;im.alt=B.title+' '+(page+1);im.src=src(page,1);
    for(const k of [page+1,page+2])if(k<n)new Image().src=src(k,1);
    sub=0;ind();armAuto();if(reading)speak();return;
  }
  try{
    const t=await pageText(page);if(my!==rid)return;
    const key=B.key+page+'|'+innerWidth+'x'+innerHeight;
    scr=sc[key]||(sc[key]=split(t));
    sub=sub==='last'?scr.length-1:Math.min(sub,scr.length-1);
    const s=scr[sub];txt.innerHTML=html(s)||'<p>—</p>';txt.style.fontSize=fitFont(s)+'px';ind();armAuto();
    if(reading)speak();
  }catch(e){if(my===rid)msg(T[lang].err,1,()=>{msg('');paint()})}
}
$('#img').onerror=function(){const f=+this.dataset.f||0;this.dataset.f=f+1;
  if(f===0)this.src=src(page,0);else if(f===1)this.src=`https://iiif.archive.org/image/iiif/2/${bk.id}%24${page}/full/!1000,1400/0/default.jpg`;
  else msg(T[lang].err,1,()=>{msg('');paint()})};
function ind(){if(!bk)return;$('#ind').textContent=(page+1)+' / '+n+(txtMode&&scr.length>1?' · '+(sub+1)+'/'+scr.length:'')}
$('#ind').onclick=()=>{const v=parseInt(prompt(T[lang].goto+' (1–'+n+')',page+1));if(v>=1&&v<=n){page=v-1;sub=0;paint()}};
function setView(){if(bk&&bk.ws)return;txtMode=!txtMode;prefTxt=txtMode;$('#img').hidden=txtMode;txt.hidden=!txtMode;sub=0;ui();paint()}
$('#pv').onclick=()=>go(-1);$('#nx').onclick=()=>go(1);
$('#vw').onclick=setView;$('#back').onclick=closeBook;
/* ===== navegación y animación ===== */
function target(d){
  if(txtMode){const s=sub+d;if(s>=0&&s<scr.length)return{page,sub:s}}
  const p=page+d;return p>=0&&p<n?{page:p,sub:txtMode&&d<0?'last':0}:null;
}
const S=$('#sheet');
async function go(d){
  const t=target(d);if(busy||!t)return snap();busy=1;const w=innerWidth;
  S.style.transition='transform .18s ease';S.style.transform=`translateX(${-d*w}px)`;await sleep(180);
  page=t.page;sub=t.sub;await paint();await sleep(30);
  S.style.transition='none';S.style.transform=`translateX(${d*w}px)`;S.offsetWidth;
  S.style.transition='transform .2s ease';S.style.transform='none';setTimeout(()=>busy=0,210);
}
function snap(){S.style.transition='transform .18s ease';S.style.transform='none'}
/* ===== gestos (dedo y ratón) ===== */
const st=$('#stage'),ptr=new Map();let g=null,lastTap=0,tapT=0;
const applyZ=()=>{$('#img').style.transform=z>1?`translate(${tx}px,${ty}px) scale(${z})`:''};
function resetZoom(){z=1;tx=ty=0;applyZ()}
const dist=()=>{const [a,b]=[...ptr.values()];return Math.hypot(a.x-b.x,a.y-b.y)};
st.onpointerdown=e=>{if(busy)return;st.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
  g=ptr.size===2?{pinch:1,d0:dist(),z0:z}:{x0:e.clientX,y0:e.clientY,t0:Date.now(),dx:0,drag:0,tx0:tx,ty0:ty}};
st.onpointermove=e=>{if(!g||!ptr.has(e.pointerId))return;ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(g.pinch&&ptr.size===2&&!txtMode){z=Math.max(1,Math.min(4,g.z0*dist()/g.d0));applyZ();return}
  if(g.pinch)return;
  const dx=e.clientX-g.x0,dy=e.clientY-g.y0;g.dx=dx;
  if(z>1&&!txtMode){g.drag=2;tx=g.tx0+dx;ty=g.ty0+dy;applyZ();return}
  if(g.drag||(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy))){g.drag=1;S.style.transition='none';const lim=!target(dx<0?1:-1);S.style.transform=`translateX(${lim?dx/4:dx}px)`}};
st.onpointerup=st.onpointercancel=e=>{
  ptr.delete(e.pointerId);if(!g)return;const o=g;
  if(o.pinch){if(ptr.size<2){g=ptr.size?{pinch:1,d0:1,z0:z}:null;if(z<1.05)resetZoom()}return}
  g=null;
  if(o.drag===1){const v=Math.abs(o.dx)/(Date.now()-o.t0+1);if(Math.abs(o.dx)>innerWidth*.2||(v>.5&&Math.abs(o.dx)>40))go(o.dx<0?1:-1);else snap();return}
  if(o.drag===2)return;
  if(Math.abs(o.dx)>8)return;
  const x=e.clientX,now=Date.now();
  if(!txtMode&&now-lastTap<300){clearTimeout(tapT);lastTap=0;if(z>1)resetZoom();else{z=2.5;tx=(innerWidth/2-x)*1.5;ty=0;applyZ()}return}
  lastTap=now;clearTimeout(tapT);
  tapT=setTimeout(()=>{const w=innerWidth;if(z>1)return;if(x<w*.18)go(-1);else if(x>w*.82)go(1);else document.body.classList.toggle('c')},txtMode?0:290)};
document.addEventListener('keydown',e=>{if($('#rd').hidden)return;
  if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1);else if(e.key==='Escape'){if(!$('#menu').hidden)closeMenu();else if(!$('#cmenu').hidden)closeCMenu();else closeBook()}
  else if(e.key===' '){e.preventDefault();document.body.classList.toggle('c')}});
addEventListener('resize',()=>{if(bk&&txtMode){clearTimeout(pend);pend=setTimeout(paint,180)}});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{sc={};if(bk&&txtMode)paint()});
/* ===== leer en voz alta ===== */
const syn=window.speechSynthesis,PH=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),
RATES=PH?[.8,1,1.25,1.5]:[.8,1,1.25,1.5,2,2.5,3];
if(!RATES.includes(rate)){rate=1;ls.s(K+'rate',1)}
async function speak(){
  if(!syn)return;const my=++tok;syn.cancel();
  let t;try{t=txtMode?scr[sub]:await pageText(page)}catch(e){return}
  t=t.replace(/(^|[^\p{L}])([áÁóÓ])(?![\p{L}])/gu,(x,a,c)=>a+({'á':'a','Á':'A','ó':'o','Ó':'O'}[c]));
  if(my!==tok)return;
  const parts=(t.replace(/¶/g,'. ').match(/[^.!?;:]+[.!?;:]*\s*/g)||[t]).map(s=>s.trim()).filter(Boolean);
  const v=syn.getVoices().find(v=>v.lang.replace('_','-').toLowerCase().startsWith('es')&&!/^google/i.test(v.name))||null;
  parts.forEach((s,i)=>{const u=new SpeechSynthesisUtterance(s);u.lang=APP.voice;u.rate=rate;if(v)u.voice=v;
    if(i===parts.length-1)u.onend=()=>{if(my!==tok)return;if(auto&&target(1))go(1);else{reading=0;ui();armAuto()}};syn.speak(u)});
}
function stopRead(){reading=0;tok++;if(syn)syn.cancel();ui();armAuto()}
function armAuto(){clearTimeout(autoT);if(auto&&!reading&&bk&&!$('#rd').hidden&&target(1))autoT=setTimeout(()=>{if(auto&&!reading&&bk)go(1)},8000)}
$('#au').onclick=()=>{auto=!auto;ui();armAuto()};
$('#play').onclick=()=>{if(reading)stopRead();else{reading=1;ui();speak()}};
$('#spd').onclick=()=>{rate=RATES[(RATES.indexOf(rate)+1)%RATES.length];ls.s(K+'rate',rate);ui();if(reading)speak()};
/* ===== WhatsApp ===== */
$('#wa').onclick=()=>{if(!bk)return;
  const link=location.origin+location.pathname+'?b='+bk.key+'&p='+(page+1);
  const text=encodeURIComponent(T[lang].share+'\n'+bk.title+' · '+T[lang].page.toLowerCase()+' '+(page+1)+'\n'+link);
  if(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)){
    let left=0;const h=()=>{if(document.hidden)left=1};document.addEventListener('visibilitychange',h);
    location.href='whatsapp://send?text='+text;
    setTimeout(()=>{document.removeEventListener('visibilitychange',h);if(!left&&!document.hidden)location.href='https://wa.me/?text='+text},1500);
  }else window.open('https://web.whatsapp.com/send?text='+text,'whatsapp_web');
};
/* ===== inicio ===== */
ui();shelf();
{const q=new URLSearchParams(location.search),i=BOOKS.findIndex(b=>b[0]===q.get('b')),o=ls.g(K+'open');
 if(i>=0)openBook(i,Math.max(0,(+q.get('p')||1)-1));else if(o!==null&&BOOKS[+o])openBook(+o)}
})();
</script>
