<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{color-scheme:only light}
html{background:#fdd20a;min-height:100%}
html,body{margin:0}
body{background:#fdd20a;font-family:'Inter',system-ui,sans-serif;color:#1b1b1b;min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow-x:hidden}
.wrap{max-width:460px;margin:0 auto;padding-top:18px;padding-bottom:110px;padding-left:max(22px,env(safe-area-inset-left));padding-right:max(22px,env(safe-area-inset-right));display:flex;flex-direction:column;align-items:center}
.cam{position:relative;z-index:2;width:100%;max-width:340px;display:block;mix-blend-mode:multiply}
.camwrap{width:100%;max-width:340px;position:relative;z-index:3;margin-bottom:-6px}
.tray{width:100%;max-width:340px;overflow:hidden;position:relative;z-index:1;display:flex;justify-content:center;padding-bottom:26px}
.print{width:84%;background:#fff;padding:7% 7% 0;border-radius:3px;box-shadow:0 8px 22px rgba(0,0,0,.28);transform:translateY(-104%);transition:transform 3s cubic-bezier(.3,.7,.3,1);display:none}
.print.out{transform:translateY(0)}
.pic{position:relative;width:100%;aspect-ratio:1/1;background:#e9e7dd;overflow:hidden;box-shadow:inset 0 0 6px rgba(0,0,0,.18)}
.pic canvas{position:absolute;inset:0;width:100%;height:100%;opacity:0}
.cap{height:0;padding-bottom:22%;display:flex;align-items:flex-end;justify-content:center;font-family:'Caveat',cursive;font-size:22px;color:#333;position:relative}
.cap span{position:absolute;bottom:34%;left:0;right:0;padding:0 3%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity 1.5s}
.btns{display:flex;gap:12px;width:100%;max-width:340px;margin-top:6px}
button,.btn{flex:1;border:0;border-radius:999px;padding:15px 12px;font:700 15px 'Inter',sans-serif;background:#1b1b1b;color:#fff;text-align:center;text-decoration:none;cursor:pointer}
button.alt{background:#fff;color:#1b1b1b}
button:active{transform:scale(.97)}
input[type=file]{display:none}
.msg{margin:16px 0 0;text-align:center;font-weight:700;min-height:24px}
.bar{width:100%;max-width:340px;height:8px;background:rgba(0,0,0,.15);border-radius:9px;overflow:hidden;margin-top:12px;display:none}
.bar i{display:block;height:100%;width:0;background:#1b1b1b;transition:width .3s}
.shake{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;flex:none;width:80%;max-width:260px;display:none;padding-top:16px;padding-bottom:16px;padding-left:14px;padding-right:14px;background:#fdd20a;color:#1b1b1b;font-size:17px;line-height:1.2;box-shadow:0 0 0 3px #1b1b1b,0 8px 22px rgba(0,0,0,.35);animation:shakePulse 1.4s ease-in-out infinite}
.shake:active{transform:translate(-50%,-50%) scale(.97)}
@keyframes shakePulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.06)}}
.link{background:none;color:#1b1b1b;text-decoration:underline;font:inherit;font-weight:700;padding:0;margin:0;flex:none;border-radius:0;display:inline}
.share{display:none;width:100%;max-width:340px;margin-top:14px}
.share textarea{width:100%;border:0;border-radius:14px;padding:12px;font:500 15px 'Inter',sans-serif;min-height:92px;resize:none;background:#fff}
.share .btns{margin-top:10px}
.wa{background:#25d366}
.elx{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,calc(env(safe-area-inset-bottom) + 8px));background:#1b1b1b;color:#fdd20a;border-radius:999px;padding:12px 18px;font:700 14px 'Inter',sans-serif;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:9;flex:none}
.r2{margin-top:12px}
button:disabled{opacity:.6;cursor:default}
.inst{right:auto;left:max(16px,env(safe-area-inset-left));border:0;cursor:pointer;flex:none}
.inst[hidden]{display:none}
.tip{position:fixed;left:max(16px,env(safe-area-inset-left));right:max(16px,env(safe-area-inset-right));bottom:calc(max(16px,env(safe-area-inset-bottom) + 8px) + 54px);max-width:300px;z-index:10;background:#fff;color:#1b1b1b;border-radius:14px;padding:13px 15px;font:600 14px/1.35 'Inter',sans-serif;box-shadow:0 8px 22px rgba(0,0,0,.28)}
.tip::after{content:"";position:absolute;left:30px;bottom:-6px;width:14px;height:14px;background:#fff;transform:rotate(45deg);border-radius:2px}
.tip[hidden]{display:none}
.tipgo{display:block;width:100%;flex:none;margin-top:10px;padding:11px 12px;font-size:14px}
.tipgo[hidden]{display:none}
</style>
</head>

<script>
const $=id=>document.getElementById(id);
let img=null,p=0,done=false,active=false,last=0,rafOn=false;
// match page background to the yellow of the camera photo
$('cam').onload=()=>{try{const c=document.createElement('canvas');c.width=c.height=2;const x=c.getContext('2d');x.drawImage($('cam'),0,0,2,2);const d=x.getImageData(0,0,1,1).data;document.body.style.background=`rgb(${d[0]},${d[1]},${d[2]})`;}catch(e){}};
$('take').onclick=()=>$('fcam').click();
$('up').onclick=()=>$('fup').click();
// random photo from Wikimedia Commons
let rndBusy=false,curTitle='';
function cleanTitle(t){return (t||'').replace(/^File:/i,'').replace(/\.(jpe?g|png|tiff?)$/i,'').replace(/_/g,' ').trim();}
function loadImg(u){return new Promise((res,rej)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>res(i);i.onerror=rej;i.src=u;});}
async function randomPhoto(){
  if(rndBusy)return;rndBusy=true;const rb=$('rnd');rb.disabled=true;
  $('msg').textContent='Finding a random photo…';
  try{
    for(let a=0;a<4;a++){
      const r=await fetch('https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=random&grnnamespace=6&grnlimit=30&prop=imageinfo&iiprop=url|mime|size&iiurlwidth=1000');
      const j=await r.json();
      const pages=Object.values((j.query&&j.query.pages)||{});
      const c=pages.map(p=>p.imageinfo&&p.imageinfo[0]?Object.assign({},p.imageinfo[0],{ttl:cleanTitle(p.title)}):null).filter(i=>i&&i.mime==='image/jpeg'&&i.width>=800&&i.height>=600&&i.thumburl);
      c.sort(()=>Math.random()-.5);
      for(const i of c.slice(0,3)){
        try{const im=await loadImg(i.thumburl);img=im;curTitle=i.ttl;rndBusy=false;rb.disabled=false;start();return;}catch(_){}
      }
    }
    throw new Error('none');
  }catch(e){$('msg').textContent='Couldn’t get a random photo. Try again.';}
  rndBusy=false;rb.disabled=false;
}
$('rnd').onclick=randomPhoto;
$('fcam').onchange=$('fup').onchange=e=>{const f=e.target.files[0];if(!f)return;const u=URL.createObjectURL(f);const i=new Image();i.onload=()=>{img=i;curTitle='';start();};i.src=u;e.target.value='';};
function drawSquare(ctx,s,x,y){const m=Math.min(img.width,img.height),sx=(img.width-m)/2,sy=(img.height-m)/2;ctx.drawImage(img,sx,sy,m,m,x,y,s,s);}
function start(){
  p=0;done=false;active=false;
  const cv=$('cv');cv.getContext('2d').drawImage(cv,0,0);drawSquare(cv.getContext('2d'),700,0,0);
  apply();
  $('share').style.display='none';$('capt').style.opacity=0;
  const pr=$('print');pr.classList.remove('out');pr.style.display='block';
  void pr.offsetWidth;setTimeout(()=>pr.classList.add('out'),50);
  playEject();
  $('msg').textContent='Your photo is printing...';
  setTimeout(()=>{$('msg').textContent='Shake your iPhone to develop it!';$('bar').style.display='block';$('fill').style.width='0';$('tap').style.display='inline';setupShake();},3000);
}
function apply(){
  const cv=$('cv'),q=Math.pow(p,1.4);
  cv.style.opacity=Math.min(1,q*1.1);
  cv.style.filter=`blur(${(1-p)*9}px) sepia(${(1-p)*.9}) saturate(${.3+p*.7}) brightness(${1+(1-p)*.5})`;
  $('fill').style.width=(p*100)+'%';
  if(p>=1&&!done)finish();
}
function bump(a){if(!img||done)return;active=true;p=Math.min(1,p+a);apply();if(!rafOn){rafOn=true;requestAnimationFrame(drift);}}
function drift(){ if(done){rafOn=false;return;} p=Math.min(1,p+.0025);apply();requestAnimationFrame(drift);}
function finish(){
  done=true;$('msg').textContent='Your Polaroid is ready!';$('tap').style.display='none';$('shake').style.display='none';
  $('capt').textContent=curTitle;$('capt').style.opacity=1;
  $('cv').style.filter='none';$('cv').style.opacity=1;
  $('txt').value='Look at my Polaroid! 📸 Made with https://easylandx.github.io';
  $('share').style.display='block';
  setTimeout(()=>$('share').scrollIntoView({behavior:'smooth',block:'end'}),400);
  if(navigator.vibrate)navigator.vibrate(60);
}
$("tap").onclick=()=>bump(.34);
// shake
let sOn=false,lx=0,ly=0,lz=0;
function setupShake(){
  if(sOn)return;
  const D=window.DeviceMotionEvent;
  if(D&&typeof D.requestPermission==='function'){
    const b=$('shake');b.style.display='block';b.textContent='Tap to enable shake';
    b.onclick=async()=>{try{const r=await D.requestPermission();if(r==='granted'){listen();b.style.display='none';$('msg').textContent='Shake your iPhone now!';}else b.textContent='Shake blocked: use the tap button';}catch(e){b.textContent='Shake not available: use the tap button';}};
  }else if(D){listen();}
}
function listen(){
  if(sOn)return;sOn=true;let got=false,first=true;
  window.addEventListener('devicemotion',ev=>{
    got=true;
    let s=0;
    const g=ev.accelerationIncludingGravity;
    if(g){const x=g.x||0,y=g.y||0,z=g.z||0;if(!first)s=Math.abs(x-lx)+Math.abs(y-ly)+Math.abs(z-lz);lx=x;ly=y;lz=z;first=false;}
    const l=ev.acceleration;
    if(l){const m=Math.sqrt((l.x||0)**2+(l.y||0)**2+(l.z||0)**2);if(m*1.6>s)s=m*1.6;}
    const r=ev.rotationRate;
    if(r){const rr=Math.abs(r.alpha||0)+Math.abs(r.beta||0)+Math.abs(r.gamma||0);if(rr/18>s)s=rr/18;}
    const t=Date.now();
    if(s>9&&t-last>180){last=t;bump(.34);if(navigator.vibrate)navigator.vibrate(25);}
  });
  setTimeout(()=>{if(!got&&!done)$('msg').textContent='No motion detected: tap here to develop';},2500);
}
// build final image
function build(){
  const W=700,pad=50,ph=W-pad*2+0,H=pad+ph+190;
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,W,H);
  x.fillStyle='#e9e7dd';x.fillRect(pad,pad,ph,ph);
  drawSquare(x,ph,pad,pad);
  x.strokeStyle='rgba(0,0,0,.12)';x.lineWidth=2;x.strokeRect(pad,pad,ph,ph);
  if(curTitle){let fs=44,t=curTitle;x.fillStyle='#333';x.textAlign='center';x.font='600 '+fs+'px Caveat, cursive';while(x.measureText(t).width>ph&&fs>26){fs-=2;x.font='600 '+fs+'px Caveat, cursive';}while(x.measureText(t).width>ph&&t.length>1){t=t.slice(0,-1);}if(t!==curTitle)t=t.trim()+'…';x.fillText(t,W/2,pad+ph+110);}
  return c;
}
function blob(){return new Promise(r=>build().toBlob(r,'image/jpeg',.92));}
$('save').onclick=async()=>{
  const b=await blob();const f=new File([b],'polaroid.jpg',{type:'image/jpeg'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});return;}catch(e){if(e.name==='AbortError')return;}}
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='polaroid.jpg';document.body.appendChild(a);a.click();a.remove();
};
$('wa').onclick=async()=>{
  const text=$('txt').value;const b=await blob();const f=new File([b],'polaroid.jpg',{type:'image/jpeg'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],text});return;}catch(e){if(e.name==='AbortError')return;}}
  window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank');
};
// camera sound effects
function playEject(){
  try{const A=new (window.AudioContext||window.webkitAudioContext)();
  const o=A.createOscillator(),g=A.createGain();o.type='sawtooth';o.frequency.setValueAtTime(90,A.currentTime);o.frequency.linearRampToValueAtTime(140,A.currentTime+1.6);
  g.gain.setValueAtTime(.0001,A.currentTime);g.gain.exponentialRampToValueAtTime(.12,A.currentTime+.1);g.gain.exponentialRampToValueAtTime(.0001,A.currentTime+2.2);
  o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+2.3);}catch(e){}
}
// PWA: service worker + install button
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('polapro-sw.js',{scope:'./'}).catch(()=>{}));}
(function(){
  const b=$('install'),tip=$('tip'),tt=$('tiptxt'),tb=$('tipgo');
  const ua=navigator.userAgent;
  const ios=/iPad|iPhone|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const android=/Android/i.test(ua);
  const phone=ios||android;
  const safariDesk=!phone&&/^((?!chrome|chromium|crios|fxios|edg|android).)*safari/i.test(ua);
  const mq=matchMedia('(display-mode: standalone)');
  const standalone=()=>mq.matches||navigator.standalone===true;
  function sync(){b.hidden=standalone();if(b.hidden)tip.hidden=true;}
  // opens the browser's own install popup (when the browser offers it)
  function native(){
    const e=window.__pp;if(!e)return false;
    window.__pp=null;
    try{e.prompt();}catch(_){return false;}
    try{e.userChoice.then(r=>{if(r&&r.outcome==='accepted'){b.hidden=true;tip.hidden=true;}}).catch(()=>{});}catch(_){}
    return true;
  }
  function fill(){
    let t='',go=false;
    if(ios){t='To install: tap the Share icon in your browser’s toolbar, then choose “Add to Home Screen”.';}
    else if(android){
      if(window.__pp){t='Add PolaPro to your home screen so it opens like a normal app.';go=true;}
      else t='To install: tap the browser menu (⋮), then choose “Install app” or “Add to Home screen”.';
    }
    else if(safariDesk){t='To install: in Safari, choose File → Add to Dock.';}
    else{t='To install: click the install icon at the right of the address bar, or open the browser menu and choose “Install PolaPro”.';}
    tt.textContent=t;tb.hidden=!go;
  }
  b.onclick=()=>{
    if(!tip.hidden){tip.hidden=true;return;}
    if(!phone&&native())return;      // computer: straight to the browser's install popup
    fill();tip.hidden=false;         // phone (or no popup available): short how-to
  };
  tb.onclick=()=>{native();tip.hidden=true;};
  document.addEventListener('click',e=>{if(!tip.hidden&&!tip.contains(e.target)&&e.target!==b)tip.hidden=true;});
  window.addEventListener('pp-ready',()=>{if(!tip.hidden)fill();});
  window.addEventListener('appinstalled',()=>{window.__pp=null;b.hidden=true;tip.hidden=true;});
  if(mq.addEventListener)mq.addEventListener('change',sync);
  sync();
})();
</script>
</body>
</html>
